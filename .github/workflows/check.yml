name: シート内容チェック

on:
  workflow_dispatch:
    inputs:
      month:
        description: "サンプル表示する対象月 YYYY-MM（省略可）"
        required: false
        default: "2026-06"

env:
  TZ: Asia/Tokyo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install google-api-python-client google-auth

      - name: サービスアカウントJSONの復元
        env:
          SA_RAW: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SA_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          mkdir -p credentials
          if [ -n "$SA_RAW" ]; then
            printf '%s' "$SA_RAW" > credentials/service_account.json
          elif [ -n "$SA_B64" ]; then
            printf '%s' "$SA_B64" | tr -d ' \t\r\n' | base64 -d > credentials/service_account.json
          else
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON が未設定です"; exit 1
          fi

      - name: シート内容サマリ
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
        run: python tools/sheet_report.py "${{ inputs.month }}"
