name: dash-dump
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/dash_dump.yml']
  workflow_dispatch: {}
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: dump
        run: |
          cat > d.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const EXEC='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function frameWhen(page, testFn){ const dl=Date.now()+70000; while(Date.now()<dl){ for(const f of page.frames()){ try{ if(await f.evaluate(testFn)) return f; }catch(e){} } await sleep(500);} throw new Error('frame'); }
          function callRun(frame, fn, args){ return frame.evaluate(({fn,args})=> new Promise((res,rej)=>{ const to=setTimeout(()=>rej('timeout:'+fn),60000); try{ const r=google.script.run.withSuccessHandler(x=>{clearTimeout(to);res(x);}).withFailureHandler(e=>{clearTimeout(to);rej('fail:'+String(e&&e.message||e));}); r[fn].apply(r,args);}catch(e){clearTimeout(to);rej('throw:'+String(e));} }), {fn,args}); }
          function daysInMonth(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);return new Date(y,m,0).getDate();}
          function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;var d=new Date(y,m-1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
          function invOf(DATA,ym,st){var iv=(DATA.inventory[ym]||{})[st];if(!iv)return null;if(((iv.food||0)+(iv.drink||0))===0)return null;return (iv.food||0)+(iv.drink||0);}
          function calcFD(DATA,st,ym){
            var m=(DATA.metrics[ym]||{})[st]; var invCur=invOf(DATA,ym,st);
            if(!m && invCur===null) return null; m=m||{};
            var d=daysInMonth(ym); var sales=m.sales||0;
            var purchase=(m.foodPurchase||0)+(m.drinkPurchase||0);
            var theory=(m.foodTheory||0)+(m.drinkTheory||0);
            var fs=m.foodSales||0, ds=m.drinkSales||0; var pct2=(fs+ds)*0.02;
            var inc2=!!((DATA.storeFlags||{})[st]); if(!inc2) theory+=pct2;
            var invPrev=invOf(DATA,prevYm(ym),st);
            var ls=((DATA.losses[ym]||{})[st])||[]; var need=0,waste=0,adj=0;
            ls.forEach(function(l){ if(l.kind==='必要ロス')need+=l.amount; else if(l.kind==='廃棄ロス')waste+=l.amount; else if(l.kind==='理論原価')adj+=l.amount; });
            theory+=adj;
            var actual=(invPrev!==null&&invCur!==null)?invPrev+purchase-invCur:null;
            var unknown=actual!==null?actual-theory-need-waste:null;
            var td=(m.kind==='中間')?15:d;
            var turnover=(invCur!==null&&theory>0)?invCur/(theory/td):null;
            return { kind:m.kind||'', sales:sales, purchase:purchase, theory:Math.round(theory),
              invPrev:invPrev, invCur:invCur, actual:actual, need:need, waste:waste, unknown:unknown,
              turnover:turnover, unknownRate:(sales&&unknown!==null)?unknown/sales:null, purchaseRate:sales?purchase/sales:null };
          }
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={};
          try{
            const p=await (await browser.newContext()).newPage();
            await p.goto(EXEC+'?p=8888',{waitUntil:'load',timeout:70000});
            const f=await frameWhen(p, ()=> (typeof google!=='undefined'&&google.script&&google.script.run));
            const DATA=await callRun(f,'getDashboardData',['8888',true]);
            var MS=['2026-08','2026-09'];
            var stores=(DATA.stores||[]).map(function(s){return {key:s.key,name:s.name};});
            var rows={}; MS.forEach(function(ym){ rows[ym]=[]; stores.forEach(function(s){ var r=calcFD(DATA,s.key,ym); if(r){ r.name=s.name; r.key=s.key; rows[ym].push(r);} }); });
            out.data={ months:MS, updatedAt:DATA.updatedAt||'', rows:rows };
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(0);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node d.mjs
