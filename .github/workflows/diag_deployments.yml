name: 診断 デプロイ一覧

# 稼働中のデプロイ構成を調べるための一時的な診断ワークフロー（手動実行のみ）。
# clasp deployments を表示して、Webアプリの /exec がどのデプロイか・版ずれが無いかを確認する。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: clasp をインストール
        run: npm install -g @google/clasp@2.4.2
      - name: 認証情報を復元
        env:
          RC: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$RC" > "$HOME/.clasprc.json"
      - name: .clasp.json を作成
        working-directory: gas/dashboard
        env:
          SID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: printf '{"scriptId":"%s","rootDir":"."}' "$SID" > .clasp.json
      - name: デプロイ一覧
        working-directory: gas/dashboard
        run: |
          echo "===== clasp deployments ====="
          clasp deployments || true
      - name: 匿名アクセス確認（ランナーは未ログイン＝担当者と同条件）
        run: |
          BASE="https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec"
          echo "===== 1) 素の /exec ====="
          curl -sS -L -o main.html -w "http=%{http_code} final=%{url_effective}\n" "$BASE" || true
          echo "--- 先頭300字 ---"; head -c 300 main.html; echo
          echo "===== 2) /exec?input=1（無効トークン）====="
          curl -sS -L -o in.html -w "http=%{http_code} final=%{url_effective}\n" "$BASE?input=1&s=test&ym=2025-01&t=bad" || true
          echo "--- 先頭300字 ---"; head -c 300 in.html; echo
          echo "===== 判定 ====="
          if grep -qi 'accounts.google.com\|Sign in\|ログイン' main.html; then echo "→ 素の/execもログイン要求＝@79は匿名不可（アクセス設定が全員になっていない）"; else echo "→ 素の/execは匿名OKの可能性"; fi
