name: 診断 レンダリング

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright(Chromium)導入
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: サーバ生レスポンス確認
        run: |
          cat > r.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?input=1&s=0001006&ym=2026-08&t=CItAtAllr832nybq7g7H3-mChMqMMhQauRU26M47c0M';
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errs = [];
            page.on('pageerror', e => errs.push('[pageerror] '+(e && e.message)));
            page.on('dialog', d => d.accept());
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e=>errs.push('[goto] '+e.message));
            await page.waitForTimeout(6000);
            let fr = null;
            for (const f of page.frames()) { try { if (await f.evaluate(()=>!!document.getElementById('sumtbl'))) { fr = f; break; } } catch(e){} }
            if (!fr) { console.log('!! フレーム無'); await browser.close(); return; }
            // フレーム内で google.script.run を Promise 化して直接呼ぶユーティリティ
            const dump = async (label) => {
              const res = await fr.evaluate(() => new Promise((resolve) => {
                google.script.run.withSuccessHandler(r=>resolve(r)).withFailureHandler(e=>resolve({__err:String(e&&e.message)})).getInputPageData(STORE, YM, TOKEN);
              }));
              return res;
            };
            const meta = await fr.evaluate(()=>({ STORE:window.STORE, YM:window.YM, TOKENlen:(window.TOKEN||'').length }));
            console.log('CLIENT:', JSON.stringify(meta));
            let before = await dump('before');
            console.log('BEFORE items=' + (before.items?before.items.length:'?') + ' ok=' + before.ok);
            // 追加
            const memo = 'zzDIAG'+Date.now();
            const save = await fr.evaluate((m) => new Promise((resolve) => {
              google.script.run.withSuccessHandler(r=>resolve(r)).withFailureHandler(e=>resolve({__err:String(e&&e.message)}))
                .saveInputLosses(STORE, YM, TOKEN, [{kind:'廃棄ロス',cat:'フード',amount:1,memo:m,name:''}]);
            }, memo);
            console.log('SAVE:', JSON.stringify(save));
            await page.waitForTimeout(2500);
            let after = await dump('after');
            console.log('AFTER items=' + (after.items?after.items.length:'?'));
            if (after.items) after.items.forEach(it => console.log('  item id='+it.id+' ym? kind='+it.kind+' cat='+it.cat+' memo='+it.memo));
            // 後片付け: zzDIAG を含む項目を全部削除
            if (after.items) {
              for (const it of after.items) {
                if ((it.memo||'').indexOf('zzDIAG')===0 || (it.memo||'').indexOf('zz診断')===0) {
                  const d = await fr.evaluate((id) => new Promise((resolve)=>{ google.script.run.withSuccessHandler(r=>resolve(r)).withFailureHandler(e=>resolve({__err:String(e&&e.message)})).deleteInputLoss(STORE,YM,TOKEN,id); }), it.id);
                  console.log('  cleanup del '+it.id+' -> '+JSON.stringify(d));
                }
              }
            }
            console.log('=== errs ('+errs.length+') ==='); errs.forEach(e=>console.log(e));
            await browser.close();
          })().catch(e => { console.error('FATAL', e); process.exit(1); });
          JS
          node r.js
