name: 診断 レンダリング

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright(Chromium)導入
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: 入力ページを実レンダリング
        run: |
          cat > r.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?input=1&s=0001006&ym=2026-08&t=CItAtAllr832nybq7g7H3-mChMqMMhQauRU26M47c0M';
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errs = [];
            page.on('console', m => { if (m.type()==='error') errs.push('[console.error] '+m.text()); });
            page.on('pageerror', e => errs.push('[pageerror] '+(e && e.message)));
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e=>errs.push('[goto] '+e.message));
            await page.waitForTimeout(6000);
            console.log('=== フレーム一覧 ===');
            for (const f of page.frames()) {
              let txt = '';
              try { txt = (await f.evaluate(() => document.body ? document.body.innerText : '')).slice(0, 500); } catch(e){ txt='(読めず: '+e.message+')'; }
              if (txt && txt.trim()) console.log('--- frame '+f.url().slice(0,60)+' ---\n'+txt+'\n');
            }
            console.log('=== JSエラー ('+errs.length+') ===');
            errs.forEach(e => console.log(e));
            await browser.close();
          })().catch(e => { console.error('FATAL', e); process.exit(1); });
          JS
          node r.js
