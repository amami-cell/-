name: 診断 レンダリング

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright導入
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: アプリ本体の包みをレンダリング
        run: |
          cat > r.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://amami-cell.github.io/-/app.html?p=8888';
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const errs = [];
            page.on('pageerror', e => errs.push('[pageerror] '+(e && e.message)));
            await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 }).catch(e=>errs.push('[goto] '+e.message));
            await page.waitForTimeout(8000);
            console.log('=== フレーム別テキスト ===');
            for (const f of page.frames()) {
              let txt=''; try { txt=(await f.evaluate(()=>document.body?document.body.innerText:'')).slice(0,400); } catch(e){}
              if (txt && txt.trim()) console.log('--- '+f.url().slice(0,55)+' ---\n'+txt+'\n');
            }
            console.log('=== JSエラー ('+errs.length+') ==='); errs.forEach(e=>console.log(e));
            await browser.close();
          })().catch(e => { console.error('FATAL', e); process.exit(1); });
          JS
          node r.js
