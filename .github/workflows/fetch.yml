name: 棚卸データ自動取得

on:
  workflow_dispatch:
    inputs:
      month:
        description: "対象月 YYYY-MM（空欄なら前月を自動選択）"
        required: false
        default: ""
      target:
        description: "取得対象（check=取得せずシート内容の確認のみ）"
        type: choice
        options:
          - fw
          - infomart
          - both
          - check
        default: fw
      fw_from:
        description: "FW一括取得の開始月 YYYY-MM（指定すると開始月〜対象月を一括取得）"
        required: false
        default: ""
      stores:
        description: "対象店舗の部分一致フィルタ（FW一括取得のみ。例: NagaGutsu／空なら全店舗）"
        required: false
        default: ""
      interim:
        description: "中間として取得（当月1〜15日・手動テスト用。対象月が空なら当月）"
        type: boolean
        default: false
      push:
        description: "プッシュ通知の手動テスト（dry=送らず内容確認 / send=実際に配信）"
        type: choice
        options:
          - "none"
          - "dry"
          - "send"
        default: "none"
      line:
        description: "棚卸未入力のLINE報告 手動テスト（dry=送らず内容確認 / send=実際に配信）"
        type: choice
        options:
          - "none"
          - "dry"
          - "send"
        default: "none"
  schedule:
    # 毎月3〜5日 09:00 JST (= 00:00 UTC): 前月分の確定（月末棚卸）をFW＋インフォマートで取得
    # 毎月16〜20日 09:00 JST: 当月分の中間（1〜15日）をFW＋インフォマート中間棚で取得
    # （同月・同店舗は上書きされるため、毎日最新の値に置き換わる。確定取得時に中間行は自動削除）
    - cron: "0 0 3-5,16-20 * *"

env:
  TZ: Asia/Tokyo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージのインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Secrets の設定確認
        env:
          FW_ID: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FW_PW: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
          SA_RAW: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SA_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          missing=""
          [ -z "$FW_ID" ] && missing="$missing FOODIST_JOURNAL_USER_ID"
          [ -z "$FW_PW" ] && missing="$missing FOODIST_JOURNAL_PASSWORD"
          [ -z "$SA_RAW" ] && [ -z "$SA_B64" ] && missing="$missing GOOGLE_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::error::以下のSecretsが未設定です:$missing （リポジトリの Settings > Secrets and variables > Actions で登録してください）"
            exit 1
          fi

      # 推奨: GOOGLE_SERVICE_ACCOUNT_JSON に service_account.json の中身をそのまま貼る。
      # 旧方式: GOOGLE_SERVICE_ACCOUNT_JSON_B64（Base64文字列）も引き続き使用可。
      - name: サービスアカウントJSONの復元
        env:
          SA_RAW: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SA_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          mkdir -p credentials
          if [ -n "$SA_RAW" ]; then
            printf '%s' "$SA_RAW" > credentials/service_account.json
          elif printf '%s' "$SA_B64" | grep -q '"private_key"'; then
            # B64側に生JSONが貼られていた場合
            printf '%s' "$SA_B64" > credentials/service_account.json
          else
            # 空白・改行・certutil形式のヘッダ行を除去してからデコード
            printf '%s' "$SA_B64" | tr -d ' \t\r\n' | sed 's/-----[A-Za-z ]*-----//g' \
              | base64 -d > credentials/service_account.json 2>/dev/null || {
              len=$(printf '%s' "$SA_B64" | wc -c)
              bad=$(printf '%s' "$SA_B64" | tr -d 'A-Za-z0-9+/=_\-. \t\r\n' | wc -c)
              echo "::error::Base64デコード失敗（文字数=${len}, Base64以外の文字数=${bad}）。Secret GOOGLE_SERVICE_ACCOUNT_JSON に service_account.json の中身をそのまま貼る方式に切り替えてください（docs/cloud-setup.md 参照）"
              exit 1
            }
          fi
          python -c "import json; d=json.load(open('credentials/service_account.json')); assert 'private_key' in d" \
            || { echo "::error::サービスアカウントJSONとして読めません。Secret GOOGLE_SERVICE_ACCOUNT_JSON に service_account.json の中身をそのまま貼り直してください"; exit 1; }

      # 現行コードは headless=False（画面表示前提）のため xvfb（仮想ディスプレイ）上で実行する
      - name: FW（Fooding Journal）取得
        if: github.event_name == 'schedule' || inputs.target == 'fw' || inputs.target == 'both'
        id: fw
        env:
          FOODIST_JOURNAL_USER_ID: ${{ secrets.FOODIST_JOURNAL_USER_ID }}
          FOODIST_JOURNAL_PASSWORD: ${{ secrets.FOODIST_JOURNAL_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
        run: |
          MONTH="${{ inputs.month }}"
          FW_FROM="${{ inputs.fw_from }}"
          DAY=$(date +%d)
          if [ "${{ inputs.interim }}" = "true" ]; then
            # 手動テスト: 中間として取得（対象月が空なら当月）
            M="$MONTH"; [ -z "$M" ] && M=$(date +%Y-%m)
            echo "手動テスト: $M を中間取得"
            xvfb-run -a python main.py --foodist-only --interim --month "$M"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$DAY" -ge 16 ] && [ "$DAY" -le 20 ]; then
            # 月中（16〜20日）の自動実行: 当月を「中間（1〜15日）」として取得
            CUR=$(date +%Y-%m)
            echo "月中スケジュール: 当月 $CUR を中間取得"
            xvfb-run -a python main.py --foodist-only --interim --month "$CUR"
          elif [ -n "$FW_FROM" ]; then
            TO="$MONTH"
            [ -z "$TO" ] && TO=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m)
            STORES_ARG=""
            [ -n "${{ inputs.stores }}" ] && STORES_ARG="--stores ${{ inputs.stores }}"
            echo "FW一括取得: $FW_FROM 〜 $TO ${STORES_ARG:+（店舗: ${{ inputs.stores }}）}"
            xvfb-run -a python main.py --foodist-all --from "$FW_FROM" --to "$TO" $STORES_ARG
          else
            ARGS=""
            [ -n "$MONTH" ] && ARGS="--month $MONTH"
            xvfb-run -a python main.py --foodist-only $ARGS
          fi

      - name: インフォマート取得
        if: github.event_name == 'schedule' || inputs.target == 'infomart' || inputs.target == 'both'
        env:
          INFOMART_USER_ID: ${{ secrets.INFOMART_USER_ID }}
          INFOMART_PASSWORD: ${{ secrets.INFOMART_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
          # サービスアカウントはDriveに保存不可（Google仕様）のためアップロードを省略
          SKIP_DRIVE_UPLOAD: "1"
        run: |
          if [ -z "$INFOMART_USER_ID" ] || [ -z "$INFOMART_PASSWORD" ]; then
            echo "::error::INFOMART_USER_ID / INFOMART_PASSWORD が未設定です"
            exit 1
          fi
          ARGS=""
          MONTH="${{ inputs.month }}"
          DAY=$(date +%d)
          if [ "${{ inputs.interim }}" = "true" ]; then
            M="$MONTH"; [ -z "$M" ] && M=$(date +%Y-%m)
            ARGS="--month $M"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$DAY" -ge 16 ] && [ "$DAY" -le 20 ]; then
            # 月中（16〜20日）の自動実行: 当月の中間棚を取得
            ARGS="--month $(date +%Y-%m)"
          elif [ -n "$MONTH" ]; then
            ARGS="--month $MONTH"
          fi
          # 特定店舗だけの再取得（未取得アラートからの再取得など）。手動実行のみ。
          # store_id をスペース区切りで受け取り、--stores に渡す（未指定なら全店舗）。
          if [ -n "${{ inputs.stores }}" ] && [ "${{ github.event_name }}" != "schedule" ]; then
            ARGS="$ARGS --stores ${{ inputs.stores }}"
            echo "インフォマート店舗指定取得: ${{ inputs.stores }}"
          fi
          xvfb-run -a python main.py $ARGS

      # 棚卸プッシュ通知の配信。schedule(3-5日/16-20日)は自動で内容を判定して配信。
      # 手動実行では push=dry（送らず内容確認）/ send（実配信）で動作確認できる。
      # VAPID_PRIVATE_KEY 未設定なら送信はスキップ（購読の保存は先に動く）。
      - name: 棚卸プッシュ通知
        if: github.event_name == 'schedule' || inputs.push == 'dry' || inputs.push == 'send'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python tools/tana_push.py --auto || echo "::warning::プッシュ通知の送信でエラー"
          elif [ "${{ inputs.push }}" = "dry" ]; then
            python tools/tana_push.py --kinds pending_interim,pending_final,alert,forecast,summary --dry-run
          else
            python tools/tana_push.py --kinds pending_interim,pending_final,alert,forecast,summary
          fi

      # 棚卸「未入力店」のLINE報告。最終取得日（5日=前月・月末棚／20日=当月・中間棚）に、
      # まだ入っていない店舗をLINE（Messaging API）へ自動報告する。
      # LINE_CHANNEL_TOKEN 未設定なら送信はスキップ（エラーで全体を止めない）。
      - name: 棚卸 未入力LINE報告
        if: github.event_name == 'schedule' || inputs.line == 'dry' || inputs.line == 'send'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date +%d)
            if [ "$DAY" = "05" ] || [ "$DAY" = "20" ]; then
              python tools/tana_line.py --auto || echo "::warning::LINE報告でエラー"
            else
              echo "本日は最終報告日(5/20)ではないためLINE報告はスキップ"
            fi
          elif [ "${{ inputs.line }}" = "dry" ]; then
            python tools/tana_line.py --mode final --dry-run
            python tools/tana_line.py --mode interim --dry-run
          else
            python tools/tana_line.py --mode final
          fi

      # FW Excelのセル構造調査（フード売上/ドリンク売上の位置特定用・xlsxがある時のみ）
      - name: FW Excel構造スキャン
        if: always()
        run: python tools/excel_scan.py || echo "::warning::Excelスキャン失敗"

      # 書き込み結果の確認: 各シートの年月×種別ごとの行数と対象月のサンプルを表示
      - name: シート内容チェック
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ./credentials/service_account.json
        run: python tools/sheet_report.py "${{ inputs.month }}" || echo "::warning::シート内容チェックに失敗しました"

      # 成否に関わらずログ・スクリーンショットを保存（失敗時の原因調査用）
      - name: ログ・スクリーンショットの保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}-logs
          path: |
            logs/
            screenshots/
            downloads/
          if-no-files-found: ignore
          retention-days: 14
