name: shiai-check
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/shiai_check.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: shiai check
        run: |
          cat > sc.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const EXEC = 'https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec';
          const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
          async function frameWhen(page, testFn, label){
            const dl=Date.now()+70000;
            while(Date.now()<dl){ for(const f of page.frames()){ try{ if(await f.evaluate(testFn)) return f; }catch(e){} } await sleep(500); }
            throw new Error('frame not ready: '+label);
          }
          function callRun(frame, fn, args){
            return frame.evaluate(({fn,args})=> new Promise((res,rej)=>{
              const to=setTimeout(()=>rej('timeout:'+fn),60000);
              try{ const r=google.script.run.withSuccessHandler(x=>{clearTimeout(to);res(x);}).withFailureHandler(e=>{clearTimeout(to);rej('fail:'+String(e&&e.message||e));}); r[fn].apply(r,args);}catch(e){clearTimeout(to);rej('throw:'+String(e));}
            }), {fn,args});
          }
          const browser = await chromium.launch({args:['--no-sandbox']});
          const out = {};
          try{
            const p = await (await browser.newContext()).newPage();
            await p.goto(EXEC+'?p=8888', {waitUntil:'load', timeout:70000});
            const f = await frameWhen(p, ()=> (typeof google!=='undefined'&&google.script&&google.script.run), 'main');
            const data = await callRun(f,'getDashboardData',['8888', true]);
            const M = data.metrics||{}, INV = data.inventory||{};
            const months = (data.months||[]).filter(ym=> ym>='2026-06');
            const stores = ['0001151_NagaGutsu','0001168_GOLD京都ポルタ店','0001006_大衆寿司酒場すさび湯'];
            out.perStore = {};
            stores.forEach(function(st){
              out.perStore[st] = {};
              months.forEach(function(ym){
                const m = (M[ym]||{})[st] || {};
                const iv = (INV[ym]||{})[st] || {};
                out.perStore[st][ym] = {
                  foodPurchase: m.foodPurchase, drinkPurchase: m.drinkPurchase, sales: m.sales,
                  invFood: iv.food, invDrink: iv.drink
                };
              });
            });
            out.months = months;
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(0);
          }catch(err){
            out.error=String(err&&err.stack||err);
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            try{ await browser.close(); }catch(e){} process.exit(2);
          }
          SCRIPT
          node sc.mjs
