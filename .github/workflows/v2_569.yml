name: v2-569
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_569.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: check 5/6/9
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const KEY='0001151_NagaGutsu';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[]};
          try{
            const p=await (await browser.newContext()).newPage();
            p.on('console',m=>{ if(m.type()==='error') out.errors.push(m.text()); });
            p.on('pageerror',e=>out.errors.push('pageerror:'+String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            let fr=null; const dl=Date.now()+70000;
            while(Date.now()<dl){ for(const f of p.frames()){ try{ if(await f.evaluate(()=>document.querySelector('.sb-brand')!=null)){fr=f;break;} }catch(e){} } if(fr)break; await sleep(500); }
            if(!fr) throw new Error('frame');
            const d2=Date.now()+40000; let ready=false;
            while(Date.now()<d2){ try{ ready=await fr.evaluate(()=>{var l=document.getElementById('load');var t=document.querySelector('tbody tr');return (l&&l.style.display==='none')&&!!t;}); }catch(e){} if(ready)break; await sleep(800); }
            await fr.evaluate(()=>{ if(window.setMonth) window.setMonth('2026-09'); });
            // 6: クラウド再取得ボタン
            out.fetchBtns = await fr.evaluate(()=>[...document.querySelectorAll('button')].filter(b=>/FW取込|インフォマート/.test(b.textContent)).length);
            // ドロワーを開く
            await fr.evaluate((k)=>window.openDrawer(k), KEY); await sleep(500);
            // 5: F/D/FD テーブル（ヘッダにフード/ドリンク、本体9行）
            out.table = await fr.evaluate(()=>{ var h=[...document.querySelectorAll('.dtbl thead td')].map(e=>e.textContent); var rows=document.querySelectorAll('.dtbl tbody tr').length; return {head:h, rows:rows}; });
            // 9: 催促ボタン、理論原価トグル
            out.catchupBtn = await fr.evaluate(()=>[...document.querySelectorAll('.drawer footer button')].some(b=>b.textContent.indexOf('催促')>=0));
            out.theoryToggleHiddenInitially = await fr.evaluate(()=>document.getElementById('aThmode').style.display==='none');
            await fr.evaluate(()=>{ document.getElementById('aKind').value='理論原価'; window.onKindChange(); });
            out.theoryToggleShownForTheory = await fr.evaluate(()=>document.getElementById('aThmode').style.display==='flex');
            await fr.evaluate(()=>window.setTheoryMode('set'));
            out.setModePlaceholder = await fr.evaluate(()=>document.getElementById('aAmt').placeholder);
            // 9: その場編集（既存ロスの✎でフォームに値が入る）
            out.hasEditBtn = await fr.evaluate(()=>!!document.querySelector('.ledit'));
            if(out.hasEditBtn){ await fr.evaluate(()=>document.querySelector('.ledit').click()); await sleep(200);
              out.editFilled = await fr.evaluate(()=>({ amt:document.getElementById('aAmt').value, memo:document.getElementById('aMemo').value, submit:document.getElementById('aSubmit').textContent, cancelShown:document.getElementById('aCancel').style.display==='block' })); }
            out.PASS = ready && out.errors.length===0 && out.fetchBtns>=2 && out.table.rows===9 && out.table.head.indexOf('フード')>=0 && out.table.head.indexOf('ドリンク')>=0 && out.catchupBtn===true && out.theoryToggleShownForTheory===true && /訂正後/.test(out.setModePlaceholder||'') && out.hasEditBtn===true && out.editFilled && out.editFilled.submit==='修正を保存' && out.editFilled.amt!=='';
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
