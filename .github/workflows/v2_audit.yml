name: v2-audit
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_audit.yml']
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (browser only)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install chromium
      - name: audit
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const YM='2026-09';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function frameWhen(page, testFn){ const dl=Date.now()+70000; while(Date.now()<dl){ for(const f of page.frames()){ try{ if(await f.evaluate(testFn)) return f; }catch(e){} } await sleep(500);} throw new Error('frame'); }
          function callRun(frame, fn, args){ return frame.evaluate(({fn,args})=> new Promise((res,rej)=>{ const to=setTimeout(()=>rej('timeout'),60000); try{ const r=google.script.run.withSuccessHandler(x=>{clearTimeout(to);res(x);}).withFailureHandler(e=>{clearTimeout(to);rej(String(e&&e.message||e));}); r[fn].apply(r,args);}catch(e){clearTimeout(to);rej(String(e));} }), {fn,args}); }
          // 独立計算（旧calcMの式を移植・FD）
          function daysInMonth(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);return new Date(y,m,0).getDate();}
          function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;var d=new Date(y,m-1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
          function invOf(D,ym,st){var iv=(D.inventory[ym]||{})[st];if(!iv)return null;if(((iv.food||0)+(iv.drink||0))===0)return null;return (iv.food||0)+(iv.drink||0);}
          function calc(D,st,ym){ var m=(D.metrics[ym]||{})[st]; var invCur=invOf(D,ym,st); if(!m&&invCur===null)return null; m=m||{};
            var d=daysInMonth(ym); var purchase=(m.foodPurchase||0)+(m.drinkPurchase||0); var theory=(m.foodTheory||0)+(m.drinkTheory||0);
            var pct2=((m.foodSales||0)+(m.drinkSales||0))*0.02; if(!((D.storeFlags||{})[st])) theory+=pct2;
            var invPrev=invOf(D,prevYm(ym),st); var ls=((D.losses[ym]||{})[st])||[]; var need=0,waste=0,adj=0;
            ls.forEach(function(l){ if(l.kind==='必要ロス')need+=l.amount; else if(l.kind==='廃棄ロス')waste+=l.amount; else if(l.kind==='理論原価')adj+=l.amount; }); theory+=adj;
            var actual=(invPrev!==null&&invCur!==null)?invPrev+purchase-invCur:null; var unknown=actual!==null?actual-theory-need-waste:null;
            var td=(m.kind==='中間')?15:d; var turnover=(invCur!==null&&theory>0)?invCur/(theory/td):null;
            return {unknown:unknown, turnover:turnover}; }
          function pYen(s){ if(!s||s.indexOf('—')>=0) return null; var n=Number(s.replace(/[¥,\s]/g,'')); return isNaN(n)?null:n; }
          function pDay(s){ if(!s||s.indexOf('—')>=0) return null; var n=parseFloat(s); return isNaN(n)?null:n; }
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[],mismatch:[]};
          try{
            const p=await (await browser.newContext()).newPage();
            p.on('pageerror',e=>out.errors.push(String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            const fr=await frameWhen(p, ()=> (typeof google!=='undefined'&&google.script&&google.script.run&&document.querySelector('.sb-brand')!=null));
            // データ読み込み待ち
            const dl=Date.now()+40000; while(Date.now()<dl){ try{ if(await fr.evaluate(()=>{var l=document.getElementById('load');return l&&l.style.display==='none'&&!!document.querySelector('tbody tr');})) break; }catch(e){} await sleep(800); }
            const D=await callRun(fr,'getDashboardData',['8888',true]);
            await fr.evaluate((ym)=>window.setMonth(ym), YM);
            await sleep(400);
            const rendered=await fr.evaluate(()=>[...document.querySelectorAll('#view tbody tr')].map(function(tr){ var c=tr.children;
              var unkCell=c[4]; var unkSpan=unkCell&&unkCell.querySelector('span'); var unk=unkSpan?unkSpan.textContent:(unkCell?unkCell.textContent:'');
              return { name:c[0].textContent.trim(), turnover:c[1].textContent.trim(), unknown:unk.trim() }; }));
            out.renderedCount=rendered.length;
            var byName={}; (D.stores||[]).forEach(function(s){ byName[s.name]=s.key; });
            var checked=0;
            rendered.forEach(function(row){ var key=byName[row.name]; if(!key) { out.mismatch.push({name:row.name, why:'key not found'}); return; }
              var exp=calc(D,key,YM); var rUnk=pYen(row.unknown); var rTur=pDay(row.turnover);
              var eUnk=exp?exp.unknown:null; var eTur=exp?exp.turnover:null;
              checked++;
              var unkOk=(eUnk==null&&rUnk==null)||(eUnk!=null&&rUnk!=null&&Math.round(eUnk)===Math.round(rUnk));
              var turOk=(eTur==null&&rTur==null)||(eTur!=null&&rTur!=null&&Number(eTur.toFixed(1))===Number(rTur.toFixed(1)));
              if(!unkOk||!turOk){ out.mismatch.push({name:row.name, expUnknown:eUnk==null?null:Math.round(eUnk), renUnknown:rUnk==null?null:Math.round(rUnk), expTurn:eTur==null?null:Number(eTur.toFixed(1)), renTurn:rTur==null?null:Number(rTur.toFixed(1))}); }
            });
            out.checked=checked;
            out.PASS = out.errors.length===0 && out.renderedCount>0 && out.mismatch.length===0;
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
