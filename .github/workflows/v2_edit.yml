name: v2-edit
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_edit.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (browser only)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install chromium
      - name: edit e2e
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const KEY='0001151_NagaGutsu'; const MK='V2EDIT-'+Date.now();
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function frameWhen(page, t){ const dl=Date.now()+70000; while(Date.now()<dl){ for(const f of page.frames()){ try{ if(await f.evaluate(t)) return f; }catch(e){} } await sleep(500);} throw new Error('frame'); }
          async function countMk(fr){ return await fr.evaluate((mk)=>[...document.querySelectorAll('.lrow .lm')].filter(e=>e.textContent.indexOf(mk)>=0).length, MK); }
          async function amtMk(fr){ return await fr.evaluate((mk)=>{ var rows=[...document.querySelectorAll('.lrow')]; for(var i=0;i<rows.length;i++){ var lm=rows[i].querySelector('.lm'); if(lm&&lm.textContent.indexOf(mk)>=0){ var a=rows[i].querySelector('.la'); return a?a.textContent:null; } } return null; }, MK); }
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[]};
          try{
            const p=await (await browser.newContext()).newPage();
            p.on('pageerror',e=>out.errors.push(String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            const fr=await frameWhen(p, ()=>document.querySelector('.sb-brand')!=null);
            const dl=Date.now()+40000; while(Date.now()<dl){ try{ if(await fr.evaluate(()=>{var l=document.getElementById('load');return l&&l.style.display==='none'&&!!document.querySelector('tbody tr');})) break; }catch(e){} await sleep(800); }
            await fr.evaluate(()=>{ window.confirm=function(){return true;}; window.setMonth('2026-09'); });
            await fr.evaluate((k)=>window.openDrawer(k), KEY); await sleep(400);
            // add
            await fr.evaluate((mk)=>{ document.getElementById('aKind').value='廃棄ロス'; document.getElementById('aCat').value='フード'; document.getElementById('aAmt').value='111'; document.getElementById('aMemo').value=mk; document.getElementById('aName').value='自動テスト'; window.addLossFromDrawer(); }, MK);
            let added=false, a1=Date.now()+30000; while(Date.now()<a1){ if(await countMk(fr)===1){added=true;break;} await sleep(800); }
            out.added=added; out.afterAddAmt=await amtMk(fr);
            // edit（✎→値変更→保存＝updateLoss）
            await fr.evaluate(()=>{ var rows=[...document.querySelectorAll('.lrow')]; for(var i=0;i<rows.length;i++){ var lm=rows[i].querySelector('.lm'); if(lm&&lm.textContent.indexOf('V2EDIT')>=0){ rows[i].querySelector('.ledit').click(); return; } } });
            await sleep(300);
            await fr.evaluate((mk)=>{ document.getElementById('aAmt').value='222'; document.getElementById('aMemo').value=mk+'-MOD'; window.addLossFromDrawer(); }, MK);
            let edited=false, a2=Date.now()+30000; while(Date.now()<a2){ var amt=await amtMk(fr); if(amt&&amt.indexOf('222')>=0){edited=true;break;} await sleep(800); }
            out.edited=edited; out.afterEditCount=await countMk(fr); out.afterEditAmt=await amtMk(fr);
            // delete
            await fr.evaluate(()=>{ var rows=[...document.querySelectorAll('.lrow')]; for(var i=0;i<rows.length;i++){ var lm=rows[i].querySelector('.lm'); if(lm&&lm.textContent.indexOf('V2EDIT')>=0){ rows[i].querySelector('.ldel').click(); return; } } });
            let gone=false, a3=Date.now()+30000; while(Date.now()<a3){ if(await countMk(fr)===0){gone=true;break;} await sleep(800); }
            out.deleted=gone;
            out.PASS = out.errors.length===0 && out.added && out.edited && out.afterEditCount===1 && out.deleted;
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
