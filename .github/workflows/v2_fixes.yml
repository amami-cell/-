name: v2-fixes
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_fixes.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (browser only)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install chromium
      - name: audit fixes
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const KEY='0001742_すさび湯 京都三条店';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[]};
          try{
            const p=await (await browser.newContext({viewport:{width:1600,height:900}})).newPage();
            p.on('pageerror',e=>out.errors.push(String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            let fr=null; const dl=Date.now()+70000;
            while(Date.now()<dl){ for(const f of p.frames()){ try{ if(await f.evaluate(()=>document.querySelector('.sb-brand')!=null)){fr=f;break;} }catch(e){} } if(fr)break; await sleep(500); }
            const d2=Date.now()+40000; while(Date.now()<d2){ try{ if(await fr.evaluate(()=>{var l=document.getElementById('load');return l&&l.style.display==='none'&&!!document.querySelector('tbody tr');})) break; }catch(e){} await sleep(800); }
            // 3) 幅上限
            out.stackMaxWidth = await fr.evaluate(()=>getComputedStyle(document.querySelector('.stack')).maxWidth);
            // 1) IME合成をシミュレート（検索ボックスが作り直されないこと）
            const ime = await fr.evaluate(()=>{
              var el=document.getElementById('q'); if(!el) return {err:'no #q'};
              el.dataset.tag='KEEP'; el.focus();
              el.dispatchEvent(new CompositionEvent('compositionstart',{bubbles:true}));
              el.value='す'; el.dispatchEvent(new InputEvent('input',{bubbles:true,isComposing:true}));
              el.value='すさ'; el.dispatchEvent(new InputEvent('input',{bubbles:true,isComposing:true}));
              el.value='すさび'; el.dispatchEvent(new InputEvent('input',{bubbles:true,isComposing:true}));
              el.dispatchEvent(new CompositionEvent('compositionend',{bubbles:true,data:'すさび'}));
              var now=document.getElementById('q');
              var rows=[...document.querySelectorAll('#stBody tr')];
              return { tagSurvives: now&&now.dataset.tag==='KEEP', value: now?now.value:null,
                rowCount: rows.length, allMatch: rows.every(function(tr){return tr.textContent.indexOf('すさび')>=0;}) };
            });
            out.ime=ime;
            // 2) 売上比が各項目に（ドロワー）
            await fr.evaluate((k)=>window.openDrawer(k), KEY); await sleep(500);
            const drawer = await fr.evaluate(()=>{
              var rows=[...document.querySelectorAll('.dtbl tbody tr')];
              var subCount=document.querySelectorAll('.dtbl tbody .sub2').length;
              var salesRowFD = rows[0]? rows[0].children[1].textContent : '';
              var salesRowFood = rows[0]? rows[0].children[2].textContent : '';
              var unkRowFood = rows.length? rows[rows.length-1].children[2].textContent : '';
              return { subCount:subCount, salesRowFD:salesRowFD, salesRowFood:salesRowFood, unkRowFood:unkRowFood, rowCount:rows.length };
            });
            out.drawer=drawer;
            out.PASS = out.errors.length===0 && out.stackMaxWidth==='1180px'
              && ime.tagSurvives===true && ime.value==='すさび' && ime.rowCount>0 && ime.allMatch===true
              && drawer.subCount>=18 && /100\.0%/.test(drawer.salesRowFD) && /%/.test(drawer.salesRowFood) && /%/.test(drawer.unkRowFood);
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
