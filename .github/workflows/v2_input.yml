name: v2-input
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_input.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: input e2e
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const KEY='0001151_NagaGutsu'; const YM='2026-09';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[]};
          try{
            const p=await (await browser.newContext()).newPage();
            p.on('console',m=>{ if(m.type()==='error') out.errors.push(m.text()); });
            p.on('pageerror',e=>out.errors.push('pageerror:'+String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            let fr=null; const dl=Date.now()+70000;
            while(Date.now()<dl){ for(const f of p.frames()){ try{ if(await f.evaluate(()=>document.querySelector('.sb-brand')!=null)){fr=f;break;} }catch(e){} } if(fr)break; await sleep(500); }
            if(!fr) throw new Error('frame');
            const d2=Date.now()+40000; let ready=false;
            while(Date.now()<d2){ try{ ready=await fr.evaluate(()=>{var l=document.getElementById('load');var t=document.querySelector('tbody tr');return (l&&l.style.display==='none')&&!!t;}); }catch(e){} if(ready)break; await sleep(800); }
            await fr.evaluate(()=>{ window.confirm=function(){return true;}; if(window.setMonth) window.setMonth('2026-09'); });
            const marker='V2TEST-'+Date.now();
            // ドロワーを開いて追加フォームに入力→追加
            await fr.evaluate((k)=>window.openDrawer(k), KEY);
            await sleep(400);
            await fr.evaluate((mk)=>{ document.getElementById('aKind').value='廃棄ロス'; document.getElementById('aCat').value='フード';
              document.getElementById('aAmt').value='111'; document.getElementById('aMemo').value=mk; document.getElementById('aName').value='自動テスト';
              window.addLossFromDrawer(); }, marker);
            // 反映待ち（再取得→ドロワー再描画でマーカー行が出るまで）
            let added=false; const a1=Date.now()+30000;
            while(Date.now()<a1){ try{ added=await fr.evaluate((mk)=>{ return [...document.querySelectorAll('.lrow .lm')].some(e=>e.textContent.indexOf(mk)>=0); }, marker); }catch(e){} if(added)break; await sleep(800); }
            out.added=added;
            // 追加後の不明ロス（表示）を取得
            out.afterUnknown = await fr.evaluate(()=>{ var el=document.querySelector('.drow.big:last-child .v'); return el?el.textContent:null; });
            // id を取得して削除
            const id=await fr.evaluate(({mk,k,ym})=>{ var ls=(RAW.losses[ym]||{})[k]||[]; var f=ls.filter(function(l){return l.memo===mk;})[0]; return f?f.id:null; }, {mk:marker,k:KEY,ym:YM});
            out.testId=id;
            if(id){ await fr.evaluate((i)=>window.delLoss(i), id);
              let gone=false; const a2=Date.now()+30000;
              while(Date.now()<a2){ try{ gone=await fr.evaluate(({mk,k,ym})=>{ var ls=(RAW.losses[ym]||{})[k]||[]; return !ls.some(function(l){return l.memo===mk;}); }, {mk:marker,k:KEY,ym:YM}); }catch(e){} if(gone)break; await sleep(800); }
              out.deleted=gone;
            }
            out.PASS = ready && out.added===true && !!out.testId && out.deleted===true && out.errors.length===0;
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
