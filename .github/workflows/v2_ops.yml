name: v2-ops
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_ops.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (browser only)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install chromium
      - name: ops audit
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const BASE='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          async function frameWith(page, sel){ const dl=Date.now()+70000; while(Date.now()<dl){ for(const f of page.frames()){ try{ if(await f.evaluate((s)=>document.querySelector(s)!=null, sel)) return f; }catch(e){} } await sleep(500);} return null; }
          function callRun(frame, fn, args){ return frame.evaluate(({fn,args})=> new Promise((res,rej)=>{ const to=setTimeout(()=>rej('timeout'),60000); try{ const r=google.script.run.withSuccessHandler(x=>{clearTimeout(to);res(x);}).withFailureHandler(e=>{clearTimeout(to);rej(String(e&&e.message||e));}); r[fn].apply(r,args);}catch(e){clearTimeout(to);rej(String(e));} }), {fn,args}); }
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[], pages:{}, fail:[]};
          const ctx=await browser.newContext({viewport:{width:1500,height:900}});
          function watch(p,label){ p.on('pageerror',e=>out.errors.push(label+':'+String(e))); }
          try{
            // A) 既定トップ = 新アプリ(dash2)
            const pA=await ctx.newPage(); watch(pA,'default');
            await pA.goto(BASE+'?p=8888',{waitUntil:'load',timeout:70000});
            const fA=await frameWith(pA,'.sb-brand'); if(!fA){ out.fail.push('default: no sb-brand(dash2)'); }
            else {
              const dl=Date.now()+40000; while(Date.now()<dl){ try{ if(await fA.evaluate(()=>{var l=document.getElementById('load');return l&&l.style.display==='none'&&!!document.querySelector('#stBody tr');})) break; }catch(e){} await sleep(800); }
              out.defaultBrand=await fA.evaluate(()=>(document.querySelector('.sb-brand .btitle')||{}).textContent||'');
              out.defaultHasOldBtn=await fA.evaluate(()=>!!document.getElementById('btnImAll'));
              out.fetchBtns=await fA.evaluate(()=>[...document.querySelectorAll('button')].filter(b=>/FW取込|インフォマート/.test(b.textContent)).length);
              out.hasSearch=await fA.evaluate(()=>!!document.getElementById('q'));
              out.hasMonthSeg=await fA.evaluate(()=>!!document.querySelector('.seg'));
              // 全ページ巡回
              const pages=['dashboard','stores','unknown','turnover','lossinput','pending','settings'];
              for(const h of pages){ await fA.evaluate((x)=>{location.hash=x;}, h); await sleep(400);
                out.pages[h]=await fA.evaluate(()=>!!document.querySelector('#view .card')); }
              // 設定の旧リンク
              out.settingsV1Link=await fA.evaluate(()=>{ var a=[...document.querySelectorAll('#view a')].find(x=>/開く|変更/.test(x.textContent)); return a?a.getAttribute('href'):null; });
              // ドロワー
              await fA.evaluate(()=>{location.hash='stores';}); await sleep(400);
              await fA.evaluate(()=>{ var tr=document.querySelector('#stBody tr'); if(tr) tr.click(); }); await sleep(500);
              out.drawer=await fA.evaluate(()=>({ dtblRows:document.querySelectorAll('.dtbl tbody tr').length, hasSub:document.querySelectorAll('.dtbl .sub2').length>0, hasAddForm:!!document.getElementById('aSubmit'), footerBtns:[...document.querySelectorAll('.drawer footer button')].map(b=>b.textContent.trim()) }));
              // 折りたたみ
              await fA.evaluate(()=>window.toggleNav()); out.collapsed=await fA.evaluate(()=>document.documentElement.getAttribute('data-nav')==='collapsed'); await fA.evaluate(()=>window.toggleNav());
            }
            // B) ?v1=1 = 旧アプリ(index)
            const pB=await ctx.newPage(); watch(pB,'v1');
            await pB.goto(BASE+'?v1=1&p=8888',{waitUntil:'load',timeout:70000});
            const fB=await frameWith(pB,'#btnImAll, #appTitle, .sb-brand');
            out.v1HasOldBtn = fB? await fB.evaluate(()=>!!document.getElementById('btnImAll')||/棚卸ダッシュボード/.test(document.body.textContent)) : false;
            out.v1HasNewBrand = fB? await fB.evaluate(()=>!!document.querySelector('.sb-brand')) : null;
            // C) ?v2=1 もdash2
            const pC=await ctx.newPage(); watch(pC,'v2');
            await pC.goto(BASE+'?v2=1&p=8888',{waitUntil:'load',timeout:70000});
            out.v2Works = !!(await frameWith(pC,'.sb-brand'));
            // D) 委任入力(?input=1) が従来どおり（dash2ではない）
            const pS=await ctx.newPage(); watch(pS,'share');
            await pS.goto(BASE+'?share=1&p=8888&ym=2026-09',{waitUntil:'load',timeout:70000});
            const fS=await frameWith(pS,'.url'); 
            const u=fS? await fS.evaluate(()=>{var e=document.querySelector('.url');return e?e.textContent:null;}):null;
            if(u){ const q=new URL(u).searchParams; const inUrl=BASE+'?input=1&s='+encodeURIComponent(q.get('s'))+'&ym='+encodeURIComponent(q.get('ym'))+'&t='+encodeURIComponent(q.get('t'));
              const pI=await ctx.newPage(); watch(pI,'input'); await pI.goto(inUrl,{waitUntil:'load',timeout:70000});
              const fI=await frameWith(pI,'#sumtbl, #ttl, .sb-brand');
              out.inputIsDelegated = fI? await fI.evaluate(()=>(!!document.getElementById('sumtbl')||!!document.getElementById('ttl')) && !document.querySelector('.sb-brand')) : false;
            } else { out.inputIsDelegated='no-token'; }

            // 判定
            if(out.defaultBrand!=='棚卸管理') out.fail.push('default brand not 棚卸管理: '+out.defaultBrand);
            if(out.defaultHasOldBtn) out.fail.push('default shows old btnImAll');
            if((out.fetchBtns||0)<2) out.fail.push('fetch buttons <2');
            Object.keys(out.pages).forEach(function(k){ if(!out.pages[k]) out.fail.push('page not rendered: '+k); });
            if(!/v1=1/.test(out.settingsV1Link||'')) out.fail.push('settings old link not v1: '+out.settingsV1Link);
            if(!(out.drawer&&out.drawer.dtblRows===9&&out.drawer.hasSub&&out.drawer.hasAddForm)) out.fail.push('drawer incomplete');
            if(!(out.drawer&&out.drawer.footerBtns.join(',').indexOf('催促')>=0)) out.fail.push('drawer no catchup btn');
            if(!out.collapsed) out.fail.push('collapse toggle failed');
            if(!out.v1HasOldBtn||out.v1HasNewBrand) out.fail.push('v1 not old app');
            if(!out.v2Works) out.fail.push('v2 alias broken');
            if(out.inputIsDelegated!==true) out.fail.push('delegated input broken: '+out.inputIsDelegated);
            if(out.errors.length) out.fail.push('js errors: '+out.errors.length);
            out.PASS = out.fail.length===0;
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
