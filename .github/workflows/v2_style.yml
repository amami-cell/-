name: v2-style
on:
  push:
    branches: [claude/june-bug-cloud-planning-npopsg]
    paths: ['.github/workflows/v2_style.yml']
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (browser only)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright@1.48 >/dev/null 2>&1
          npx playwright install chromium
      - name: style check
        run: |
          cat > v.mjs <<'SCRIPT'
          import { chromium } from 'playwright';
          const URL='https://script.google.com/macros/s/AKfycbyvVFWDpXDnjDP9r7PvzlCYSycCcKtDe6fpd_lykXywETy51Y-s3kF1YoryDmpnn3621Q/exec?v2=1&p=8888';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const browser=await chromium.launch({args:['--no-sandbox']}); const out={errors:[]};
          try{
            const p=await (await browser.newContext({viewport:{width:1200,height:850}})).newPage();
            p.on('pageerror',e=>out.errors.push(String(e)));
            await p.goto(URL,{waitUntil:'load',timeout:70000});
            let fr=null; const dl=Date.now()+70000;
            while(Date.now()<dl){ for(const f of p.frames()){ try{ if(await f.evaluate(()=>document.querySelector('.sb-brand')!=null)){fr=f;break;} }catch(e){} } if(fr)break; await sleep(500); }
            const d2=Date.now()+40000; while(Date.now()<d2){ try{ if(await fr.evaluate(()=>{var l=document.getElementById('load');return l&&l.style.display==='none'&&!!document.querySelector('tbody tr');})) break; }catch(e){} await sleep(800); }
            out.navSvgIcons = await fr.evaluate(()=>document.querySelectorAll('.sb-item svg.ico').length);
            out.navEmojiLeftovers = await fr.evaluate(()=>[...document.querySelectorAll('.sb-item .lbl')].length);
            out.sidebarBg = await fr.evaluate(()=>getComputedStyle(document.querySelector('.sb')).backgroundColor);
            out.bannerBg = await fr.evaluate(()=>{ var b=document.querySelector('.banner'); return b?getComputedStyle(b).backgroundImage.slice(0,40):null; });
            out.PASS = out.errors.length===0 && out.navSvgIcons===7 && /17, 23, 34/.test(out.sidebarBg);
            console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END');
            await browser.close(); process.exit(out.PASS?0:1);
          }catch(err){ out.error=String(err&&err.stack||err); console.log('RESULT_JSON_BEGIN'); console.log(JSON.stringify(out,null,2)); console.log('RESULT_JSON_END'); try{await browser.close();}catch(e){} process.exit(2); }
          SCRIPT
          node v.mjs
