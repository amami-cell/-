# ============================================================
# 発注インフォマート 棚卸自動化 設定ファイル
# ============================================================

foodist_journal:
  base_url: "https://www2.pros-asp.net/corp/hassin"
  login_url: "https://www2.pros-asp.net/corp/hassin/index"
  timeout_ms: 30000
  wait_after_select_ms: 3000
  spreadsheet_id: "18Fq_mpEweHOFTlF4ntmwJzDsJNSt-DOq7wQYy8E0iLc"
  sheet_name: "Foodist Journal"
  # ログイン情報は環境変数 FOODIST_JOURNAL_USER_ID / FOODIST_JOURNAL_PASSWORD で上書き可
  user_id: ""
  password: ""

infomart:
  base_url: "https://www.infomart.co.jp"
  login_url: "https://www.infomart.co.jp/scripts/logon.asp?CS=1&URL=http%3A%2F%2Fwww2%2Einfomart%2Eco%2Ejp%2Fmypage%2Fmypage%5Ffb%2Epage"
  inventory_url: "https://www2.infomart.co.jp/stock/stock_close_result_seller.pagex?2"
  timeout_ms: 30000          # ページ読み込みタイムアウト (ms)
  wait_after_select_ms: 3000 # 店舗選択後の待機時間 (ms)
  download_wait_ms: 5000     # ダウンロード待機時間 (ms)

download:
  output_dir: "./downloads"                # ローカル一時保存先
  screenshot_dir: "./screenshots"          # エラー時スクリーンショット保存先
  retry_count: 3                           # リトライ回数
  retry_wait_seconds: 5                    # リトライ間隔 (秒)

google:
  drive_folder_path: "棚卸自動化/インフォマート"   # Google Drive 保存先パス
  spreadsheet_name: "棚卸集計_インフォマート"      # 集計スプレッドシート名
  summary_sheet_name: "月次集計"
  missing_sheet_name: "未提出店舗"
  master_sheet_name: "店舗マスタ"

