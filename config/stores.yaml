# ============================================================
# 店舗マスタ（m_stores のシード）
#
# 出典: infomart_automation（amami-cell/-）の config.yaml。
#       store_code は FW / インフォマート上の店舗コードと同一で、
#       このシステム全体の結合キーになる。値を書き換えないこと。
#
# store_name   : 表示用の店名（NFKC で半角寄せ・（ＨＡＳＳＩＮ）を除去）
# source_name  : 取り込み元（FW共有シートB列 / Excelシート名）に現れる生の店名。
#                店名→store_code の突き合わせに使うため、原文のまま保持する。
# brand        : ブランドコード。スケジュール画面の色分けの単位（§8-1）。
# is_shared_facility : 商業施設内の共営店舗フラグ。
# active       : 閉店・休止で false にすると集約ループから外れる。
#
# 新店を増やすときは、ここに1ブロック足すだけで取り込み対象に入る。
# ============================================================
