<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function yen(n){ if(n==null||isNaN(n)) return '—'; var s=Math.round(n)<0?'-':''; return s+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
  function pct(r){ return r==null?'':((r*100).toFixed(1)+'%'); }
  function days1(t){ return t==null?'—':(t.toFixed(1)+'日'); }

  var PASS='<?= AUTO_PASS ?>';
  var RAW=null, MONTHS=[], curMonth='', ROWS={}, curStoreKey=null;
  var sortKey='unknownAbs', sortDir=-1, query='';
  var theoryMode='add', editingId=null;

  function daysInMonth(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);return new Date(y,m,0).getDate();}
  function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;var d=new Date(y,m-1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  function invOf(ym,st,mode){var iv=(RAW.inventory[ym]||{})[st];if(!iv)return null;if(((iv.food||0)+(iv.drink||0))===0)return null;return mode==='F'?(iv.food||0):mode==='D'?(iv.drink||0):(iv.food||0)+(iv.drink||0);}
  function calc(st,ym,mode){
    var m=(RAW.metrics[ym]||{})[st]; var invCur=invOf(ym,st,mode);
    if(!m && invCur===null) return null; m=m||{};
    var d=daysInMonth(ym); var sales=m.sales||0;
    var purchase=mode==='F'?(m.foodPurchase||0):mode==='D'?(m.drinkPurchase||0):(m.foodPurchase||0)+(m.drinkPurchase||0);
    var theory=mode==='F'?(m.foodTheory||0):mode==='D'?(m.drinkTheory||0):(m.foodTheory||0)+(m.drinkTheory||0);
    var fs=m.foodSales||0, ds=m.drinkSales||0;
    var pct2=mode==='F'?fs*0.02:mode==='D'?ds*0.02:(fs+ds)*0.02;
    var inc2=!!((RAW.storeFlags||{})[st]); if(!inc2) theory+=pct2;
    var invPrev=invOf(prevYm(ym),st,mode);
    var all=((RAW.losses[ym]||{})[st])||[];
    var ls= (mode==='FD')?all:all.filter(function(l){return l.cat===(mode==='F'?'フード':'ドリンク');});
    var need=0,waste=0,adj=0;
    ls.forEach(function(l){ if(l.kind==='必要ロス')need+=l.amount; else if(l.kind==='廃棄ロス')waste+=l.amount; else if(l.kind==='理論原価')adj+=l.amount; });
    theory+=adj;
    var actual=(invPrev!==null&&invCur!==null)?invPrev+purchase-invCur:null;
    var unknown=actual!==null?actual-theory-need-waste:null;
    var td=(m.kind==='中間')?15:d;
    var turnover=(invCur!==null&&theory>0)?invCur/(theory/td):null;
    return { mode:mode, kind:m.kind||'', sales:sales, purchase:purchase, theory:Math.round(theory), invPrev:invPrev, invCur:invCur, actual:actual, need:need, waste:waste, unknown:unknown, turnover:turnover, unknownRate:(sales&&unknown!==null)?unknown/sales:null, purchaseRate:sales?purchase/sales:null };

    var stored, memoFinal=memo;
    if(kind==='理論原価' && theoryMode==='set'){
      var cur=calc(curStoreKey, curMonth, cat==='フード'?'F':'D'); var curTheory=cur?cur.theory:0;
      stored=Math.round(amtIn-curTheory);
      if(stored===0){ msg.textContent='現在（'+yen(curTheory)+'）と同じ金額です'; return; }
      memoFinal=memo+'（→'+yen(Math.round(amtIn))+' に訂正）';
    } else { stored=Math.round(amtIn); }
    if(!memo){ msg.textContent=(kind==='理論原価'?'変更理由':'内容')+'を入力してください'; return; }
    if(kind==='理論原価'){ if(!stored){ msg.textContent='金額（差分）が0です'; return; } if(!name){ msg.textContent='理論原価の変更には担当者名が必要です'; return; } }
    else { if(!(stored>0)){ msg.textContent='金額は1円以上で入力してください'; return; } }
    msg.textContent=editingId?'保存中…':'追加中…';
    var item={cat:cat, memo:memoFinal, amount:stored, name:name};
    var oldId=editingId;
    google.script.run.withSuccessHandler(function(res){
      if(!(res&&res.ok)){ msg.textContent='失敗: '+((res&&res.message)||''); return; }
      if(oldId){ // 修正＝新規追加に成功した後、旧項目を削除
        google.script.run.withSuccessHandler(function(){ editingId=null; reloadAndReopen(curStoreKey); })
          .withFailureHandler(function(){ editingId=null; reloadAndReopen(curStoreKey); }).deleteLoss(PASS, oldId);
      } else { reloadAndReopen(curStoreKey); }
    }).withFailureHandler(function(){ msg.textContent='通信エラーで保存できませんでした'; })
    .addLosses(PASS, curStoreKey, curMonth, kind, [item]);
  };
  window.delLoss=function(id){
    if(!confirm('この項目を削除しますか？')) return;
    google.script.run.withSuccessHandler(function(res){ if(res&&res.ok){ reloadAndReopen(curStoreKey); } else { alert('削除できませんでした: '+((res&&res.message)||'')); } })
    .withFailureHandler(function(){ alert('通信エラーで削除できませんでした'); }).deleteLoss(PASS, id);
  };

  // 催促メッセージ（棚数値入り）を組み立てる
  function buildCatchup(key, ym, url){
    var r=rowsOf(ym).filter(function(x){return x.key===key;})[0]; var name=r?r.name:key;
    var cF=calc(key,ym,'F'),cD=calc(key,ym,'D'),cFD=calc(key,ym,'FD');
    var mm=String(ym).match(/^(\d{4})-(\d{2})$/);
    var L=['【'+name+'】', (mm?(mm[1]+'年'+(+mm[2])+'月'):ym)+' 棚卸項目'];
    if(!cFD){ L.push('まだ棚卸データがありません。'); }
    else { var line=function(lbl,rr){ if(!rr||rr.unknown==null) return lbl+'　—'; var pc=(rr.unknownRate!=null)?('　'+(rr.unknownRate*100).toFixed(1)+'%'):''; return lbl+'　'+yen(rr.unknown)+pc; };
      L.push('不明ロス'); L.push(line('F',cF)); L.push(line('D',cD)); L.push(line('FD',cFD));
      if(cFD.unknownRate!=null && Math.abs(cFD.unknownRate)*100>=1) L.push('⚠️ FDの不明ロスが±1%以上です。要確認。');
    }
    L.push('▼ロス・理論原価の入力/修正はこちら（この店・この月専用）'); L.push(url);
    return L.join('\n');
  }
  window.copyCatchup=function(btn){
    if(!curStoreKey) return; var old=btn.textContent; btn.textContent='取得中…'; btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){ btn.disabled=false;
      var url=res&&res.ok&&res.links&&res.links[curMonth];
      if(!url){ btn.textContent='取得失敗'; setTimeout(function(){btn.textContent=old;},1500); return; }
      copyText(buildCatchup(curStoreKey, curMonth, url), btn, old);
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='通信エラー'; setTimeout(function(){btn.textContent=old;},1500); })
    .getStoreInputLinks(PASS, curStoreKey, [curMonth]);
  };
  function copyText(text, btn, old){
    var done=function(){ btn.textContent='コピー✓'; setTimeout(function(){btn.textContent=old;},1500); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){legacyCopy(text);done();}); }
    else { legacyCopy(text); done(); }
  }

  // クラウド再取得（fetch.yml を起動）
  window.triggerFetch=function(target, btn){
    var old=btn.textContent; btn.disabled=true; btn.textContent='起動中…';
    google.script.run.withSuccessHandler(function(res){ btn.disabled=false; btn.textContent=old;
      if(res&&res.ok){ toast('取込を起動しました。数十秒〜数分で反映→「⟳ データ再取得」で最新化してください'); }
      else if(res&&res.needSetup){ alert('初回のみGitHubトークンの登録が必要です（旧アプリの設定から登録してください）。'); }
      else { toast('起動できませんでした: '+((res&&res.message)||'')); }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent=old; toast('通信エラーで起動できませんでした'); })
    .triggerCloudFetch(PASS, target, curMonth);
  };
  // トースト
  function toast(t){ var el=document.getElementById('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);} el.textContent=t; el.className='show'; clearTimeout(toast._t); toast._t=setTimeout(function(){ el.className=''; },3500); }

  // 入力URLをコピー（担当者に送る、その店×その月専用）
  $('#dcopy').onclick=function(){
    if(!curStoreKey) return; var btn=$('#dcopy'); var old=btn.textContent; btn.textContent='取得中…'; btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false;
      var url=res&&res.ok&&res.links&&res.links[curMonth];
      if(!url){ btn.textContent='URL取得に失敗'; setTimeout(function(){btn.textContent=old;},1500); return; }
      var done=function(){ btn.textContent='コピー完了✓'; setTimeout(function(){btn.textContent=old;},1500); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ legacyCopy(url); done(); }); }
      else { legacyCopy(url); done(); }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='通信エラー'; setTimeout(function(){btn.textContent=old;},1500); })
    .getStoreInputLinks(PASS, curStoreKey, [curMonth]);
  };
  function legacyCopy(t){ var el=document.createElement('textarea'); el.value=t; el.style.position='fixed'; el.style.opacity='0'; document.body.appendChild(el); el.focus(); el.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(el); }
  // 一覧の各店「入力URLをコピー」（その店×表示中の月 専用・署名トークン付き）
  window.copyInputUrl=function(key, btn){
    var old=btn.textContent; btn.textContent='取得中…'; btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false; var url=res&&res.ok&&res.links&&res.links[curMonth];
      if(!url){ btn.textContent='取得失敗'; setTimeout(function(){btn.textContent=old;},1500); return; }
      var done=function(){ btn.textContent='コピー✓'; setTimeout(function(){btn.textContent=old;},1500); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){legacyCopy(url);done();}); }
      else { legacyCopy(url); done(); }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='通信エラー'; setTimeout(function(){btn.textContent=old;},1500); })
    .getStoreInputLinks(PASS, key, [curMonth]);
  };

  window.go=function(t){ location.hash=t; closeNav(); };
  window.setMonth=function(m){ curMonth=m; render(); };
  window.setQ=function(v){ query=v; var cur=location.hash.slice(1); $('#view').innerHTML=(cur==='stores'?storeTableCard('🏬 店舗別 棚卸（'+curMonth+'）'):pageDashboard()); var q=$('#q'); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);} };
  window.setSort=function(k){ if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=(k==='name'?1:-1); } render(); };
  window.toggleNav=function(){ var c=document.documentElement.getAttribute('data-nav')==='collapsed';
    if(c){document.documentElement.removeAttribute('data-nav');try{localStorage.setItem('nav-collapsed','0');}catch(e){}}
    else{document.documentElement.setAttribute('data-nav','collapsed');try{localStorage.setItem('nav-collapsed','1');}catch(e){}} };
  window.openNav=function(){ document.body.classList.add('navopen'); $('.sb-close').style.display='block'; };
  window.closeNav=function(){ document.body.classList.remove('navopen'); };
  window.refresh=function(){ loadData(true); };

  // ===== データ取得 =====
  function showLoading(on){ $('#load').style.display=on?'flex':'none'; }
  function showLogin(on){ $('#login').style.display=on?'flex':'none'; }
  window.doLogin=function(){
    var p=$('#pw').value.trim(); if(!p){ return; } $('#lerr').textContent='';
    var btn=$('#login button'); btn.disabled=true; btn.textContent='確認中…';
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='ログイン';
      if(res&&res.ok){ PASS=p; showLogin(false); loadData(false); }
      else { $('#lerr').textContent='パスコードが違います'; }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='ログイン'; $('#lerr').textContent='通信エラー'; })
    .verifyPasscode(p);
  };
  $('#pw')&&$('#pw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

  var reopenAfterLoad=null, keepMonth=null;
  function reloadAndReopen(key){ reopenAfterLoad=key; keepMonth=curMonth; loadData(true); }
  function onData(d){
    showLoading(false);
    if(!d || d.authError){ showLogin(true); return; }
    RAW=d; ROWS={}; MONTHS=(d.months||[]).slice();
    curMonth=(keepMonth&&MONTHS.indexOf(keepMonth)>=0)?keepMonth:(MONTHS[MONTHS.length-1]||'');
    keepMonth=null;
    $('#upd').textContent=(d.updatedAt||'').slice(5,16);
    render();
    if(reopenAfterLoad){ var k=reopenAfterLoad; reopenAfterLoad=null; openDrawer(k); }
  }
  function loadData(force){
    showLoading(true);
    google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){ showLoading(false); alert('読み込みに失敗しました。再取得してください。'); }).getDashboardData(PASS, !!force);
  }

  window.addEventListener('hashchange',render);
  // 起動
  if(PASS){ loadData(false); } else { showLoading(false); showLogin(true); }
})();
</script>
</body>
