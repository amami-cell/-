<html lang="ja" data-theme="ai-dark">
<head>

<style>
  :root{ --gold:#b8952f; --primary:#1e4b7a; --primary-700:#173c63;
    --ink:#1f2937; --ink-2:#64748b; --muted:#94a3b4; --line:#e2e8ef; --card:#fff; --bg1:#f7f9fb;
    --ok:#059669; --amber:#d97706; --bad:#dc2626; }
  :root[data-theme="ai-dark"]{ --sb-bg:#1f2430; --sb-brand:#161a23; --sb-foot:#0d131d; --sb-line:#262e3d;
    --sb-text:#c3c9d4; --sb-muted:#8b93a3; --sb-hover:#1a2333; --sb-hover-text:#d5e6f5;
    --sb-active:#1c2942; --sb-active-text:#fff; --sb-active-bar:#b8952f; --sb-avatar:#34527d; --sb-sec:#6b7383; }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ min-height:100vh; color:var(--ink); background:var(--bg1);
    background-image:linear-gradient(to bottom right,#f8fafc,#ffffff 55%,rgba(224,231,255,.4));
    font-family:Inter,"Noto Sans JP",ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  a{color:inherit;}
  .sb{ position:fixed; left:0; top:0; height:100vh; width:240px; z-index:40; background:var(--sb-bg); color:var(--sb-text);
    display:flex; flex-direction:column; border-right:1px solid var(--sb-line);
    transition:width .2s cubic-bezier(.4,0,.2,1), transform .2s cubic-bezier(.4,0,.2,1); }
  .sb-brand{ position:relative; display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px;
    background:var(--sb-brand); border-bottom:1px solid var(--sb-line); }
  .sb-brand .bsub{ font-size:10px; font-weight:800; letter-spacing:.18em; color:var(--gold); }
  .sb-brand .btitle{ margin-top:2px; font-size:15px; font-weight:700; color:#fff; white-space:nowrap; }
  .sb-brand .logo{ display:none; width:30px; height:30px; border-radius:8px; background:var(--gold); color:#161a23; font-weight:800; font-size:15px; align-items:center; justify-content:center; }
  .sb-togg{ border:0; background:var(--gold); color:#161a23; border-radius:8px; padding:2px 6px; font-size:13px; cursor:pointer; line-height:1.2; }
  .sb-user{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--sb-line); }
  .sb-user .av{ width:36px; height:36px; border-radius:50%; background:var(--sb-avatar); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; flex:none; }
  .sb-user .nm{ font-size:12px; font-weight:600; color:#c3c9d4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sb-user .dept{ margin-left:auto; border-radius:4px; padding:2px 8px; font-size:11px; font-weight:500; background:rgba(255,255,255,.1); color:#c3c9d4; white-space:nowrap; }
  .sb-nav{ flex:1; overflow-y:auto; padding:12px 0; scrollbar-width:thin; scrollbar-color:#3a4356 transparent; }
  .sb-nav::-webkit-scrollbar{ width:8px; } .sb-nav::-webkit-scrollbar-track{ background:transparent; }
  .sb-nav::-webkit-scrollbar-thumb{ background:#3a4356; border-radius:99px; } .sb-nav::-webkit-scrollbar-thumb:hover{ background:#4a5468; }
  .sb-item{ position:relative; display:flex; align-items:center; gap:10px; width:100%; padding:8px 16px; font-size:14px;
    color:var(--sb-text); background:transparent; border:0; cursor:pointer; text-align:left;
    transition:background .15s cubic-bezier(.4,0,.2,1), color .15s cubic-bezier(.4,0,.2,1); }
  .sb-item:hover{ background:var(--sb-hover); color:var(--sb-hover-text); }
  .sb-item.active{ background:var(--sb-active); color:var(--sb-active-text); font-weight:600; }
  .sb-item.active:hover{ background:var(--sb-active); color:var(--sb-active-text); }
  .sb-item .bar{ position:absolute; left:0; top:6px; bottom:6px; width:3px; border-radius:0 3px 3px 0; background:var(--sb-active-bar); opacity:0; }
  .sb-item.active .bar{ opacity:1; }
  .sb-item .ico{ width:18px; text-align:center; flex:none; }

  .sb-btn{ width:100%; border-radius:8px; padding:8px; font-size:12px; border:1px solid var(--sb-line); background:transparent; color:var(--sb-text); cursor:pointer; }
  .sb-btn:hover{ background:var(--sb-hover); }

  :root[data-nav="collapsed"] .sb{ width:56px; }
  :root[data-nav="collapsed"] .sb .btitle,:root[data-nav="collapsed"] .sb .bsub,:root[data-nav="collapsed"] .sb .nm,
  :root[data-nav="collapsed"] .sb .dept,:root[data-nav="collapsed"] .sb-item .lbl,:root[data-nav="collapsed"] .sb-item .badge,
  :root[data-nav="collapsed"] .sb-sec span,:root[data-nav="collapsed"] .sb-btn .t,:root[data-nav="collapsed"] .sb-build .t{ display:none; }

  .stack>*+*{ margin-top:12px; }

  .card h2{ margin:0 0 10px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .banner{ border-radius:16px; padding:14px 18px; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.08); background:linear-gradient(to right,#1e4b7a,#2d3f8a,#4b3fa0); }
  .banner .h{ font-size:18px; font-weight:800; } .banner .s{ font-size:13px; opacity:.92; margin-top:2px; }
  .kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .kpi{ border-radius:14px; border:1px solid var(--line); background:#fff; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .kpi .l{ font-size:12px; color:var(--ink-2); } .kpi .v{ font-size:22px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .kpi .sub{ font-size:11px; color:var(--muted); margin-top:1px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  .search{ position:relative; flex:1; min-width:180px; }
  .search input{ height:36px; width:100%; border-radius:8px; border:1px solid #cbd5e1; background:#fff; padding:0 12px 0 34px; font-size:14px; }
  .search input:focus{ outline:none; border-color:#6366f1; box-shadow:0 0 0 3px #e0e7ff; }
  .search .si{ position:absolute; left:10px; top:9px; color:#94a3b4; }
  .seg{ display:flex; gap:4px; background:#eef2f7; border-radius:9px; padding:3px; }
  .seg button{ border:0; background:transparent; border-radius:7px; padding:6px 12px; font-size:13px; font-weight:700; color:var(--ink-2); cursor:pointer; }
  .seg button.on{ background:#fff; color:var(--primary); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .twrap{ overflow:auto; border-radius:12px; border:1px solid var(--line); background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ position:sticky; top:0; background:#f8fafc; cursor:pointer; white-space:nowrap; padding:11px 12px; font-weight:600; color:#475569; text-align:right; border-bottom:1px solid var(--line); }
  thead th.l{ text-align:left; } thead th:hover{ color:#4f46e5; } thead th .ar{ color:#94a3b4; font-size:10px; }
  tbody tr{ border-top:1px solid #f1f5f9; cursor:pointer; } tbody tr:hover{ background:rgba(79,70,229,.06); }
  tbody td{ white-space:nowrap; border-bottom:1px solid #f1f5f9; padding:7px 12px; text-align:right; font-variant-numeric:tabular-nums; }
  td.name{ text-align:left; font-weight:600; position:relative; padding-left:16px; }
  td .edge{ position:absolute; left:0; top:4px; bottom:4px; width:3px; border-radius:0 3px 3px 0; }
  .sub2{ font-size:11px; color:var(--muted); }
  .pos{ color:var(--bad); } .neg{ color:var(--ok); }
  .pill{ display:inline-block; border-radius:999px; padding:1px 8px; font-size:11px; font-weight:600; }
  .pill.warn{ background:#fef2f2; color:#dc2626; } .pill.amber{ background:#fff7ed; color:#c2410c; }
  .pill.ok{ background:#ecfdf5; color:#059669; } .pill.grey{ background:#f1f5f9; color:#64748b; }
  .muted{ color:var(--muted); }
  .mcards{ display:none; } .mcard{ border:1px solid var(--line); border-radius:12px; background:#fff; padding:12px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .mcard .r1{ display:flex; justify-content:space-between; gap:8px; align-items:center; } .mcard .nm{ font-weight:700; }
  .ovl{ position:fixed; inset:0; z-index:49; background:rgba(15,23,42,.2); opacity:0; pointer-events:none; transition:opacity .15s; }
  .ovl.show{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; right:0; top:0; z-index:50; height:100vh; width:100%; max-width:448px; background:#fff; border-left:1px solid var(--line);
    box-shadow:-10px 0 30px rgba(0,0,0,.15); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .2s cubic-bezier(.4,0,.2,1); }
  .drawer.show{ transform:translateX(0); }
  .drawer header{ display:flex; align-items:flex-start; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .drawer header .dn{ font-weight:700; font-size:16px; } .drawer header .ds{ font-size:12px; color:var(--ink-2); }
  .drawer header .x{ margin-left:auto; border:0; background:transparent; font-size:18px; cursor:pointer; color:#64748b; }
  .drawer .body{ flex:1; overflow-y:auto; padding:16px; }
  .drawer footer{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }
  .btn{ border-radius:8px; padding:8px 16px; font-size:14px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .btn.sec{ background:#fff; border-color:#cbd5e1; color:#334155; } .btn.pri{ background:var(--primary); color:#fff; flex:1; } .btn.pri:hover{ background:var(--primary-700); }
  .drow{ display:flex; justify-content:space-between; align-items:baseline; padding:8px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .drow .k{ color:var(--ink-2); } .drow .v{ font-weight:700; font-variant-numeric:tabular-nums; } .drow .r{ color:var(--muted); font-size:11px; margin-left:6px; }
  .drow.big .v{ font-size:16px; }
  .mbar{ display:none; position:sticky; top:0; z-index:30; align-items:center; justify-content:space-between; padding:8px 12px; color:#fff;
    background:linear-gradient(to right,#1e4b7a,#4b3fa0); border-bottom:1px solid rgba(67,56,202,.2); }
  .mbar button{ border:0; background:transparent; color:#fff; border-radius:8px; padding:6px; font-size:18px; cursor:pointer; }
  .scrim{ display:none; position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.35); }
  /* ローディング / ログイン */
  #load,#login{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#f7f9fb; color:#6b7280; padding:24px; text-align:center; }
  #login{ display:none; }
  #load .sp{ width:30px; height:30px; border:3px solid #e5e7eb; border-top-color:#1e4b7a; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  #login .box{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; width:100%; max-width:320px; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  #login h3{ margin:0 0 12px; font-size:16px; color:#1f2937; }
  #login input{ width:100%; height:40px; border:1px solid #cbd5e1; border-radius:8px; padding:0 12px; font-size:16px; margin-bottom:10px; }
  #login button{ width:100%; height:40px; border:0; border-radius:8px; background:var(--primary); color:#fff; font-weight:700; cursor:pointer; }
  #login .err{ color:#dc2626; font-size:13px; min-height:18px; }
  @media (max-width:768px){
    .sb{ transform:translateX(-100%); width:240px; } body.navopen .sb{ transform:translateX(0); } body.navopen .scrim{ display:block; }
    .main{ margin-left:0; padding:12px 14px 40px; } .mbar{ display:flex; } .kpis{ grid-template-columns:1fr 1fr; }
    .twrap{ display:none; } .mcards{ display:grid; gap:8px; } .sb-togg{ display:none; }
  }
  @media (min-width:769px){ .sb-close{ display:none; } }
</style>
</head>
<body>
<div id="load"><div class="sp"></div><div>棚卸データを読み込んでいます…</div></div>
<div id="login"><div class="box"><h3>🔒 棚卸管理 ログイン</h3><input id="pw" type="password" inputmode="numeric" placeholder="パスコード" autocomplete="current-password"><div class="err" id="lerr"></div><button onclick="doLogin()">ログイン</button></div></div>

<div class="mbar"><button onclick="openNav()" aria-label="メニューを開く">☰</button><div style="font-weight:700;font-size:14px">棚卸管理</div><button onclick="refresh()" title="再取得" aria-label="再取得">⟳</button></div>
<div class="scrim" onclick="closeNav()"></div>

<aside class="sb">
  <div class="sb-brand">
    <div><div class="bsub">SUSABIYU GROUP</div><div class="btitle">棚卸管理</div></div>
    <div class="logo">棚</div>
    <button class="sb-togg" onclick="toggleNav()" aria-label="畳む/開く" title="畳む/開く">«</button>
    <button class="sb-togg sb-close" onclick="closeNav()" aria-label="閉じる" style="display:none">✕</button>
  </div>
  <div class="sb-user"><div class="av">本</div><div class="nm">本部 管理者</div><div class="dept">本部</div></div>
  <nav class="sb-nav" id="nav"></nav>
  <div class="sb-foot">
    <button class="sb-btn" onclick="refresh()"><span class="t">⟳ データ再取得</span><span style="display:none">⟳</span></button>
    <div class="sb-build"><span class="t">データ更新 <span id="upd"></span> ・ </span><span class="ver">v2</span></div>
  </div>
</aside>

<main class="main"><div id="view" class="stack"></div></main>

<div class="ovl" id="ovl" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <header><div><div class="dn" id="dn"></div><div class="ds" id="ds"></div></div><button class="x" onclick="closeDrawer()" aria-label="閉じる">✕</button></header>
  <div class="body" id="dbody"></div>
  <footer><button class="btn sec" onclick="closeDrawer()">閉じる</button><button class="btn pri" id="dcopy">入力URLをコピー</button></footer>
</aside>

<script>
(function(){
  "use strict";
  var $=function(s,r){return (r||document).querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function yen(n){ if(n==null||isNaN(n)) return '—'; var s=Math.round(n)<0?'-':''; return s+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
  function pct(r){ return r==null?'':((r*100).toFixed(1)+'%'); }
  function days1(t){ return t==null?'—':(t.toFixed(1)+'日'); }

  var PASS='<?= AUTO_PASS ?>';
  var RAW=null, MONTHS=[], curMonth='', ROWS={}, curStoreKey=null;
  var sortKey='unknownAbs', sortDir=-1, query='';

  function daysInMonth(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7);return new Date(y,m,0).getDate();}
  function prevYm(ym){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1;var d=new Date(y,m-1,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  function invOf(ym,st){var iv=(RAW.inventory[ym]||{})[st];if(!iv)return null;if(((iv.food||0)+(iv.drink||0))===0)return null;return (iv.food||0)+(iv.drink||0);}
  function calcFD(st,ym){
    var m=(RAW.metrics[ym]||{})[st]; var invCur=invOf(ym,st);
    if(!m && invCur===null) return null; m=m||{};
    var d=daysInMonth(ym); var sales=m.sales||0;
    var purchase=(m.foodPurchase||0)+(m.drinkPurchase||0);
    var theory=(m.foodTheory||0)+(m.drinkTheory||0);
    var fs=m.foodSales||0, ds=m.drinkSales||0; var pct2=(fs+ds)*0.02;
    var inc2=!!((RAW.storeFlags||{})[st]); if(!inc2) theory+=pct2;
    var invPrev=invOf(prevYm(ym),st);
    var ls=((RAW.losses[ym]||{})[st])||[]; var need=0,waste=0,adj=0;
    ls.forEach(function(l){ if(l.kind==='必要ロス')need+=l.amount; else if(l.kind==='廃棄ロス')waste+=l.amount; else if(l.kind==='理論原価')adj+=l.amount; });
    theory+=adj;
    var actual=(invPrev!==null&&invCur!==null)?invPrev+purchase-invCur:null;
    var unknown=actual!==null?actual-theory-need-waste:null;
    var td=(m.kind==='中間')?15:d;
    var turnover=(invCur!==null&&theory>0)?invCur/(theory/td):null;
    return { kind:m.kind||'', sales:sales, purchase:purchase, theory:Math.round(theory), invPrev:invPrev, invCur:invCur, actual:actual, need:need, waste:waste, unknown:unknown, turnover:turnover, unknownRate:(sales&&unknown!==null)?unknown/sales:null, purchaseRate:sales?purchase/sales:null };
  }
  function rowsOf(ym){
    if(ROWS[ym]) return ROWS[ym].slice();
    var list=[]; (RAW.stores||[]).forEach(function(s){ var r=calcFD(s.key,ym); if(r){ r.name=s.name; r.key=s.key; list.push(r);} });
    ROWS[ym]=list; return list.slice();
  }
  function statusOf(r){
    if(r.invCur==null||!r.sales) return {t:'棚卸未入力',c:'grey'};
    if(!r.theory) return {t:'理論原価未取得',c:'grey'};
    var a=Math.abs(r.unknownRate||0);
    if(a>=0.05) return {t:'要確認',c:'warn'}; if(a>=0.01) return {t:'注意',c:'amber'}; return {t:'良好',c:'ok'};
  }
  function barColor(r){ var st=statusOf(r); return st.c==='warn'?'#dc2626':st.c==='amber'?'#d97706':st.c==='ok'?'#059669':'#cbd5e1'; }

  var NAV=[
    {t:'dashboard', ic:'▦', l:'ダッシュボード'},
    {t:'stores',    ic:'🏬', l:'店舗別 棚卸'},
    {t:'unknown',   ic:'❓', l:'不明ロス'},
    {t:'turnover',  ic:'🔄', l:'在庫回転'},
    {sec:'入力・運用'},
    {t:'lossinput', ic:'✏', l:'ロス入力（担当者URL）'},
    {t:'pending',   ic:'⚠', l:'棚卸 未入力・締切'},
    {sec:'設定'},
    {t:'settings',  ic:'⚙', l:'設定'}
  ];
  function renderNav(){
    var cur=location.hash.slice(1)||'dashboard';
    var pend=rowsOf(curMonth).filter(function(r){return r.invCur==null&&r.sales;}).length;
    $('#nav').innerHTML=NAV.map(function(it){
      if(it.sec) return '<div class="sb-sec"><span>'+esc(it.sec)+'</span></div>';
      var right=(it.t==='pending'&&pend)?'<span class="badge">'+pend+'</span>':'';
      return '<button class="sb-item'+(it.t===cur?' active':'')+'" title="'+esc(it.l)+'" onclick="go(\''+it.t+'\')"><span class="bar"></span><span class="ico">'+it.ic+'</span><span class="lbl">'+esc(it.l)+'</span>'+right+'</button>';
    }).join('');
  }
  function monthSeg(){ return '<div class="seg">'+MONTHS.slice(-6).map(function(m){ return '<button class="'+(m===curMonth?'on':'')+'" onclick="setMonth(\''+m+'\')">'+(+m.slice(5,7))+'月</button>'; }).join('')+'</div>'; }

  function pageDashboard(){
    var rows=rowsOf(curMonth);
    var withData=rows.filter(function(r){return r.invCur!=null&&r.sales;});
    var valid=withData.filter(function(r){return r.theory>0&&r.unknown!=null;});
    var totalSales=valid.reduce(function(a,r){return a+(r.sales||0);},0);
    var totalUnknown=valid.reduce(function(a,r){return a+(r.unknown||0);},0);
    var rate=totalSales?totalUnknown/totalSales:null;
    var needCheck=valid.filter(function(r){return Math.abs(r.unknownRate||0)>=0.05;}).length;
    var noTheory=withData.filter(function(r){return !r.theory;}).length;
    var pend=rows.filter(function(r){return r.invCur==null&&r.sales;}).length;
    var kpi=''
      +'<div class="kpi"><div class="l">対象月</div><div class="v">'+(+curMonth.slice(5,7))+'月</div><div class="sub">'+curMonth+'</div></div>'
      +'<div class="kpi"><div class="l">不明ロス総額</div><div class="v '+(totalUnknown>0?'pos':'neg')+'">'+yen(totalUnknown)+'</div><div class="sub">有効'+valid.length+'店・売上比 '+pct(rate)+'</div></div>'
      +'<div class="kpi"><div class="l">要確認 店舗</div><div class="v" style="color:#dc2626">'+needCheck+'</div><div class="sub">±5%以上の不明ロス</div></div>'
      +'<div class="kpi"><div class="l">要対応</div><div class="v" style="color:#c2410c">'+(pend+noTheory)+'</div><div class="sub">未入力'+pend+'・理論原価未取得'+noTheory+'</div></div>';
    return ''
      +'<div class="banner"><div class="h">全社サマリー（'+curMonth+'）</div><div class="s">店舗別の不明ロス・在庫回転を一覧で確認できます。行をタップで内訳。</div></div>'
      +'<div class="card"><h2>📊 サマリー <span style="margin-left:auto">'+monthSeg()+'</span></h2><div class="kpis">'+kpi+'</div></div>'
      +storeTableCard('🏬 店舗別 棚卸（'+curMonth+'）');
  }
  function storeTableCard(title){
    var rows=rowsOf(curMonth);
    var q=query.trim(); if(q) rows=rows.filter(function(r){return r.name.indexOf(q)>=0;});
    rows.sort(function(a,b){ var av,bv;
      if(sortKey==='name'){ av=a.name; bv=b.name; }
      else if(sortKey==='unknownAbs'){ av=Math.abs(a.unknownRate||0); bv=Math.abs(b.unknownRate||0); }
      else { av=a[sortKey]; bv=b[sortKey]; av=(av==null?-1e18:av); bv=(bv==null?-1e18:bv); }
      return av<bv?-sortDir:av>bv?sortDir:0; });
    function ar(k){ return sortKey===k?('<span class="ar">'+(sortDir>0?'▲':'▼')+'</span>'):''; }
    var body=rows.map(function(r){ var st=statusOf(r);
      var uk=(r.unknown==null)?'—':('<span class="'+(r.unknown>0?'pos':'neg')+'">'+yen(r.unknown)+'</span><div class="sub2">'+(r.unknownRate==null?'':pct(r.unknownRate))+'</div>');
      return '<tr onclick="openDrawer(\''+esc(r.key)+'\')"><td class="name"><span class="edge" style="background:'+barColor(r)+'"></span>'+esc(r.name)+'</td>'
        +'<td>'+days1(r.turnover)+'</td><td>'+yen(r.sales)+'</td><td>'+yen(r.purchase)+'<div class="sub2">'+pct(r.purchaseRate)+'</div></td><td>'+uk+'</td><td><span class="pill '+st.c+'">'+st.t+'</span></td></tr>';
    }).join('');
    var mc=rows.map(function(r){ var st=statusOf(r);
      return '<div class="mcard" onclick="openDrawer(\''+esc(r.key)+'\')"><div class="r1"><span class="nm">'+esc(r.name)+'</span><span class="pill '+st.c+'">'+st.t+'</span></div>'
        +'<div class="sub2" style="margin-top:4px">回転 '+days1(r.turnover)+' ・ 売上 '+yen(r.sales)+' ・ 不明 '+(r.unknown==null?'—':('<span class="'+(r.unknown>0?'pos':'neg')+'">'+yen(r.unknown)+' '+pct(r.unknownRate)+'</span>'))+'</div></div>'; }).join('');
    return '<div class="card"><h2>'+esc(title)+' <span class="muted" style="font-weight:400;font-size:12px">'+rows.length+' 店</span></h2>'
      +'<div class="toolbar"><div class="search"><span class="si">🔍</span><input id="q" placeholder="店名で検索" value="'+esc(query)+'" oninput="setQ(this.value)"></div>'+monthSeg()+'</div>'
      +'<div class="twrap"><table><thead><tr>'
        +'<th class="l" onclick="setSort(\'name\')">店舗 '+ar('name')+'</th><th onclick="setSort(\'turnover\')">在庫回転 '+ar('turnover')+'</th>'
        +'<th onclick="setSort(\'sales\')">売上 '+ar('sales')+'</th><th onclick="setSort(\'purchase\')">仕入 '+ar('purchase')+'</th>'
        +'<th onclick="setSort(\'unknownAbs\')">不明ロス '+ar('unknownAbs')+'</th><th>状態</th></tr></thead><tbody>'+body+'</tbody></table></div>'
      +'<div class="mcards">'+mc+'</div></div>';
  }
  function pageRank(metric,title,fmt){
    var rows=rowsOf(curMonth).filter(function(r){return r[metric]!=null;});
    rows.sort(function(a,b){ return Math.abs(b[metric])-Math.abs(a[metric]); });
    var body=rows.map(function(r,i){ return '<tr onclick="openDrawer(\''+esc(r.key)+'\')"><td class="name"><span class="edge" style="background:'+barColor(r)+'"></span>'+(i+1)+'. '+esc(r.name)+'</td><td>'+fmt(r)+'</td><td class="muted">'+yen(r.sales)+'</td></tr>'; }).join('');
    return '<div class="card"><h2>'+esc(title)+' <span style="margin-left:auto">'+monthSeg()+'</span></h2><div class="twrap"><table><thead><tr><th class="l">店舗</th><th>'+(metric==='turnover'?'在庫回転日数':'不明ロス（売上比）')+'</th><th>売上</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }
  function pageLossInput(){
    var stores=(RAW.stores||[]);
    var body=stores.map(function(s){
      var ls=((RAW.losses[curMonth]||{})[s.key])||[];
      var tag=ls.length?('<span class="pill ok">入力 '+ls.length+'件</span>'):'<span class="pill grey">未入力</span>';
      return '<tr><td class="name">'+esc(s.name)+'</td><td style="text-align:left">'+tag+'</td>'
        +'<td style="text-align:left"><button class="btn sec" style="padding:5px 12px;font-size:12px" onclick="copyInputUrl(\''+esc(s.key)+'\',this)">入力URLをコピー</button></td></tr>';
    }).join('');
    return '<div class="card"><h2>✏ ロス入力（担当者URL）<span style="margin-left:auto">'+monthSeg()+'</span></h2>'
      +'<div class="muted" style="font-size:13px;margin-bottom:10px">各店の「入力URLをコピー」を押して、担当者のLINE等に貼って送ってください。担当者はその店・その月のロス/理論原価を入力でき、このアプリに反映されます。</div>'
      +'<div class="twrap"><table><thead><tr><th class="l">店舗</th><th class="l">'+curMonth+' 入力状況</th><th class="l">操作</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }
  function pagePending(){
    var pend=rowsOf(curMonth).filter(function(r){return r.invCur==null&&r.sales;});
    var y=+curMonth.slice(0,4), mo=+curMonth.slice(5,7);
    var due=new Date(y,mo,3), last=new Date(y,mo,5);
    function fmtD(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
    var head=curMonth+' ・ 期日 '+fmtD(due)+'（最終 '+fmtD(last)+'）';
    if(!pend.length) return '<div class="card"><h2>⚠ 棚卸 未入力・締切 <span style="margin-left:auto">'+monthSeg()+'</span></h2><span class="pill ok" style="font-size:13px">全店 入力済み ✅</span><div class="muted" style="font-size:12px;margin-top:8px">'+head+'</div></div>';
    var body=pend.map(function(r){ return '<tr><td class="name">'+esc(r.name)+'</td><td style="text-align:left"><span class="pill warn">棚卸金額 未入力</span></td>'
      +'<td style="text-align:left"><button class="btn sec" style="padding:5px 12px;font-size:12px" onclick="copyInputUrl(\''+esc(r.key)+'\',this)">入力URLをコピー</button></td></tr>'; }).join('');
    return '<div class="card"><h2>⚠ 棚卸 未入力・締切 <span class="muted" style="font-weight:400;font-size:12px">'+pend.length+'店</span><span style="margin-left:auto">'+monthSeg()+'</span></h2>'
      +'<div class="muted" style="font-size:13px;margin-bottom:10px">'+head+'。売上があるのに棚卸金額が未入力の店舗です。</div>'
      +'<div class="twrap"><table><thead><tr><th class="l">店舗</th><th class="l">状態</th><th class="l">操作</th></tr></thead><tbody>'+body+'</tbody></table></div></div>';
  }
  function pageSettings(){
    return '<div class="card"><h2>⚙ 設定</h2>'
      +'<div class="drow"><span class="k">データ更新</span><span class="v">'+esc((RAW.updatedAt||'').slice(0,16))+'</span></div>'
      +'<div class="drow"><span class="k">対象月</span><span class="v" style="font-size:12px">'+esc(MONTHS.join(' / '))+'</span></div>'
      +'<div class="drow"><span class="k">パスコード変更</span><span class="v"><a href="?p='+encodeURIComponent(PASS)+'" target="_blank" style="color:var(--primary);text-decoration:none">旧アプリの🔒から変更 ↗</a></span></div>'
      +'<div class="drow" style="border-bottom:0"><span class="k">旧ダッシュボード</span><span class="v"><a href="?p='+encodeURIComponent(PASS)+'" target="_blank" style="color:var(--primary);text-decoration:none">開く ↗</a></span></div>'
      +'<div class="muted" style="font-size:12px;margin-top:10px">このページ（?v2=1）は新デザインです。正式トップへの差し替えはご指示ください。</div></div>';
  }
  function pageStub(title){ return '<div class="card"><h2>'+esc(title)+'</h2><div class="muted" style="font-size:13px">このページは準備中です。ご要望に合わせて作り込みます（既存アプリの該当機能を移植）。</div></div>'; }

  function render(){
    if(!RAW) return;
    var cur=location.hash.slice(1)||'dashboard';
    renderNav();
    var v=$('#view');
    if(cur==='dashboard') v.innerHTML=pageDashboard();
    else if(cur==='stores') v.innerHTML=storeTableCard('🏬 店舗別 棚卸（'+curMonth+'）');
    else if(cur==='unknown') v.innerHTML=pageRank('unknown','❓ 不明ロス ランキング（'+curMonth+'）',function(r){return '<span class="'+(r.unknown>0?'pos':'neg')+'">'+yen(r.unknown)+'</span> <span class="muted">'+pct(r.unknownRate)+'</span>';});
    else if(cur==='turnover') v.innerHTML=pageRank('turnover','🔄 在庫回転 ランキング（'+curMonth+'）',function(r){return days1(r.turnover);});
    else if(cur==='lossinput') v.innerHTML=pageLossInput();
    else if(cur==='pending') v.innerHTML=pagePending();
    else if(cur==='settings') v.innerHTML=pageSettings();
    else { var it=NAV.filter(function(x){return x.t===cur;})[0]; v.innerHTML=pageStub(it?it.l:cur); }
    window.scrollTo(0,0);
  }

  window.openDrawer=function(key){
    var r=rowsOf(curMonth).filter(function(x){return x.key===key;})[0]; if(!r) return; curStoreKey=key;
    $('#dn').textContent=r.name; $('#ds').textContent=curMonth+'　棚卸内訳　'+(r.kind||'');
    var st=statusOf(r);
    function row(k,v,rate,big){ return '<div class="drow'+(big?' big':'')+'"><span class="k">'+k+'</span><span><span class="v">'+v+'</span>'+(rate?'<span class="r">'+rate+'</span>':'')+'</span></div>'; }
    $('#dbody').innerHTML=''
      +'<div style="margin-bottom:10px"><span class="pill '+st.c+'">'+st.t+'</span> <span class="muted" style="font-size:12px">在庫回転 '+days1(r.turnover)+'</span></div>'
      +row('売上', yen(r.sales), '', true)
      +row('前月棚金', yen(r.invPrev))+row('当月仕入', yen(r.purchase), pct(r.purchaseRate))+row('当月棚金', yen(r.invCur))
      +row('当月実使用', yen(r.actual), r.sales&&r.actual!=null?pct(r.actual/r.sales):'')
      +row('理論原価', yen(r.theory), r.sales?pct(r.theory/r.sales):'')+row('必要ロス', yen(r.need))+row('廃棄ロス', yen(r.waste))
      +'<div class="drow big" style="border-bottom:0"><span class="k" style="font-weight:700">不明ロス</span><span><span class="v '+(r.unknown>0?'pos':'neg')+'">'+yen(r.unknown)+'</span><span class="r">'+pct(r.unknownRate)+'</span></span></div>';
    $('#ovl').classList.add('show'); $('#drawer').classList.add('show'); document.body.style.overflow='hidden';
  };
  window.closeDrawer=function(){ $('#ovl').classList.remove('show'); $('#drawer').classList.remove('show'); document.body.style.overflow=''; };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrawer(); });

  // 入力URLをコピー（担当者に送る、その店×その月専用）
  $('#dcopy').onclick=function(){
    if(!curStoreKey) return; var btn=$('#dcopy'); var old=btn.textContent; btn.textContent='取得中…'; btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false;
      var url=res&&res.ok&&res.links&&res.links[curMonth];
      if(!url){ btn.textContent='URL取得に失敗'; setTimeout(function(){btn.textContent=old;},1500); return; }
      var done=function(){ btn.textContent='コピー完了✓'; setTimeout(function(){btn.textContent=old;},1500); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){ legacyCopy(url); done(); }); }
      else { legacyCopy(url); done(); }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='通信エラー'; setTimeout(function(){btn.textContent=old;},1500); })
    .getStoreInputLinks(PASS, curStoreKey, [curMonth]);
  };
  function legacyCopy(t){ var el=document.createElement('textarea'); el.value=t; el.style.position='fixed'; el.style.opacity='0'; document.body.appendChild(el); el.focus(); el.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(el); }
  // 一覧の各店「入力URLをコピー」（その店×表示中の月 専用・署名トークン付き）
  window.copyInputUrl=function(key, btn){
    var old=btn.textContent; btn.textContent='取得中…'; btn.disabled=true;
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false; var url=res&&res.ok&&res.links&&res.links[curMonth];
      if(!url){ btn.textContent='取得失敗'; setTimeout(function(){btn.textContent=old;},1500); return; }
      var done=function(){ btn.textContent='コピー✓'; setTimeout(function(){btn.textContent=old;},1500); };
      if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,function(){legacyCopy(url);done();}); }
      else { legacyCopy(url); done(); }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='通信エラー'; setTimeout(function(){btn.textContent=old;},1500); })
    .getStoreInputLinks(PASS, key, [curMonth]);
  };

  window.go=function(t){ location.hash=t; closeNav(); };
  window.setMonth=function(m){ curMonth=m; render(); };
  window.setQ=function(v){ query=v; var cur=location.hash.slice(1); $('#view').innerHTML=(cur==='stores'?storeTableCard('🏬 店舗別 棚卸（'+curMonth+'）'):pageDashboard()); var q=$('#q'); if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);} };
  window.setSort=function(k){ if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=(k==='name'?1:-1); } render(); };
  window.toggleNav=function(){ var c=document.documentElement.getAttribute('data-nav')==='collapsed';
    if(c){document.documentElement.removeAttribute('data-nav');try{localStorage.setItem('nav-collapsed','0');}catch(e){}}
    else{document.documentElement.setAttribute('data-nav','collapsed');try{localStorage.setItem('nav-collapsed','1');}catch(e){}} };
  window.openNav=function(){ document.body.classList.add('navopen'); $('.sb-close').style.display='block'; };
  window.closeNav=function(){ document.body.classList.remove('navopen'); };
  window.refresh=function(){ loadData(true); };

  // ===== データ取得 =====
  function showLoading(on){ $('#load').style.display=on?'flex':'none'; }
  function showLogin(on){ $('#login').style.display=on?'flex':'none'; }
  window.doLogin=function(){
    var p=$('#pw').value.trim(); if(!p){ return; } $('#lerr').textContent='';
    var btn=$('#login button'); btn.disabled=true; btn.textContent='確認中…';
    google.script.run.withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='ログイン';
      if(res&&res.ok){ PASS=p; showLogin(false); loadData(false); }
      else { $('#lerr').textContent='パスコードが違います'; }
    }).withFailureHandler(function(){ btn.disabled=false; btn.textContent='ログイン'; $('#lerr').textContent='通信エラー'; })
    .verifyPasscode(p);
  };
  $('#pw')&&$('#pw').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

  function onData(d){
    showLoading(false);
    if(!d || d.authError){ showLogin(true); return; }
    RAW=d; ROWS={}; MONTHS=(d.months||[]).slice(); curMonth=MONTHS[MONTHS.length-1]||'';
    $('#upd').textContent=(d.updatedAt||'').slice(5,16);
    render();
  }
  function loadData(force){
    showLoading(true);
    google.script.run.withSuccessHandler(onData).withFailureHandler(function(e){ showLoading(false); alert('読み込みに失敗しました。再取得してください。'); }).getDashboardData(PASS, !!force);
  }

  window.addEventListener('hashchange',render);
  // 起動
  if(PASS){ loadData(false); } else { showLoading(false); showLogin(true); }
})();
</script>
</body>
</html>
