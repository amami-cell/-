  // ── 店舗画面 ─────────────────────────────────────────
  var FD_ROWS = [
    { label: '前月棚金', get: function (r) { return r.invPrev; } },
    { label: '当月仕入', get: function (r) { return r.purchase; } },
    { label: '当月棚金', get: function (r) { return r.invCur; } },
    { label: '当月実使用', get: function (r) { return r.actual; }, strong: true },
    { label: '理論原価', get: function (r) { return r.theory; }, loss: '理論原価' },
    { label: '必要ロス', get: function (r) { return r.need; }, loss: '必要ロス', indent: true },
    { label: '廃棄ロス', get: function (r) { return r.waste; }, loss: '廃棄ロス', indent: true },
    { label: '不明ロス', get: function (r) { return r.unknown; }, strong: true,
      clsFn: function (v) { return v > 0 ? 'pos' : 'neg'; } },
  ];

  // 仕入項目ラベルのセル（ロス行はタップで内訳を開閉）。lossR = 件数の集計元
  function fdLabelCell(row, ym, lossR, noCount) {
    var lbl = document.createElement('td'); lbl.className = 'lbl';
    if (row.indent) lbl.style.paddingLeft = '1.4em';
    if (row.loss) {
      var count = lossR.losses.filter(function (l) { return l.kind === row.loss; }).length;
      var isOpen = !!(expandedLoss && expandedLoss.ym === ym && expandedLoss.kind === row.loss);
      lbl.textContent = (isOpen ? '▾ ' : '▸ ') + row.label + (noCount ? '' : '（' + count + '件）');
      return { td: lbl, toggle: function () { expandedLoss = isOpen ? null : { ym: ym, kind: row.loss }; renderStore(); } };
    }
    lbl.textContent = row.label;
    return { td: lbl, toggle: null };
  }

  // 金額セル＋（withRate時）売上比セルを tr に追加。numCls=金額セルの追加クラス
  function fdValueCells(tr, r, row, withRate, numCls) {
    var v = r ? row.get(r) : null;
    var td = document.createElement('td'); td.className = 'num' + (numCls ? ' ' + numCls : '');
    td.textContent = v === null ? '—' : yen(v);
    if (row.clsFn && v !== null) { var c = row.clsFn(v); if (c) td.classList.add(c); }
    tr.appendChild(td);
    if (withRate) {
      var tdr = document.createElement('td'); tdr.className = 'rate';
      tdr.textContent = (v !== null && r && r.sales) ? pct(v / r.sales) : '';
      tr.appendChild(tdr);
    }
  }

  /** かんたん表示: FD合計=3列（項目｜FD合計｜売上比）／ F・D=5列（項目｜食材費(F)｜売上比｜飲料費(D)｜売上比） */
  function buildFdCompact(rFD, rF, rD, ym) {
    var split = compactView === 'split';
    var head = split
      ? [['仕入項目', 'lbl'], ['食材費(F)', 'num'], ['売上比', 'rate'], ['飲料費(D)', 'num'], ['売上比', 'rate']]
      : [['仕入項目', 'lbl'], ['FD合計', 'num'], ['売上比', 'rate']];
    var tbl = document.createElement('table'); tbl.className = 'items ' + (split ? 'c5' : 'compact');
    var trh = document.createElement('tr'); trh.className = 'head';
    head.forEach(function (hc) { var td = document.createElement('td'); td.className = hc[1]; td.textContent = hc[0]; trh.appendChild(td); });
    tbl.appendChild(trh);
    FD_ROWS.forEach(function (row) {
      var tr = document.createElement('tr');
      if (row.strong) tr.className = 'strong';
      var lc = fdLabelCell(row, ym, rFD, split);   // ロス件数はFD基準、5列は件数省略
      if (lc.toggle) { tr.style.cursor = 'pointer'; tr.onclick = lc.toggle; }
      tr.appendChild(lc.td);
      if (split) {
        fdValueCells(tr, rF, row, true);   // 食材費(F)＋売上比
        fdValueCells(tr, rD, row, true);   // 飲料費(D)＋売上比
      } else {
        fdValueCells(tr, rFD, row, true);  // FD合計＋売上比
      }
      tbl.appendChild(tr);
    });
    var wrap = document.createElement('div'); wrap.className = 'table-scroll';
    wrap.appendChild(tbl);
    return wrap;
  }

  /** 全表示: 仕入項目｜FD合計｜売上比｜食材費(F)｜売上比｜飲料費(D)｜売上比 の7列表（横スクロール） */
  function buildFdWide(rFD, rF, rD, ym) {
    var tbl = document.createElement('table'); tbl.className = 'items';
    var trh = document.createElement('tr'); trh.className = 'head';
    [['仕入項目', 'lbl'],
     ['ＦＤ合計', 'num'], ['売上比', 'rate'],
     ['食材費(F)', 'num'], ['売上比', 'rate'],
     ['飲料費(D)', 'num'], ['売上比', 'rate']].forEach(function (hc) {
      var td = document.createElement('td'); td.className = hc[1]; td.textContent = hc[0]; trh.appendChild(td);
    });
    tbl.appendChild(trh);
    FD_ROWS.forEach(function (row) {
      var tr = document.createElement('tr');
      if (row.strong) tr.className = 'strong';
      var lc = fdLabelCell(row, ym, rFD);
      if (lc.toggle) { tr.style.cursor = 'pointer'; tr.onclick = lc.toggle; }
      tr.appendChild(lc.td);
      fdValueCells(tr, rFD, row, true);
      fdValueCells(tr, rF, row, true);
      fdValueCells(tr, rD, row, true);
      tbl.appendChild(tr);
    });
    var wrap = document.createElement('div'); wrap.className = 'table-scroll';
    wrap.appendChild(tbl);
    return wrap;
  }

  function renderStore() {
    var name = '';
    DATA.stores.forEach(function (s) { if (s.key === curStore) name = s.name; });

    // FD合計/F・D の切替は「かんたん表示」のときだけ出す（全表示は全部出るので不要）
    document.getElementById('storeModeRow').style.display = storeWide ? 'none' : '';

    // ヒーロー: 最新月（店舗ページは常にFD合算基準）
    var latest = null;
    for (var i = DATA.months.length - 1; i >= 0; i--) {
      var r0 = calcM(curStore, DATA.months[i], 'FD');
      if (r0) { latest = r0; break; }
    }
    var heroEl = document.getElementById('heroStore');
    if (latest) {
      renderHero(heroEl, latest.turnover, latest.invCur || 0, latest.theory, latest.days, name + ' ' + latest.ym, 'FD合算');
    } else {
      heroEl.textContent = 'データがありません';
    }

    var box = document.getElementById('monthBlocks');
    box.textContent = '';

    DATA.months.slice().reverse().forEach(function (ym) {
      var rFD = calcM(curStore, ym, 'FD');
      if (!rFD) return;
      // 店舗ページは常にFD合算基準（在庫日数・売上・ロス内訳）
      var r = rFD;

      var card = document.createElement('div'); card.className = 'card';

      // ── ヘッダー行 ──
      var h = document.createElement('div'); h.className = 'mhead';
      var ymEl = document.createElement('span'); ymEl.className = 'ym'; ymEl.textContent = ym;
      h.appendChild(ymEl);
      if (rFD.kind === '中間') {
        var kb = document.createElement('span'); kb.className = 'kind-badge'; kb.textContent = '中間';
        h.appendChild(kb);
      }
      if (r && r.turnover !== null) {
        var chip = document.createElement('span'); chip.className = 'turn-chip';
        chip.textContent = '在庫 ' + days1(r.turnover) + '日分';
        h.appendChild(chip);
      }
      var sp = document.createElement('span'); sp.className = 'spacer'; h.appendChild(sp);
      var salesEl = document.createElement('span');
      salesEl.style.cssText = 'font-size:13px;color:var(--ink-2);white-space:nowrap';
      salesEl.textContent = '売上 ' + yen(rFD.sales);
      h.appendChild(salesEl);
      card.appendChild(h);

      // ── 棚卸項目（かんたん=FDは5列/F・Dは3列 ／ 全表示=7列横スクロール）──
      if (storeWide) {
        card.appendChild(buildFdWide(rFD, calcM(curStore, ym, 'F'), calcM(curStore, ym, 'D'), ym));
      } else {
        card.appendChild(buildFdCompact(rFD, calcM(curStore, ym, 'F'), calcM(curStore, ym, 'D'), ym));
      }

      // ── ロス内訳（合計行をタップで開閉）──
      if (expandedLoss && expandedLoss.ym === ym) {
        var kindSel = expandedLoss.kind;
        var list = r.losses.filter(function (l) { return l.kind === kindSel; });
        var ll = document.createElement('div'); ll.className = 'loss-list';
        var lt = document.createElement('div');
        lt.style.cssText = 'font-size:12px;color:var(--muted);margin:8px 0 2px';
        lt.textContent = '📋 ' + kindSel + 'の内訳（' + list.length + '件）';
        ll.appendChild(lt);
        if (!list.length) {
          var em = document.createElement('div'); em.className = 'empty';
          em.textContent = 'まだ登録がありません。下のボタンから入力できます。';
          ll.appendChild(em);
        }
        list.forEach(function (l) {
          var it = document.createElement('div'); it.className = 'loss-item';
          var c1 = document.createElement('span'); c1.className = 'cat'; c1.textContent = l.cat;
          var c2 = document.createElement('span'); c2.className = 'memo'; c2.textContent = l.memo;
          var c3 = document.createElement('span'); c3.className = 'amt'; c3.textContent = yen(l.amount);
          var del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
          del.title = '削除';
          del.onclick = function (ev) { ev.stopPropagation(); removeLoss(l, ym, del); };
          it.appendChild(c1); it.appendChild(c2); it.appendChild(c3); it.appendChild(del);
          ll.appendChild(it);
        });
        card.appendChild(ll);
      }

      // ── 入力（ロス・理論原価をタブ付きモーダルで）──
      var lb = document.createElement('div'); lb.className = 'loss-btns';
      var addBtn = document.createElement('button'); addBtn.className = 'btn-input big';
      addBtn.textContent = '✏ ロス・理論原価を入力';
      (function (ymC) { addBtn.onclick = function () { openLossModal(curStore, ymC); }; })(ym);
      lb.appendChild(addBtn);
      card.appendChild(lb);

      box.appendChild(card);
    });

    if (!box.children.length) {
      var e = document.createElement('div'); e.className = 'card empty';
      e.textContent = 'この店舗のデータはまだありません';
      box.appendChild(e);
    }
    fitAll();
  }

  function buildLossForm(storeKey, ym, kind, opts) {
    var isTheory = kind === '理論原価';
    var memoPlaceholder = isTheory ? '理由（例：急な宴会の仕入）' : '内容（例：鮮魚廃棄）';
    var amtPlaceholder = isTheory ? '追加する金額（円）' : '金額（円）';
    var f = document.createElement('div'); f.className = 'loss-form';
    var t = document.createElement('div'); t.className = 'title';
    t.textContent = ym + ' の' + kind + (isTheory ? 'を追加（理由つき・複数OK）' : 'を登録（複数まとめて入力OK）');
    f.appendChild(t);

    var itemsWrap = document.createElement('div');
    itemsWrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;min-width:0';
    f.appendChild(itemsWrap);

    var pricePlaceholder = isTheory ? '追加額' : '金額';
    function addRowUI() {
      var row = document.createElement('div'); row.className = 'loss-row2';
      // 1行目: 分類 + 内容
      var line1 = document.createElement('div'); line1.className = 'lr-line';
      var cat = document.createElement('select');
      ['フード', 'ドリンク'].forEach(function (c) {
        var o = document.createElement('option'); o.value = c; o.textContent = c; cat.appendChild(o);
      });
      if (fdMode === 'D') cat.value = 'ドリンク';
      var memo = document.createElement('input'); memo.type = 'text'; memo.placeholder = memoPlaceholder;
      var del = document.createElement('button'); del.className = 'small lr-del'; del.textContent = '✕'; del.title = 'この行を消す';
      line1.appendChild(cat); line1.appendChild(memo); line1.appendChild(del);
      // 2行目: 金額 × 数量 ＝ 合計（自動計算）
      var line2 = document.createElement('div'); line2.className = 'lr-line';
      var price = document.createElement('input'); price.type = 'number'; price.className = 'f-price'; price.placeholder = pricePlaceholder; price.min = '1'; price.inputMode = 'numeric';
      var x = document.createElement('span'); x.className = 'op'; x.textContent = '×';
      var qty = document.createElement('input'); qty.type = 'number'; qty.className = 'f-qty'; qty.placeholder = '数量'; qty.min = '1'; qty.inputMode = 'numeric';
      var eq = document.createElement('span'); eq.className = 'op'; eq.textContent = '＝';
      var total = document.createElement('span'); total.className = 'f-total'; total.textContent = '¥0';
      line2.appendChild(price); line2.appendChild(x); line2.appendChild(qty); line2.appendChild(eq); line2.appendChild(total);
      function recompute() {
        var t = Math.round((Number(price.value) || 0) * (Number(qty.value) || 0));
        total.textContent = yen(t > 0 ? t : 0);
      }
      price.addEventListener('input', recompute); qty.addEventListener('input', recompute);
      // 入力し始めたらピンク警告を消す
      [memo, price, qty].forEach(function (el) {
        el.addEventListener('input', function () { el.classList.remove('invalid'); });
      });
      del.onclick = function () {
        if (itemsWrap.children.length > 1) row.remove();
        else { memo.value = ''; price.value = ''; qty.value = ''; recompute();
          memo.classList.remove('invalid'); price.classList.remove('invalid'); qty.classList.remove('invalid'); }
      };
      row.appendChild(line1); row.appendChild(line2);
      itemsWrap.appendChild(row);
      return { memo: memo };
    }
    var first = addRowUI();

    var addBtn = document.createElement('button'); addBtn.className = 'small';
    addBtn.textContent = '＋ 項目を追加';
    addBtn.style.justifySelf = 'start';
    addBtn.onclick = function () {
      addRowUI();   // 行を足すだけ（内容欄へフォーカス移動＝画面が飛ぶのはしない）
    };
    f.appendChild(addBtn);

    var act = document.createElement('div'); act.className = 'frow';
    var save = document.createElement('button'); save.className = 'primary small'; save.textContent = '更新（まとめて登録）';
    var cancel = document.createElement('button'); cancel.className = 'small'; cancel.textContent = 'とじる';
    var msg = document.createElement('span'); msg.className = 'msg';
    act.appendChild(save); act.appendChild(cancel); act.appendChild(msg);
    f.appendChild(act);

    cancel.onclick = function () { opts.onCancel(); };
    save.onclick = function () {
      var items = [];
      var hasInvalid = false;
      var rows = Array.prototype.slice.call(itemsWrap.children);
      // 何か打ち込んだ行だけ検証。1つも無ければ先頭行を「未入力」として警告する
      function active(row) {
        return row.querySelector('input[type="text"]').value.trim() ||
               row.querySelector('.f-price').value || row.querySelector('.f-qty').value;
      }
      var targets = rows.filter(active);
      if (!targets.length && rows.length) targets = [rows[0]];
      targets.forEach(function (row) {
        var cat = row.querySelector('select').value;
        var memoEl = row.querySelector('input[type="text"]');
        var priceEl = row.querySelector('.f-price');
        var qtyEl = row.querySelector('.f-qty');
        var memo = memoEl.value.trim();
        var price = Number(priceEl.value);
        var qty = Number(qtyEl.value);
        var ok = true;
        // 打ち込めている分の色は消す・空の欄だけピンクにする
        if (!memo) { memoEl.classList.add('invalid'); hasInvalid = true; ok = false; } else { memoEl.classList.remove('invalid'); }
        if (!isFinite(price) || price <= 0) { priceEl.classList.add('invalid'); hasInvalid = true; ok = false; } else { priceEl.classList.remove('invalid'); }
        if (!isFinite(qty) || qty <= 0) { qtyEl.classList.add('invalid'); hasInvalid = true; ok = false; } else { qtyEl.classList.remove('invalid'); }
        if (ok) items.push({ cat: cat, memo: memo, amount: Math.round(price * qty) });
      });
      if (hasInvalid) { msg.className = 'msg err'; msg.textContent = 'ピンクの欄が打ち込めていません。埋めてから更新してください'; return; }
      if (!items.length) { msg.className = 'msg err'; msg.textContent = '1件も入力されていません'; return; }
      save.disabled = true;
      msg.className = 'msg'; msg.textContent = items.length + '件を登録中…';
      google.script.run
        .withSuccessHandler(function (res) {
          save.disabled = false;
          if (!res.ok) { msg.className = 'msg err'; msg.textContent = res.message; return; }
          if (!DATA.losses[ym]) DATA.losses[ym] = {};
          if (!DATA.losses[ym][storeKey]) DATA.losses[ym][storeKey] = [];
          res.recs.forEach(function (rec) { DATA.losses[ym][storeKey].push(rec); });
          opts.onSaved(res.recs);
        })
        .withFailureHandler(function (e) {
          save.disabled = false;
          msg.className = 'msg err'; msg.textContent = 'エラー: ' + e.message;
        })
        .addLosses(PASS, storeKey, ym, kind, items);
    };
    return f;
  }

  function removeLoss(rec, ym, btn) {
    if (!confirm('「' + rec.memo + '」 ' + yen(rec.amount) + ' を削除しますか？')) return;
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.ok) { alert(res.message); btn.disabled = false; return; }
        var arr = (DATA.losses[ym] || {})[curStore] || [];
        var i = arr.findIndex(function (x) { return x.id === rec.id; });
        if (i >= 0) arr.splice(i, 1);
        renderStore();
      })
      .withFailureHandler(function (e) { alert('エラー: ' + e.message); btn.disabled = false; })
      .deleteLoss(PASS, rec.id);
  }

  // ── 画面切替・全体描画 ────────────────────────────────
  function openStore(key) {
    curStore = key; view = 'store'; openForm = null;
    document.getElementById('storeSel').value = key;
    renderAll();
    window.scrollTo({ top: 0 });
  }

  // ── ロス入力モーダル（一覧・店舗どちらからでも） ──
  var lossModal = null;   // { storeKey, ym }
  function renderLossForm() {
    var host = document.getElementById('lossFormHost');
    host.textContent = '';
    var kind = document.querySelector('#lossKindSeg button.on').dataset.k;
    host.appendChild(buildLossForm(lossModal.storeKey, lossModal.ym, kind, {
      onSaved: function (recs) {
        var note = document.getElementById('lossNote');
        note.className = 'msg ok';
        note.textContent = '✓ ' + recs.length + '件を登録しました（続けて入力できます）';
        renderLossForm();                       // 空フォームに戻す
        // 打ち込んだら未入力タブからも即消えるよう、現在のタブを再描画
        if (view === 'highlight') renderHighlightTab(); else if (view === 'pending') renderPending(); else if (view === 'store') renderStore(); else renderList();
      },
      onCancel: function () { closeLossModal(); }
    }));
  }
  function openLossModal(storeKey, ym) {
    var name = '';
    DATA.stores.forEach(function (s) { if (s.key === storeKey) name = s.name; });
    lossModal = { storeKey: storeKey, ym: ym };
    document.getElementById('lossTitle').textContent = name + '　' + ym + ' のロス入力';
    var note = document.getElementById('lossNote'); note.textContent = ''; note.className = 'msg';
    var seg = document.getElementById('lossKindSeg');
    seg.querySelectorAll('button').forEach(function (x, i) { x.classList.toggle('on', i === 0); });
    renderLossForm();
    document.getElementById('lossOverlay').classList.add('show');
  }
  function closeLossModal() {
    document.getElementById('lossOverlay').classList.remove('show');
    lossModal = null;
    if (view === 'highlight') renderHighlightTab(); else if (view === 'pending') renderPending(); else if (view === 'store') renderStore(); else renderList();
  }

  function renderAll() {
    document.getElementById('updatedAt').textContent = '取得: ' + DATA.updatedAt;
    document.getElementById('listView').style.display = view === 'list' ? '' : 'none';
    document.getElementById('storeView').style.display = view === 'store' ? '' : 'none';
    document.getElementById('highlightView').style.display = view === 'highlight' ? '' : 'none';
    document.getElementById('costView').style.display = view === 'cost' ? '' : 'none';
    document.getElementById('pendingView').style.display = view === 'pending' ? '' : 'none';
    // 最上部バー: F/D/FD は一覧・ランキング・原価判定で表示、店舗ナビは店舗のみ
    var modeVis = (view === 'list' || view === 'highlight' || view === 'cost');
    document.getElementById('listModeBar').style.display = modeVis ? '' : 'none';
    document.getElementById('storeNavBar').style.display = view === 'store' ? '' : 'none';
    // 下タブバー: 一覧(店舗詳細含む) / ランキング / 原価判定 / 未入力
    document.getElementById('tabbar').style.display = '';
    document.querySelectorAll('#tabbar button').forEach(function (b) {
      var on = (b.dataset.tab === 'highlight') ? (view === 'highlight')
             : (b.dataset.tab === 'cost') ? (view === 'cost')
             : (b.dataset.tab === 'pending') ? (view === 'pending')
             : (view === 'list' || view === 'store');
      b.classList.toggle('on', on);
    });
    syncModeSegs();
    if (view === 'highlight') renderHighlightTab();
    else if (view === 'cost') renderCostTab();
    else if (view === 'pending') renderPending();
    else if (view === 'store') renderStore();
    else renderList();
  }

  // F/D/FD 切替（一覧の #fdSeg）
  function syncModeSegs() {
    ['fdSeg'].forEach(function (id) {
      var seg = document.getElementById(id); if (!seg) return;
      seg.querySelectorAll('button').forEach(function (x) {
        x.classList.toggle('on', x.dataset.mode === fdMode);
      });
    });
  }

  function initSelectors() {
    ['monthSel', 'monthSel2', 'monthSel3', 'monthSel4'].forEach(function (id) {
      var mSel = document.getElementById(id);
      mSel.textContent = '';
      DATA.months.forEach(function (m) {
        var o = document.createElement('option'); o.value = m; o.textContent = m; mSel.appendChild(o);
      });
      mSel.value = curMonth;
    });

    var sSel = document.getElementById('storeSel');
    sSel.textContent = '';
    DATA.stores.forEach(function (s) {
      var o = document.createElement('option'); o.value = s.key; o.textContent = s.name; sSel.appendChild(o);
    });
    if (curStore) sSel.value = curStore;
  }

  function showLogin() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginView').style.display = '';
    setTimeout(function () { document.getElementById('loginPass').focus(); }, 0);
  }

  function load(force, done) {
    var app = document.getElementById('app');
    if (DATA) app.classList.add('dimmed');
    google.script.run
      .withSuccessHandler(function (d) {
        if (d && d.authError) { showLogin(); if (done) done(); return; }
        DATA = d;
        // ログイン成功をホーム画面アプリ（親ページ）に通知し、パスコードを覚えてもらう。
        // GASはiframe内でiOSに保存を消されるため、消えない親ページ側に記憶させて自動ログインに使う。
        try { if (window.top && window.top !== window.self && PASS) window.top.postMessage({ type: 'tana-auth', p: PASS }, '*'); } catch (e) {}
        if (!curMonth || DATA.months.indexOf(curMonth) < 0) {
          curMonth = defaultMonth();
        }
        if (!curStore && DATA.stores.length) curStore = DATA.stores[0].key;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('loginView').style.display = 'none';
        app.style.display = '';
        app.classList.remove('dimmed');
        initSelectors();
        renderAll();
        if (done) done();
      })
      .withFailureHandler(function (e) {
        document.getElementById('loading').textContent = '読み込みに失敗しました: ' + e.message;
        if (done) done();
      })
      .getDashboardData(PASS, !!force);
  }

  // ── 触覚フィードバック・引っ張って更新（すさび湯PWA準拠）──
  function haptic(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  (function () {
    var ptr = document.getElementById('ptr'), appEl = document.getElementById('app');
    if (!ptr || !appEl) return;
    var arrow = ptr.querySelector('i');
    var startY = null, ready = false, busy = false, TRIGGER = 70;
    function atTop() { return (window.scrollY || document.documentElement.scrollTop || 0) <= 0; }
    function setPull(dy) {
      var y = Math.min(dy * 0.5, 120);
      appEl.style.transition = 'none'; appEl.style.transform = 'translateY(' + y + 'px)';
      ptr.style.transition = 'none'; ptr.style.opacity = String(Math.min(y / 32, 1));
      ptr.style.transform = 'translateY(' + (Math.min(y, 92) - 46) + 'px)';
      arrow.style.transform = 'rotate(' + Math.min(y * 3, 270) + 'deg)';
      var nr = dy >= TRIGGER; if (nr && !ready) haptic(12); ready = nr;
    }
    function springBack() {
      appEl.style.transition = 'transform .3s cubic-bezier(.2,.8,.3,1)'; appEl.style.transform = 'translateY(0)';
      ptr.style.transition = 'transform .25s ease, opacity .25s ease'; ptr.style.opacity = '0'; ptr.style.transform = 'translateY(-54px)';
      arrow.style.transform = '';
    }
    function refreshing() {
      busy = true; ptr.classList.add('spin'); arrow.style.transform = '';
      appEl.style.transition = 'transform .2s ease'; appEl.style.transform = 'translateY(54px)';
      ptr.style.transition = 'transform .2s ease, opacity .2s ease'; ptr.style.opacity = '1'; ptr.style.transform = 'translateY(10px)';
    }
    document.addEventListener('touchstart', function (e) {
      if (busy || e.touches.length !== 1 || document.querySelector('.overlay.show')) { startY = null; return; }
      startY = atTop() ? e.touches[0].clientY : null;
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (busy || startY == null) return;
      var dy = e.touches[0].clientY - startY;
      if (dy > 0 && atTop()) { e.preventDefault(); setPull(dy); }
      else { startY = null; ready = false; springBack(); }
    }, { passive: false });
    document.addEventListener('touchend', function () {
      if (busy || startY == null) return;
      var go = ready; startY = null; ready = false;
      if (!go) { springBack(); return; }
      haptic(25); refreshing();
      load(true, function () { busy = false; ptr.classList.remove('spin'); springBack(); haptic(8); });
    });
  })();

  // ── イベント ─────────────────────────────────────────
  function onModeClick(e) {
    var b = e.target.closest('button');
    if (!b) return;
    fdMode = b.dataset.mode;
    syncModeSegs();
    renderAll();
  }
  document.getElementById('fdSeg').addEventListener('click', onModeClick);
  document.getElementById('compactSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    compactView = b.dataset.cv;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderStore();
  });
  document.getElementById('pctSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    pct2View = b.dataset.p;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderAll();
  });
  document.getElementById('wideSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    storeWide = b.dataset.w === '1';
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderStore();
  });

  // ── 2%設定モーダル ───────────────────────────────────
  var pctOverlay = document.getElementById('pctOverlay');
  document.getElementById('btnPctSetup').onclick = function () {
    var list = document.getElementById('pctList');
    list.textContent = '';
    DATA.stores.forEach(function (s) {
      var lab = document.createElement('label');
      lab.style.cssText = 'display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--grid);font-size:13px;cursor:pointer';
      var cb = document.createElement('input'); cb.type = 'checkbox';
      cb.dataset.key = s.key;
      cb.checked = !!((DATA.storeFlags || {})[s.key]);
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(s.name));
      list.appendChild(lab);
    });
    document.getElementById('pctMsg').textContent = '';
    pctOverlay.classList.add('show');
  };
  document.getElementById('btnPctCancel').onclick = function () { pctOverlay.classList.remove('show'); };
  pctOverlay.addEventListener('click', function (e) { if (e.target === pctOverlay) pctOverlay.classList.remove('show'); });
  document.getElementById('btnPctSave').onclick = function () {
    var flags = {};
    document.querySelectorAll('#pctList input[type="checkbox"]').forEach(function (cb) {
      flags[cb.dataset.key] = cb.checked;
    });
    var btn = this;
    var msg = document.getElementById('pctMsg');
    btn.disabled = true;
    msg.className = 'msg'; msg.textContent = '保存中…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
        msg.textContent = res.message;
        if (res.ok) {
          DATA.storeFlags = flags;
          pctOverlay.classList.remove('show');
          renderAll();
        }
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        msg.className = 'msg err'; msg.textContent = 'エラー: ' + e.message;
      })
      .saveStoreFlags(PASS, flags);
  };

  document.getElementById('metricSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    listMetric = b.dataset.m;
    sortKey = SORTS[listMetric][0].k;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderList();
  });
  document.getElementById('sortSel').onchange = function () { sortKey = this.value; renderList(); };
  document.getElementById('sortDirSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    sortAsc = (b.dataset.dir === 'asc');
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    renderList();
  });
  function setMonth(ym) {
    curMonth = ym;
    ['monthSel', 'monthSel2', 'monthSel3', 'monthSel4'].forEach(function (id) { document.getElementById(id).value = ym; });
    if (view === 'highlight') renderHighlightTab();
    else if (view === 'cost') renderCostTab();
    else if (view === 'pending') renderPending();
    else renderList();
  }
  function stepMonth(dir) {
    var j = DATA.months.indexOf(curMonth) + dir;
    if (j >= 0 && j < DATA.months.length) setMonth(DATA.months[j]);
  }
  ['monthSel', 'monthSel2', 'monthSel3', 'monthSel4'].forEach(function (id) {
    document.getElementById(id).onchange = function () { setMonth(this.value); };
  });
  [['mPrev', -1], ['mNext', 1], ['mPrev2', -1], ['mNext2', 1], ['mPrev3', -1], ['mNext3', 1], ['mPrev4', -1], ['mNext4', 1]].forEach(function (o) {
    document.getElementById(o[0]).onclick = function () { stepMonth(o[1]); };
  });
  document.getElementById('btnBack').onclick = function () { view = 'list'; renderAll(); };
  document.getElementById('storeSel').onchange = function () { curStore = this.value; openForm = null; renderStore(); };
  document.getElementById('btnReload').onclick = function () { load(true); };
  document.getElementById('btnFwAll').onclick = function () { openFetchModal('fw', curMonth); };
  document.getElementById('btnImAll').onclick = function () { openFetchModal('infomart', curMonth); };
  document.getElementById('tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    haptic(8);
    var tab = b.dataset.tab;
    view = (tab === 'highlight') ? 'highlight' : (tab === 'cost') ? 'cost' : (tab === 'pending') ? 'pending' : 'list';
    renderAll(); window.scrollTo({ top: 0 });
  });

  // ── ロス入力モーダル ─────────────────────────────────
  document.getElementById('lossKindSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var note = document.getElementById('lossNote'); note.textContent = ''; note.className = 'msg';
    renderLossForm();
  });
  document.getElementById('btnLossClose').onclick = closeLossModal;
  document.getElementById('lossOverlay').addEventListener('click', function (e) {
    if (e.target === this) closeLossModal();
  });

  // ── ログイン ─────────────────────────────────────────
  function doLogin() {
    var v = document.getElementById('loginPass').value;
    var msg = document.getElementById('loginMsg');
    msg.className = 'msg'; msg.textContent = '確認中…';
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) {
          PASS = v;
          try { localStorage.setItem('dashPass', v); } catch (e) {}
          document.getElementById('loginView').style.display = 'none';
          document.getElementById('loading').style.display = '';
          load(false);
        } else {
          msg.className = 'msg err'; msg.textContent = 'パスワードが違います';
        }
      })
      .withFailureHandler(function (e) { msg.className = 'msg err'; msg.textContent = 'エラー: ' + e.message; })
      .verifyPasscode(v);
  }
  document.getElementById('btnLogin').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });

  // ── パスワード変更 ───────────────────────────────────
  var passOverlay = document.getElementById('passOverlay');
  // パスワード変更は一般画面には出さない（オーナー用の隠し操作）。
  // タイトルを長押し（約0.8秒）すると変更モーダルが開く。変更には現在のパスワードが必要。
  function openPassModal() {
    document.getElementById('passCurrent').value = '';
    document.getElementById('passNext').value = '';
    document.getElementById('passMsg').textContent = '';
    passOverlay.classList.add('show');
  }
  (function () {
    var title = document.getElementById('appTitle');
    if (!title) return;
    var timer = null;
    function start() { timer = setTimeout(function () { haptic(15); openPassModal(); }, 800); }
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    title.addEventListener('touchstart', start, { passive: true });
    title.addEventListener('touchend', cancel);
    title.addEventListener('touchmove', cancel, { passive: true });
    title.addEventListener('mousedown', start);
    title.addEventListener('mouseup', cancel);
    title.addEventListener('mouseleave', cancel);
  })();
  document.getElementById('btnPassCancel').onclick = function () { passOverlay.classList.remove('show'); };
  passOverlay.addEventListener('click', function (e) { if (e.target === passOverlay) passOverlay.classList.remove('show'); });
  document.getElementById('btnPassSave').onclick = function () {
    var cur = document.getElementById('passCurrent').value;
    var next = document.getElementById('passNext').value;
    var msg = document.getElementById('passMsg');
    var btn = this;
    btn.disabled = true;
    msg.className = 'msg'; msg.textContent = '保存中…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
        msg.textContent = res.message;
        if (res.ok) {
          PASS = next;
          try { localStorage.setItem('dashPass', next); } catch (e) {}
          setTimeout(function () { passOverlay.classList.remove('show'); }, 900);
        }
      })
      .withFailureHandler(function (e) { btn.disabled = false; msg.className = 'msg err'; msg.textContent = 'エラー: ' + e.message; })
      .changePasscode(cur, next);
  };

  // ── 取込モーダル ─────────────────────────────────────
  var overlay = document.getElementById('fetchOverlay');
  var pendingFetch = null;   // {target, ym}

  function openFetchModal(target, ym) {
    pendingFetch = { target: target, ym: ym };
    var label = target === 'fw' ? 'FW取込' : 'インフォマート取込';
    var what = target === 'fw' ? '売上・仕入・理論原価' : '棚卸金額';
    document.getElementById('fetchTitle').textContent = '⟳ ' + label + '（' + ym + '）';
    document.getElementById('fetchDesc').textContent =
      ym + ' の' + what + 'を、全店舗ぶんクラウドで再集計してシートを最新に置き換えます（5〜15分）。よろしいですか？';
    var msg = document.getElementById('fetchMsg');
    msg.className = 'msg'; msg.textContent = '';
    var fp = document.getElementById('fetchPass'); fp.value = '';
    document.getElementById('btnFetchRun').style.display = '';
    overlay.classList.add('show');
  }

  document.getElementById('btnFetchCancel').onclick = function () { overlay.classList.remove('show'); };
  overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.classList.remove('show'); });

  document.getElementById('btnFetchRun').onclick = function () {
    if (!pendingFetch) return;
    var btn = this;
    var msg = document.getElementById('fetchMsg');
    var entered = document.getElementById('fetchPass').value;
    if (String(entered) !== String(PASS)) {
      msg.className = 'msg err'; msg.textContent = 'パスワードが違います';
      return;
    }
    btn.disabled = true;
    msg.className = 'msg'; msg.textContent = '起動中…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
        msg.textContent = res.message;
        if (res.ok) btn.style.display = 'none';
        if (res.needSetup) document.getElementById('tokenSetup').open = true;
      })
      .withFailureHandler(function (e) {
        btn.disabled = false;
        msg.className = 'msg err'; msg.textContent = 'エラー: ' + e.message;
      })
      .triggerCloudFetch(PASS, pendingFetch.target, pendingFetch.ym);
  };

  document.getElementById('btnSaveToken').onclick = function () {
    var token = document.getElementById('tokenInput').value;
    var msg = document.getElementById('fetchMsg');
    google.script.run
      .withSuccessHandler(function (res) {
        msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
        msg.textContent = res.message;
        if (res.ok) document.getElementById('tokenInput').value = '';
      })
      .saveGithubToken(PASS, token);
  };

  load(false);
})();
</script>
</body>
</html>
