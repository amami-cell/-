<style>
  /* ピッチデック風の明るいテーマ（白ベース＋濃い緑アクセント） */
  :root {
    --surface: #ffffff; --page: #f3f5ef;
    --ink: #18231b; --ink-2: #4a544c; --muted: #8b938b;
    --grid: #e5e8e0; --axis: #c7ccc2; --border: rgba(24,35,27,0.12);
    --accent: #2f6b3e; --accent-soft: #e8f1ea; --accent-line: #c3ddc9; --accent-ink: #2f6b3e;
    --good: #2f6b3e; --bad: #c0392b; --warn: #b07a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button, select, input, textarea { touch-action: manipulation; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.6;
    overflow-x: hidden; overscroll-behavior-y: contain;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 14px 96px; }

  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header .hgroup { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  header h1 { font-size: 18px; font-weight: 700; -webkit-user-select: none; user-select: none; }
  .updated { color: var(--muted); font-size: 11px; }
  .spacer { flex: 1; }

  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 13px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { font-size: 12px; padding: 4px 10px; }
  /* ロス入力ボタン：打ち込む場所がすぐ分かるよう目立たせる（緑塗り＋ペン） */
  button.btn-input {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 800;
    box-shadow: 0 2px 8px rgba(47,107,62,.28);
  }
  button.btn-input:active { transform: scale(.96); }
  button.btn-input.big { width: 100%; padding: 12px 14px; font-size: 14px; border-radius: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  select {
    font: inherit; padding: 6px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 240px;
  }
  /* iOSは入力欄のフォントが16px未満だとフォーカス時に自動ズーム（＝画面がアップ）するので16pxに固定 */
  input, select, textarea { font-size: 16px !important; }

  /* F/D/FD 切替（最上部・両画面共通） */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button { border: none; border-radius: 0; padding: 7px 16px; color: var(--ink-2); background: transparent; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters label { color: var(--ink-2); font-size: 13px; }
  .filters label.grp { min-width: 62px; font-weight: 600; color: var(--ink-2); }
  .ctrl-card { background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
  .ctrl-card .filters { margin-bottom: 10px; }
  .kind-badge {
    display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--ink-2);
  }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
  .dimmed { opacity: .5; pointer-events: none; }

  /* 在庫回転日数ヒーロー */
  .hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hero .big { font-size: 52px; font-weight: 700; line-height: 1.1; }
  .hero .big small { font-size: 22px; font-weight: 600; color: var(--ink-2); }
  .hero .sub { color: var(--muted); font-size: 12px; }
  .hero .hlabel { font-size: 13px; color: var(--ink-2); width: 100%; }
  @media (max-width: 480px) {
    .hero .big { font-size: 40px; }
    .hero .big small { font-size: 18px; }
  }

  /* 店舗リスト（一覧画面・横はみ出しなし） */
  .seg-sm button { padding: 5px 14px; font-size: 13px; }
  .srow {
    border: 1px solid var(--border); border-radius: 12px; background: var(--page);
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
    transition: border-color .1s, box-shadow .1s;
  }
  .srow:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .sr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .sr-name { font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-vals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sr-vals.three { grid-template-columns: 1fr 1fr 1fr; }
  .mini {
    border: 1px solid var(--grid); border-radius: 10px; background: var(--surface);
    padding: 8px 12px; min-width: 0;
  }
  .mini .mv { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mini .mv.big { font-size: 17px; }
  .mini .mv.muted { color: var(--muted); font-weight: 500; font-size: 14px; }
  .mini .ml { font-size: 11px; color: var(--muted); margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .mr { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 1px; white-space: nowrap; }
  .mini .mr.accent { color: var(--accent); font-weight: 700; font-size: 13px; }
  @media (max-width: 480px) { .mini { padding: 7px 9px; } .mini .mv { font-size: 13px; } .mini .mv.big { font-size: 15px; } .mini .mv.muted { font-size: 12px; } }
  @media (max-width: 360px) { .mini .mv { font-size: 12px; } .mini .mv.big { font-size: 13px; } }

  /* 今月のハイライト（MVP表彰） */
  .card .cardh { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .hl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 640px) { .hl-grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }
  .hl { border: 1px solid var(--grid); border-radius: 12px; padding: 11px 12px; background: var(--page); }
  .hl.mvp { border-color: color-mix(in srgb, var(--accent) 45%, var(--grid)); }
  .hl.warn { border-color: color-mix(in srgb, var(--bad) 45%, var(--grid)); }
  .hl .hle { font-size: 20px; line-height: 1; }
  .hl .hll { font-size: 11px; color: var(--muted); margin: 5px 0 1px; }
  .hl .hln { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hl .hlv { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; margin-top: 1px; }

  /* 信号機・前月比・スパークライン */
  .sig { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border);
         display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
  .sig.sig-good { color: var(--good); } .sig.sig-warn { color: var(--warn); } .sig.sig-bad { color: var(--bad); }
  .medal { flex: none; font-size: 15px; }
  .sr-trend { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .mom { font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  .mom.up { color: var(--bad); } .mom.down { color: var(--good); } .mom.flat { color: var(--muted); }
  .sr-trend .tl { font-size: 10px; color: var(--muted); flex: none; }
  .spark { flex: none; display: block; }

  /* ランキング */
  .rank-toggle { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .rank-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--grid); }
  .rank-row:last-child { border-bottom: none; }
  .rank-pos { width: 26px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; color: var(--ink-2); }
  .rank-name { flex: 1.1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
  .rank-bar-wrap { flex: 1; height: 8px; background: var(--grid); border-radius: 999px; overflow: hidden; }
  .rank-bar { height: 100%; border-radius: 999px; background: var(--accent); transition: width .4s ease; }
  .rank-val { width: 78px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; flex: none; color: var(--ink-2); }
  .rank-val { color: var(--ink); font-weight: 600; }
  .mv-list { display: grid; gap: 2px; }
  .mv-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--grid); cursor: pointer; }
  .mv-row:last-child { border-bottom: none; }
  .mv-row .mv-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
  .mv-row .mv-d { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
  .mv-row .mv-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* 原価判定の行（店名＋予算/理論/実使用＋差分） */
  .cj-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--grid); cursor: pointer; }
  .cj-row:last-child { border-bottom: none; }
  .cj-info { flex: 1; min-width: 0; }
  .cj-name { font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cj-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .rank-val.bad { color: var(--bad); } .rank-val.warn { color: var(--warn); } .rank-val.good { color: var(--good); }
  /* 今月の要点（全社サマリー）: 要チェック件数を一目＋タップで該当タブへ */
  .sum-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .sum-tile { border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; cursor: pointer; background: var(--surface); display: flex; flex-direction: column; gap: 1px; }
  .sum-tile:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .sum-tile .n { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .sum-tile .n small { font-size: 12px; font-weight: 700; margin-left: 1px; }
  .sum-tile .l { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sum-tile.alert .n { color: var(--bad); }
  .sum-tile.warn  .n { color: var(--warn); }
  .sum-tile.ok    .n { color: var(--good); }
  /* 予算比オーバー店舗の差異表示（理論差・仕入差の2行） */
  .cj-diffs { flex: none; display: flex; flex-direction: column; gap: 2px; text-align: right; font-variant-numeric: tabular-nums; }
  .cj-diff { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .cj-diff .cj-dlbl { font-size: 10px; font-weight: 400; color: var(--muted); margin-right: 4px; }
  .cj-diff .pos { color: var(--bad); } .cj-diff .neg { color: var(--good); }

  /* ロス未入力の行（不明ロス金額＋信号＋入力ボタン） */
  .pend-row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px dashed var(--grid); }
  .pend-row:last-child { border-bottom: none; }
  .pend-info { flex: 1; min-width: 0; }
  .pend-name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pend-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .pend-sub b { font-variant-numeric: tabular-nums; }
  .pend-row .sig { padding: 1px 7px; }

  /* 下タブバー */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0));
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .tabbar button {
    flex: 1; border: 1px solid transparent; border-radius: 14px; background: transparent; color: var(--muted);
    padding: 8px 2px; font-size: 12px; font-weight: 700; min-height: 60px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    white-space: nowrap;
  }
  .tabbar button .ic { font-size: 21px; line-height: 1; }
  .tabbar button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .tabbar button:active { background: color-mix(in srgb, var(--accent) 18%, transparent); }

  /* テーブル */
  .table-scroll { overflow-x: auto; max-width: 100%; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 9px; white-space: nowrap; }
  thead th {
    text-align: right; color: var(--muted); font-weight: 500; font-size: 12px;
    border-bottom: 1px solid var(--axis); cursor: pointer; user-select: none;
  }
  thead th:first-child { text-align: left; }
  tbody td { border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
  tbody td:first-child { text-align: left; }
  tbody tr:hover { background: rgba(128,128,128,.06); }
  .pos { color: var(--bad); }
  .neg { color: var(--good); }
  .sort-mark { font-size: 10px; }

  /* 月ブロック（店舗画面） */
  .mhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .mhead .ym { font-size: 17px; font-weight: 700; }
  .turn-chip {
    font-size: 13px; padding: 3px 12px; border-radius: 999px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  .items {
    width: 100%; font-size: 13px; border-collapse: separate; border-spacing: 0;
    border: 1px solid var(--grid); border-radius: 10px; overflow: hidden; background: var(--page);
  }
  .items td { border-bottom: 1px solid var(--grid); padding: 6px 8px; }
  .items tr:last-child td { border-bottom: none; }
  .items td.lbl { color: var(--ink-2); overflow-wrap: anywhere; }
  .items td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .items td.rate { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); font-size: 12px; }
  /* かんたん表: 3列を固定幅で詰めて整列（数字を左寄りに・横あふれ防止） */
  .items.compact { table-layout: fixed; }
  .items.compact td.lbl { width: 46%; }
  .items.compact td.num { width: 33%; }
  .items.compact td.rate { width: 21%; }
  /* かんたん表(F・D): 項目｜食材費(F)｜売上比｜飲料費(D)｜売上比 の5列 */
  .items.c5 { table-layout: fixed; }
  .items.c5 td { padding: 6px 4px; font-size: 11px; }
  .items.c5 td.lbl { width: 22%; word-break: break-all; }
  .items.c5 td.num { width: 24%; }
  .items.c5 td.rate { width: 13%; font-size: 10px; }
  .items.c5 tr.strong td { font-weight: 500; }
  .items.c5 tr.strong td.lbl { font-weight: 600; }
  .items.c5 tr.head td { font-size: 10px; }
  @media (max-width: 380px) { .items.c5 td { font-size: 10px; padding: 6px 3px; } }
  .items tr.head td { color: var(--muted); font-size: 11px; background: var(--surface); white-space: nowrap; }
  .items tr.strong td { font-weight: 600; background: var(--surface); }
  @media (max-width: 680px) {
    .items { font-size: 12px; }
    .items td { padding: 6px 5px; }
  }
  @media (max-width: 420px) {
    .items { font-size: 11px; }
    .items td { padding: 5px 4px; }
    .items td.rate { font-size: 10px; }
  }

  /* ロス */
  .loss-list { margin-top: 8px; }
  .loss-item {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    padding: 4px 0; border-bottom: 1px dashed var(--grid);
  }
  .loss-item .cat { color: var(--muted); flex: none; }
  .loss-item .memo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .loss-item .amt { font-variant-numeric: tabular-nums; }
  .loss-item .del { color: var(--muted); background: none; border: none; padding: 2px 6px; font-size: 12px; }
  .loss-item .del:hover { color: var(--bad); }
  .loss-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .loss-form {
    margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
  }
  .loss-form .title { font-size: 13px; font-weight: 600; }
  .loss-form .frow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .loss-form input[type="text"], .loss-form input[type="number"] {
    font: inherit; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  .loss-form input[type="text"] { flex: 1; min-width: 0; }
  .loss-form input[type="number"] { width: 130px; }
  /* 打ち込む欄は「まだ空」のあいだだけ淡い緑。入力すると色が消える */
  .loss-row2 input.f-price:placeholder-shown,
  .loss-row2 input.f-qty:placeholder-shown,
  .loss-row2 .lr-line input[type="text"]:placeholder-shown {
    background: var(--accent-soft); border-color: var(--accent-line);
  }
  .loss-row2 input:focus, .loss-row2 select:focus { outline: none; }
  /* 更新を押したとき、打ち込めていない欄をピンクで警告 */
  .loss-row2 input.invalid, .loss-row2 select.invalid {
    background: #fdecea !important; border-color: #e2564a !important;
  }
  /* ロス入力行: 1行目=分類+内容 / 2行目=金額×数量＝合計＋削除 */
  .loss-row2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 8px; border: 1px solid var(--grid); border-radius: 10px; background: var(--surface); }
  .loss-row2 .lr-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .loss-row2 select { flex: none; max-width: 116px; }
  .loss-row2 .op { color: var(--muted); font-size: 13px; flex: none; }
  .loss-form input.f-price { width: 78px; flex: none; }
  .loss-form input.f-qty { width: 48px; flex: none; }
  .loss-row2 .f-total { font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; text-align: right; white-space: nowrap; }
  .loss-row2 .lr-del { flex: none; padding: 4px 8px; }
  .radio-row { display: flex; gap: 12px; font-size: 13px; }
  .radio-row label { display: flex; align-items: center; gap: 4px; }

  .msg { font-size: 12px; min-height: 16px; }
  .msg.ok { color: var(--good); }
  .msg.err { color: var(--bad); }

  /* モーダル */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 100;
  }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; }
  .modal h3 { font-size: 15px; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal input[type="password"] {
    font: inherit; width: 100%; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }

  #loading { text-align: center; color: var(--muted); padding: 80px 0; }
  .spin {
    display: inline-block; width: 26px; height: 26px; border: 3px solid var(--grid);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); font-size: 13px; }

  /* ── すさび湯風の操作感・仕上げ ── */
  button { transition: transform .06s ease; }
  button:active { transform: scale(.96); }
  .seg button { transition: transform .1s ease, background .12s, color .12s; }
  .seg button:active { transform: scale(.94); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent-line); font-weight: 700; }
  button.primary { box-shadow: 0 3px 10px rgba(47,107,62,.22); }
  .card, .ctrl-card { border-radius: 16px; box-shadow: 0 1px 3px rgba(24,40,28,.06), 0 10px 22px rgba(24,40,28,.05); }
  .srow { border-radius: 16px; transition: transform .08s ease, border-color .1s, box-shadow .1s; }
  .srow:active { transform: scale(.985); }
  .rank-row:active, .mv-row:active { opacity: .55; }
  .turn-chip { background: var(--accent-soft); color: var(--accent-ink); }
  .tabbar { background: rgba(255,255,255,.9); backdrop-filter: saturate(180%) blur(12px); box-shadow: 0 -4px 20px rgba(24,40,28,.06); }
  .tabbar button.on { color: var(--accent-ink); background: var(--accent-soft); border-color: var(--accent-line); }
  .kind-badge { border-color: var(--accent-line); }
  .modal { border: 1px solid var(--grid); }
  /* 引っ張って更新（pull-to-refresh） */
  #ptr { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; margin-left: -19px; width: 38px; height: 38px;
    border-radius: 50%; background: var(--surface); border: 1px solid var(--grid); display: flex; align-items: center; justify-content: center;
    z-index: 60; opacity: 0; transform: translateY(-54px); box-shadow: 0 6px 18px rgba(24,40,28,.18); pointer-events: none; }
  #ptr i { display: block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(47,107,62,.25); border-top-color: var(--accent); }
  #ptr.spin i { animation: spin .6s linear infinite; }
  #app { will-change: transform; }
</style>
</head>
<body>
<div id="ptr"><i></i></div>
<div class="wrap">
  <header>
    <div class="hgroup">
      <h1 id="appTitle" title="長押しで管理（パスワード変更）">棚卸ダッシュボード</h1>
      <span class="updated" id="updatedAt"></span>
    </div>
    <span class="spacer"></span>
    <button id="btnReload" class="small">🔄 最新に更新</button>
  </header>

  <div id="loading"><div class="spin"></div><div>読み込み中…</div></div>

  <!-- ログイン画面（合言葉が設定されている場合のみ表示）-->
  <div id="loginView" style="display:none; max-width:360px; margin:60px auto; text-align:center">
    <div style="font-size:40px; margin-bottom:8px">🔒</div>
    <h2 style="font-size:18px; margin-bottom:6px">棚卸ダッシュボード</h2>
    <p style="color:var(--ink-2); font-size:13px; margin-bottom:16px">閲覧用パスワードを入力してください</p>
    <input type="password" id="loginPass" placeholder="パスワード"
      style="font:inherit; width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); text-align:center; margin-bottom:10px">
    <button class="primary" id="btnLogin" style="width:100%; padding:10px">ログイン</button>
    <div class="msg" id="loginMsg" style="margin-top:8px"></div>
  </div>

  <div id="app" style="display:none">
    <!-- 一覧: F/D/FD 切替（最上部） -->
    <div class="filters" id="listModeBar">
      <div class="seg" id="fdSeg">
        <button data-mode="F">フード</button>
        <button data-mode="D">ドリンク</button>
        <button data-mode="FD" class="on">FD合算</button>
      </div>
    </div>
    <!-- 店舗: 店舗ナビ（枠外・最上部） -->
    <div class="filters" id="storeNavBar" style="display:none">
      <button id="btnBack" class="small">← 店舗一覧</button>
      <select id="storeSel" style="flex:1; min-width:0"></select>
    </div>

    <!-- ═══ 一覧画面 ═══ -->
    <div id="listView">
      <div class="ctrl-card">
        <div class="filters">
          <label class="grp">対象月</label>
          <button class="small" id="mPrev">◀</button>
          <select id="monthSel"></select>
          <button class="small" id="mNext">▶</button>
          <span class="kind-badge" id="kindBadge" style="display:none">中間データ含む</span>
        </div>
        <div class="filters">
          <label class="grp">表示</label>
          <div class="seg seg-sm" id="pctSeg" title="クレジット手数料2%を理論原価に乗せるかの表示切替">
            <button data-p="incl" class="on">2%込み</button>
            <button data-p="excl">2%なし</button>
          </div>
          <button class="small" id="btnPctSetup" title="店舗ごとの2%込み済み設定">⚙ 2%設定</button>
        </div>
        <div class="filters" style="margin-bottom:0">
          <label class="grp">取込</label>
          <button class="primary small" id="btnFwAll">⟳ FW</button>
          <button class="primary small" id="btnImAll">⟳ インフォマート</button>
        </div>
      </div>

      <div class="card" id="summaryCard"></div>

      <div class="card hero-card">
        <div class="hero" id="heroList"></div>
      </div>

      <div class="card">
        <div class="filters" style="margin-bottom:8px">
          <div class="seg seg-sm" id="metricSeg">
            <button data-m="inv" class="on">棚卸</button>
            <button data-m="cost">原価・ロス</button>
          </div>
        </div>
        <div class="filters" style="margin-bottom:10px">
          <label>並べ替え</label>
          <select id="sortSel"></select>
          <span class="spacer"></span>
          <div class="seg seg-sm" id="sortDirSeg">
            <button data-dir="desc" class="on">降順</button>
            <button data-dir="asc">昇順</button>
          </div>
        </div>
        <div id="storeList"></div>
      </div>
    </div>

    <!-- ═══ 店舗画面 ═══ -->
    <div id="storeView" style="display:none">
      <div class="ctrl-card">
        <div class="filters">
          <label class="grp">表示</label>
          <div class="seg seg-sm" id="wideSeg" title="全表示は横スクロールでF/Dを同時に見られます">
            <button data-w="0">項目表示</button>
            <button data-w="1" class="on">全表示（横スクロール）</button>
          </div>
        </div>
        <div class="filters" id="storeModeRow" style="margin-bottom:0">
          <label class="grp">内訳</label>
          <div class="seg seg-sm" id="compactSeg">
            <button data-cv="FD" class="on">FD合計</button>
            <button data-cv="split">F・D</button>
          </div>
        </div>
      </div>

      <div class="card hero-card">
        <div class="hero" id="heroStore"></div>
      </div>
      <div id="monthBlocks"></div>
    </div>

    <!-- ═══ ランキング画面（別タブ）═══ -->
    <div id="highlightView" style="display:none">
      <div class="ctrl-card">
        <div class="filters" style="margin-bottom:0">
          <label class="grp">対象月</label>
          <button class="small" id="mPrev2">◀</button>
          <select id="monthSel2"></select>
          <button class="small" id="mNext2">▶</button>
        </div>
      </div>
      <div class="card" id="moveCard"></div>
      <div class="card" id="rankTurn"></div>
      <div class="card" id="rankLoss"></div>
    </div>

    <!-- ═══ 原価判定（別タブ）═══ -->
    <div id="costView" style="display:none">
      <div class="ctrl-card">
        <div class="filters" style="margin-bottom:0">
          <label class="grp">対象月</label>
          <button class="small" id="mPrev4">◀</button>
          <select id="monthSel4"></select>
          <button class="small" id="mNext4">▶</button>
        </div>
      </div>
      <div class="card" id="costJudge"></div>
    </div>

    <!-- ═══ ロス未入力（別タブ）═══ -->
    <div id="pendingView" style="display:none">
      <div class="ctrl-card">
        <div class="filters" style="margin-bottom:0">
          <label class="grp">対象月</label>
          <button class="small" id="mPrev3">◀</button>
          <select id="monthSel3"></select>
          <button class="small" id="mNext3">▶</button>
        </div>
      </div>
      <div class="card" id="stockPendingCard"></div>
      <div class="card" id="pendingCard"></div>
    </div>
  </div>

  <!-- 下タブバー -->
  <nav class="tabbar" id="tabbar" style="display:none">
    <button data-tab="list" class="on"><span class="ic">📋</span><span>一覧</span></button>
    <button data-tab="highlight"><span class="ic">🏅</span><span>ランキング</span></button>
    <button data-tab="cost"><span class="ic">🏷</span><span>原価判定</span></button>
    <button data-tab="pending"><span class="ic">📝</span><span>未入力</span></button>
  </nav>
</div>

<!-- 取込確認モーダル -->
<div class="overlay" id="fetchOverlay">
  <div class="modal">
    <h3 id="fetchTitle"></h3>
    <p id="fetchDesc"></p>
    <div style="margin:10px 0">
      <label style="display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px">実行パスワード</label>
      <input type="password" id="fetchPass" placeholder="パスワード" autocomplete="off"
        style="font:inherit;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)">
    </div>
    <div class="actions">
      <button id="btnFetchCancel">閉じる</button>
      <button class="primary" id="btnFetchRun">実行</button>
    </div>
    <div class="msg" id="fetchMsg" style="margin-top:8px"></div>
    <details id="tokenSetup">
      <summary>初期設定（管理者用・トークン登録）</summary>
      <div style="margin-top:8px">
        <input type="password" id="tokenInput" placeholder="github_pat_...">
        <div class="actions" style="margin-top:8px"><button id="btnSaveToken" class="small">トークンを保存</button></div>
      </div>
    </details>
  </div>
</div>

<!-- 2%設定モーダル -->
<div class="overlay" id="pctOverlay">
  <div class="modal">
    <h3>⚙ 理論原価2%（クレジット手数料）の設定</h3>
    <p>会社ルールとして、理論原価には売上の2%（フード・ドリンクそれぞれ）を乗せます。<br>

<script>
(function () {
  'use strict';

  var DATA = null;
  var view = 'list';          // 'list' | 'store'
  var fdMode = 'FD';          // 'F' | 'D' | 'FD'
  var storeWide = true;       // 店舗画面: false=かんたん表示 / true=全表示(横スクロール)【デフォルト】
  var compactView = 'FD';     // かんたん表示の内訳: 'FD'=FD合計3列 / 'split'=F・D5列
  var pct2View = 'incl';      // 'incl'=2%込み表示 | 'excl'=2%なし表示
  var curMonth = '';
  var curStore = '';
  var sortKey = 'turnover';
  var sortAsc = false;   // false=降順（多い順）/ true=昇順（少ない順）
  var sortAsc = false;
  var openForm = null;        // {ym, kind} 入力フォームを開いている場所
  var expandedLoss = null;    // {ym, kind} 内訳を開いているロス行
  var PASS = '';              // 閲覧パスワード（localStorageに保存）
  try { PASS = localStorage.getItem('dashPass') || ''; } catch (e) {}
  // URLに ?p=パスコード が付いていれば（サーバ側で照合済み）自動ログインに使う。
  // iOSのホーム画面アプリ（GAS iframe内）ではlocalStorageが保持されないため、
  // この方法だと保存に依存せず毎回自動ログインでき「入りっぱなし」になる。
  var AUTO_PASS = '<?= AUTO_PASS ?>';
  if (AUTO_PASS) {
    PASS = AUTO_PASS;
    try { localStorage.setItem('dashPass', AUTO_PASS); } catch (e) {}
  }

  // ── 書式 ─────────────────────────────────────────────
  function yen(v) { return '¥' + Math.round(v).toLocaleString('ja-JP'); }
  function yenCompact(v) {
    if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2) + '億円';
    if (Math.abs(v) >= 1e4) return Math.round(v / 1e4).toLocaleString('ja-JP') + '万円';
    return yen(v);
  }
  function pct(v) { return (v * 100).toFixed(1) + '%'; }
  function days1(v) { return v.toFixed(1); }
  // 桁数が多い数字を枠内に自動縮小（はみ出し防止）
  function fitNum(el, minPx) {
    el.style.fontSize = '';
    var size = parseFloat(getComputedStyle(el).fontSize) || 14, g = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && size > (minPx || 10) && g++ < 16) {
      size -= 0.5; el.style.fontSize = size + 'px';
    }
  }
  function fitAll() {
    document.querySelectorAll('.mini .mv, .mini .mr, .rank-val, .calc-grp .f-total, .items.compact td.num, .items.compact td.rate, .items.c5 td.num, .items.c5 td.rate')
      .forEach(function (e) { fitNum(e, 9); });
  }
  function daysInMonth(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    return new Date(y, m, 0).getDate();
  }
  function calPrevYm(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
    if (m === 0) { m = 12; y--; }
    return y + '-' + ('0' + m).slice(-2);
  }
  function modeLabel() { return fdMode === 'F' ? 'フード' : fdMode === 'D' ? 'ドリンク' : 'FD合算'; }

  // ── 集計（mode = 'F' | 'D' | 'FD'）─────────────────────
  function invOfM(ym, storeKey, mode) {
    var inv = (DATA.inventory[ym] || {})[storeKey];
    if (!inv) return null;
    // 棚卸金額の合計が0は「未入力」扱い（中間棚の0など）→ データなし(null)とする
    if (((inv.food || 0) + (inv.drink || 0)) === 0) return null;
    return mode === 'F' ? inv.food : mode === 'D' ? inv.drink : inv.food + inv.drink;
  }
  function lossesOfM(ym, storeKey, mode) {
    var all = ((DATA.losses[ym] || {})[storeKey]) || [];
    if (mode === 'FD') return all;
    var cat = mode === 'F' ? 'フード' : 'ドリンク';
    return all.filter(function (l) { return l.cat === cat; });
  }
  function calcM(storeKey, ym, mode) {
    var m = (DATA.metrics[ym] || {})[storeKey];
    var invCur = invOfM(ym, storeKey, mode);
    if (!m && invCur === null) return null;
    m = m || {};
    var d = daysInMonth(ym);
    var sales = m.sales || 0;
    var purchase = mode === 'F' ? (m.foodPurchase || 0) : mode === 'D' ? (m.drinkPurchase || 0)
                 : (m.foodPurchase || 0) + (m.drinkPurchase || 0);
    var theory = mode === 'F' ? (m.foodTheory || 0) : mode === 'D' ? (m.drinkTheory || 0)
               : (m.foodTheory || 0) + (m.drinkTheory || 0);
    // クレジット手数料2%: 理論原価に F売上×2% / D売上×2% を乗せる会社ルール。
    // storeFlags[店舗]=true は「FWの理論原価に2%込み済み」。表示切替に合わせて加減算する。
    var fs = m.foodSales || 0, ds = m.drinkSales || 0;
    var pct2 = mode === 'F' ? fs * 0.02 : mode === 'D' ? ds * 0.02 : (fs + ds) * 0.02;
    var inc2 = !!((DATA.storeFlags || {})[storeKey]);
    if (pct2View === 'incl' && !inc2) theory += pct2;
    else if (pct2View === 'excl' && inc2) theory -= pct2;
    var invPrev = invOfM(calPrevYm(ym), storeKey, mode);
    var ls = lossesOfM(ym, storeKey, mode);
    var need = 0, waste = 0, theoryAdj = 0;
    ls.forEach(function (l) {
      if (l.kind === '必要ロス') need += l.amount;
      else if (l.kind === '廃棄ロス') waste += l.amount;
      else if (l.kind === '理論原価') theoryAdj += l.amount;   // 手動で追加した理論原価（理由つき）
    });
    theory += theoryAdj;   // FW理論原価 ＋ 手動追加分
    var actual = (invPrev !== null && invCur !== null) ? invPrev + purchase - invCur : null;
    var unknown = actual !== null ? actual - theory - need - waste : null;
    // 在庫回転日数 = 棚卸金額 ÷ 1日理論原価。
    // 中間(1〜15日)は理論原価が半月分なので、割る日数も実期間の15日にする（丸1か月で割ると約2倍に出るため）。
    var theoryDays = (m.kind === '中間') ? 15 : d;
    var turnover = (invCur !== null && theory > 0) ? invCur / (theory / theoryDays) : null;
    // 予算原価（FWの店長会資料の計画原価金額）から予算比を算出: 予算原価 ÷ 実績売上。
    // F/D/FD合算 それぞれ。売上0・予算未取得は null。
    var budF = Number(m.budgetFoodCost) || 0, budD = Number(m.budgetDrinkCost) || 0;
    var budgetCost = mode === 'F' ? budF : mode === 'D' ? budD : (budF + budD);
    var budgetRate = (sales && budgetCost > 0) ? budgetCost / sales : null;
    return {
      ym: ym, days: d, kind: m.kind || '',
      sales: sales, purchase: purchase, theory: theory,
      invPrev: invPrev, invCur: invCur,
      actual: actual, need: need, waste: waste, unknown: unknown,
      theoryAdj: theoryAdj,
      losses: ls, turnover: turnover,
      purchaseRate: sales ? purchase / sales : null,
      actualRate: (sales && actual !== null) ? actual / sales : null,
      theoryRate: sales ? theory / sales : null,
      unknownRate: (sales && unknown !== null) ? unknown / sales : null,
      budgetRate: budgetRate,
    };
  }
  function calc(storeKey, ym) { return calcM(storeKey, ym, fdMode); }
  function totalsOf(ym) {
    var t = { sales: 0, purchase: 0, theory: 0, inv: 0, hasInv: false, interim: false,
              need: 0, waste: 0, unknown: null, days: daysInMonth(ym) };
    DATA.stores.forEach(function (s) {
      var r = calc(s.key, ym);
      if (!r) return;
      t.sales += r.sales; t.purchase += r.purchase; t.theory += r.theory;
      t.need += r.need; t.waste += r.waste;
      if (r.unknown !== null) t.unknown = (t.unknown || 0) + r.unknown;
      if (r.invCur !== null) { t.inv += r.invCur; t.hasInv = true; }
      if (r.kind === '中間') t.interim = true;
    });
    t.turnover = (t.hasInv && t.theory > 0) ? t.inv / (t.theory / t.days) : null;
    return t;
  }
  // 初期表示は「一番直近の月末棚（確定）」。当月が中間だけのときは、その手前の確定月を選ぶ。
  function defaultMonth() {
    var ms = (DATA && DATA.months) || [];
    for (var i = ms.length - 1; i >= 0; i--) {
      if (!totalsOf(ms[i]).interim) return ms[i];   // 中間を含まない＝月末棚（確定）
    }
    return ms[ms.length - 1] || '';                 // 全て中間ならフォールバックで最新月
  }

  // ── ヒーロー（在庫回転日数）──────────────────────────
  function renderHero(el, turnover, inv, theory, d, sub, modeLbl) {
    el.textContent = '';
    var lbl = document.createElement('div'); lbl.className = 'hlabel';
    lbl.textContent = '在庫回転日数（' + (modeLbl || modeLabel()) + '）— 何日分の在庫を抱えているか';
    var big = document.createElement('div'); big.className = 'big';
    if (turnover === null) {
      big.textContent = '—';
    } else {
      big.textContent = days1(turnover);
      var sm = document.createElement('small'); sm.textContent = ' 日分';
      big.appendChild(sm);
    }
    var s = document.createElement('div'); s.className = 'sub';
    s.textContent = turnover === null
      ? '計算に必要なデータ（棚卸高・理論原価）が未取得です'
      : sub + '： 棚卸高 ' + yenCompact(inv) + ' ÷ 1日理論原価 ' + yenCompact(theory / d);
    el.appendChild(lbl); el.appendChild(big); el.appendChild(s);
  }

  // ── 一覧画面 ─────────────────────────────────────────
  var listMetric = 'inv';   // 'inv'=棚卸 | 'cost'=原価・ロス
  var rankMetric = 'turnover';   // ランキングの指標
  // 原価・ロスは金額でなく売上比（率）で並べ替える
  var SORTS = {
    inv: [
      { k: 'turnover', t: '在庫回転日数' },
      { k: 'invCur',   t: '当月棚卸金額' },
      { k: 'name',     t: '店舗名' },
    ],
    cost: [
      { k: 'unknownRate', t: '不明ロス（売上比）' },
      { k: 'actualRate',  t: '実使用（売上比）' },
      { k: 'theoryRate',  t: '理論原価（売上比）' },
      { k: 'name',        t: '店舗名' },
    ],
  };

  function refreshSortOptions() {
    var sel = document.getElementById('sortSel');
    sel.textContent = '';
    SORTS[listMetric].forEach(function (o) {
      var op = document.createElement('option'); op.value = o.k; op.textContent = o.t;
      sel.appendChild(op);
    });
    if (!SORTS[listMetric].some(function (o) { return o.k === sortKey; })) {
      sortKey = SORTS[listMetric][0].k;
    }
    sel.value = sortKey;
  }

  function mini(label, valText, subText, opts) {
    opts = opts || {};
    var d = document.createElement('div'); d.className = 'mini';
    var l = document.createElement('div'); l.className = 'ml'; l.textContent = label;
    var v = document.createElement('div');
    v.className = 'mv' + (opts.big ? ' big' : '') + (opts.muted ? ' muted' : '');
    if (opts.cls) v.classList.add(opts.cls);
    v.textContent = valText;
    d.appendChild(l); d.appendChild(v);
    if (subText) {
      var rt = document.createElement('div'); rt.className = 'mr' + (opts.subCls ? ' ' + opts.subCls : '');
      rt.textContent = subText;
      d.appendChild(rt);
    }
    return d;
  }

  // ── 楽しく見るための部品（スパークライン・信号・前月比・ハイライト・ランキング）──
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sparkline(vals, opts) {
    opts = opts || {};
    var w = opts.w || 100, h = opts.h || 26, pad = 3;
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('width', w); svg.setAttribute('height', h);
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    svg.setAttribute('class', 'spark'); svg.setAttribute('aria-hidden', 'true');
    var pts = [];
    for (var i = 0; i < vals.length; i++) if (vals[i] !== null && isFinite(vals[i])) pts.push({ i: i, v: vals[i] });
    if (pts.length < 2) return svg;
    var n = vals.length - 1;
    var mn = pts[0].v, mx = pts[0].v;
    pts.forEach(function (p) { if (p.v < mn) mn = p.v; if (p.v > mx) mx = p.v; });
    var rng = (mx - mn) || 1;
    function X(i) { return pad + (w - 2 * pad) * (n ? i / n : 0); }
    function Y(v) { return h - pad - (h - 2 * pad) * ((v - mn) / rng); }
    var d = pts.map(function (p, k) { return (k ? 'L' : 'M') + X(p.i).toFixed(1) + ' ' + Y(p.v).toFixed(1); }).join(' ');
    var color = opts.color || 'var(--accent)';
    var path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', d); path.setAttribute('fill', 'none'); path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', opts.sw || '2'); path.setAttribute('stroke-linecap', 'round'); path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    var last = pts[pts.length - 1];
    var c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', X(last.i).toFixed(1)); c.setAttribute('cy', Y(last.v).toFixed(1));
    c.setAttribute('r', opts.r || '2.6'); c.setAttribute('fill', color);
    svg.appendChild(c);
    return svg;
  }
  function seriesFor(storeKey, pick) {
    return DATA.months.map(function (ym) { var r = calcM(storeKey, ym, fdMode); return r ? pick(r) : null; });
  }
  function lossSignal(r) {
    if (!r || r.unknown === null || r.unknownRate === null) return { emoji: '⚪', label: 'データ待ち', cls: '' };
    // 不明ロス率の絶対値で判定: ±1%以下=良好 / 1〜2%=注意 / 2%超=要確認
    var p = Math.abs(r.unknownRate) * 100;
    if (p <= 1) return { emoji: '🟢', label: '良好', cls: 'sig-good' };
    if (p <= 2) return { emoji: '🟡', label: '注意', cls: 'sig-warn' };
    return { emoji: '🔴', label: '要確認', cls: 'sig-bad' };
  }
  // 在庫回転日数の判定: 9日以内=良好 / 10〜14日=注意 / 15日〜=要確認（当月棚卸金額も同基準）
  function turnSignal(turnover) {
    if (turnover === null || turnover === undefined) return { emoji: '⚪', label: 'データ待ち', cls: '' };
    if (turnover <= 9) return { emoji: '🟢', label: '良好', cls: 'sig-good' };
    if (turnover < 15) return { emoji: '🟡', label: '注意', cls: 'sig-warn' };
    return { emoji: '🔴', label: '要確認', cls: 'sig-bad' };
  }
  function momUnknownChip(storeKey) {
    var cur = calcM(storeKey, curMonth, fdMode);
    var prev = calcM(storeKey, calPrevYm(curMonth), fdMode);
    if (!cur || !prev || cur.unknownRate === null || prev.unknownRate === null) return null;
    var d = (cur.unknownRate - prev.unknownRate) * 100;   // 前月比（ポイント）
    var span = document.createElement('span');
    if (Math.abs(d) < 0.05) { span.className = 'mom flat'; span.textContent = '→ 前月比 ±0'; }
    else if (d < 0) { span.className = 'mom down'; span.textContent = '▼ ' + Math.abs(d).toFixed(1) + 'pt 改善'; }
    else { span.className = 'mom up'; span.textContent = '▲ ' + d.toFixed(1) + 'pt 悪化'; }
    return span;
  }

  // 順位なしのランキング行（店名＋数値、タップで店舗へ）
  function rankRow(name, valText, key, cls, sig) {
    var row = document.createElement('div'); row.className = 'rank-row';
    var nm = document.createElement('div'); nm.className = 'rank-name'; nm.textContent = name;
    row.appendChild(nm);
    if (sig) { var s = document.createElement('span'); s.className = 'sig ' + sig.cls; s.textContent = sig.emoji + ' ' + sig.label; row.appendChild(s); }
    var val = document.createElement('div'); val.className = 'rank-val' + (cls ? ' ' + cls : ''); val.textContent = valText;
    row.appendChild(val);
    row.onclick = function () { openStore(key); };
    return row;
  }

  var RANK_TOP = 5;
  var turnAsc = true, turnOpen = false, lossOpen = false, lossAsc = true;
  // 上位RANK_TOP件だけ表示し、多ければ「すべて表示／閉じる」ボタンを付ける
  function appendRankRows(card, list, makeRow, open, onToggle) {
    (open ? list : list.slice(0, RANK_TOP)).forEach(function (r) { card.appendChild(makeRow(r)); });
    if (list.length > RANK_TOP) {
      var wrap = document.createElement('div'); wrap.style.cssText = 'text-align:center;margin-top:8px';
      var btn = document.createElement('button'); btn.className = 'small';
      btn.textContent = open ? '▲ 上位だけ表示' : ('▼ すべて表示（' + list.length + '店舗）');
      btn.onclick = onToggle;
      wrap.appendChild(btn); card.appendChild(wrap);
    }
  }
  function renderTurnRank(rows) {
    var card = document.getElementById('rankTurn');
    card.textContent = '';
    var h = document.createElement('div'); h.className = 'cardh';
    var title = document.createElement('span'); title.textContent = '📦 在庫回転日数ランキング'; h.appendChild(title);
    var sp = document.createElement('span'); sp.className = 'spacer'; h.appendChild(sp);
    var seg = document.createElement('div'); seg.className = 'seg seg-sm';
    [['low', '低い順'], ['high', '高い順']].forEach(function (o) {
      var b = document.createElement('button'); b.textContent = o[1];
      if ((o[0] === 'low') === turnAsc) b.className = 'on';
      b.onclick = function () { turnAsc = (o[0] === 'low'); renderTurnRank(rows); };
      seg.appendChild(b);
    });
    h.appendChild(seg); card.appendChild(h);
    var cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:var(--muted);margin:-4px 0 8px';
    cap.textContent = '信号は 9日以内=🟢良好 / 10〜14日=🟡注意 / 15日〜=🔴要確認。';
    card.appendChild(cap);

    var list = rows.filter(function (r) { return r.turnover !== null && r.invCur > 0; }).slice()
      .sort(function (a, b) { return turnAsc ? a.turnover - b.turnover : b.turnover - a.turnover; });
    if (!list.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'データがありません'; card.appendChild(e); return; }
    appendRankRows(card, list, function (r) { return rankRow(r.name, days1(r.turnover) + '日', r.key, null, turnSignal(r.turnover)); },
      turnOpen, function () { turnOpen = !turnOpen; renderTurnRank(rows); });
  }

  function renderLossRank(rows) {
    var card = document.getElementById('rankLoss');
    card.textContent = '';
    var h = document.createElement('div'); h.className = 'cardh';
    var title = document.createElement('span'); title.textContent = '🎯 不明ロスランキング'; h.appendChild(title);
    var sp = document.createElement('span'); sp.className = 'spacer'; h.appendChild(sp);
    var seg = document.createElement('div'); seg.className = 'seg seg-sm';
    // 優秀順=0%に近い順 / 要改善順=0%から遠い順
    [['good', '優秀順'], ['bad', '要改善順']].forEach(function (o) {
      var b = document.createElement('button'); b.textContent = o[1];
      if ((o[0] === 'good') === lossAsc) b.className = 'on';
      b.onclick = function () { lossAsc = (o[0] === 'good'); renderLossRank(rows); };
      seg.appendChild(b);
    });
    h.appendChild(seg); card.appendChild(h);
    var cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:var(--muted);margin:-4px 0 8px';
    cap.textContent = lossAsc
      ? '0%に近いほど上位（優秀順）。信号は ±1%以下=🟢良好 / 〜2%=🟡注意 / 2%超=🔴要確認。'
      : '0%から遠いほど上位（要改善順）。信号は ±1%以下=🟢良好 / 〜2%=🟡注意 / 2%超=🔴要確認。';
    card.appendChild(cap);

    var list = rows.filter(function (r) { return r.unknownRate !== null; }).slice()
      .sort(function (a, b) {
        var da = Math.abs(a.unknownRate), db = Math.abs(b.unknownRate);
        if (da !== db) return lossAsc ? da - db : db - da;   // 優秀順=近い順 / 要改善順=遠い順
        return a.unknownRate - b.unknownRate;                 // 同じ差なら − が上位
      });
    if (!list.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'データがありません'; card.appendChild(e); return; }
    appendRankRows(card, list, function (r) {
      var sg = lossSignal(r);
      var cls = r.unknown === null ? '' : (r.unknown > 0 ? 'pos' : 'neg');
      var row = document.createElement('div'); row.className = 'rank-row';
      var nm = document.createElement('div'); nm.className = 'rank-name'; nm.textContent = r.name;
      var sig = document.createElement('span'); sig.className = 'sig ' + sg.cls; sig.textContent = sg.emoji + ' ' + sg.label;
      var val = document.createElement('div'); val.className = 'rank-val' + (cls ? ' ' + cls : ''); val.textContent = pct(r.unknownRate);
      row.appendChild(nm); row.appendChild(sig); row.appendChild(val);
      row.onclick = function () { openStore(r.key); };
      return row;
    }, lossOpen, function () { lossOpen = !lossOpen; renderLossRank(rows); });
  }

  // 棚卸（金額）未入力の店舗 ＋ 締切管理（対象月の翌月3日＝期日／3日〜アラート／5日＝最終期日）
  function calNextYm(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) + 1;
    if (m === 13) { m = 1; y++; }
    return { y: y, m: m };
  }
  function renderStockPending() {
    var card = document.getElementById('stockPendingCard');
    card.textContent = '';
    var today = new Date(); today.setHours(0, 0, 0, 0);
    // 当月＝中間棚（当月18日=期日／20日=最終）、過去月＝確定・月末棚（翌月3日=期日／5日=最終）
    var cy = +curMonth.slice(0, 4), cmo = +curMonth.slice(5, 7);
    var isCurrentMonth = (today.getFullYear() === cy && (today.getMonth() + 1) === cmo);
    var due, finalD, kindLabel;
    if (isCurrentMonth) {
      due = new Date(cy, cmo - 1, 18); finalD = new Date(cy, cmo - 1, 20); kindLabel = '中間棚';
    } else {
      var nx = calNextYm(curMonth);
      due = new Date(nx.y, nx.m - 1, 3); finalD = new Date(nx.y, nx.m - 1, 5); kindLabel = '月末棚';
    }
    var status = today < due ? 'before' : (today < finalD ? 'alert' : 'over');
    var sc = status === 'before' ? { emoji: '⏳', label: '期日前', cls: '' }
           : status === 'alert' ? { emoji: '🟡', label: '期日超過', cls: 'sig-warn' }
           : { emoji: '🔴', label: '最終期日超過', cls: 'sig-bad' };
    function md(dt) { return (dt.getMonth() + 1) + '/' + dt.getDate(); }

    // 棚卸未入力 = その月に売上があるのに棚卸金額が無い店舗
    var pending = DATA.stores.filter(function (s) {
      var m = (DATA.metrics[curMonth] || {})[s.key];
      var hasSales = m && (m.sales || 0) > 0;
      // 棚卸金額の合計が0（中間棚の0など）は未入力扱い
      var iv = (DATA.inventory[curMonth] || {})[s.key];
      var hasInv = !!iv && (((iv.food || 0) + (iv.drink || 0)) > 0);
      return hasSales && !hasInv;
    });

    var h = document.createElement('div'); h.className = 'cardh';
    h.textContent = '📦 棚卸未入力の店舗（' + curMonth + '・' + kindLabel + '・' + pending.length + '店舗）';
    card.appendChild(h);
    var cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:var(--muted);margin:-4px 0 8px';
    cap.textContent = kindLabel + '：期日 ' + md(due) + '（' + md(due) + '〜アラート）／最終期日 ' + md(finalD)
      + '。棚卸金額が未入力の店舗です。';
    card.appendChild(cap);

    if (!pending.length) {
      var ok = document.createElement('div'); ok.className = 'empty';
      ok.textContent = '全店舗が棚卸入力済みです ✅';
      card.appendChild(ok); return;
    }
    // 締切状態バナー（期日超過・最終期日超過は目立たせる）
    if (status !== 'before') {
      var ban = document.createElement('div'); ban.className = 'sig ' + sc.cls;
      ban.style.cssText = 'display:flex;margin:0 0 8px;padding:6px 10px;font-size:12px;font-weight:700';
      ban.textContent = sc.emoji + ' ' + (status === 'over' ? '最終期日（' + md(finalD) + '）を過ぎています' : '期日（' + md(due) + '）を過ぎています。最終期日 ' + md(finalD));
      card.appendChild(ban);
    }
    pending.forEach(function (s) {
      var row = document.createElement('div'); row.className = 'pend-row';
      var info = document.createElement('div'); info.className = 'pend-info';
      var nm = document.createElement('div'); nm.className = 'pend-name'; nm.textContent = s.name;
      var sub = document.createElement('div'); sub.className = 'pend-sub'; sub.textContent = '棚卸金額 未入力';
      info.appendChild(nm); info.appendChild(sub);
      var sig = document.createElement('span'); sig.className = 'sig ' + sc.cls; sig.textContent = sc.emoji + ' ' + sc.label;
      row.appendChild(info); row.appendChild(sig);
      card.appendChild(row);
    });
  }

  // ロス未入力の店舗（必要ロス・廃棄ロスの登録が0件）。月選択・その場で入力できる
  var pendingOpen = true;   // 既定で全店舗を展開表示
  function renderPending() {

      var btn = document.createElement('button'); btn.className = 'small btn-input'; btn.textContent = '✏ 入力';

      card.appendChild(row);
    });
    if (pending.length > RANK_TOP) {
      var wrap = document.createElement('div'); wrap.style.cssText = 'text-align:center;margin-top:8px';
      var tb = document.createElement('button'); tb.className = 'small';
      tb.textContent = pendingOpen ? '▲ 一部だけ表示' : ('▼ すべて表示（' + pending.length + '店舗）');
      tb.onclick = function () { pendingOpen = !pendingOpen; renderPending(); };
      wrap.appendChild(tb); card.appendChild(wrap);
    }
  }

  // 原価判定（仕入れ値ベース）: まず「仕入率 > 予算比」かで問題有無を判定し、原因で切り分ける。
  //  ok   … 仕入率 ≤ 予算比                     → 良好（仕入れが予算内）
  //  dev  … 仕入オーバー かつ 理論原価率 > 予算比 → レシピ自体が予算超過（商品開発部の是正）
  //  store… 仕入オーバー だが 理論はOK           → 仕入れ超過・ロス・理論原価見直し（店舗の仕入れコントロール）
  //  ※ 予算(F予算/D予算)は仕入予算なので、実績も仕入（F食材費仕入/D飲料費仕入）で比較する。
  function costJudge(r) {
    if (!r || r.budgetRate === null || r.purchaseRate === null) return null;
    var EPS = 0.0005;   // 0.05pt 未満の差は「同値」扱い（丸め・2%手数料の端数対策）
    if (r.purchaseRate <= r.budgetRate + EPS) return 'ok';        // 仕入れが予算内
    if (r.theoryRate !== null && r.theoryRate > r.budgetRate + EPS) return 'dev';  // 理論も予算オーバー
    return 'store';                                               // 理論はOKなのに仕入オーバー
  }
  function renderCostJudge(rows) {
    var card = document.getElementById('costJudge');
    card.textContent = '';
    var h = document.createElement('div'); h.className = 'cardh';
    h.textContent = '🏷 原価判定（予算比・' + modeLabel() + '）';
    card.appendChild(h);

    var judged = rows.map(function (r) { return { r: r, j: costJudge(r) }; });
    if (!judged.some(function (x) { return x.j !== null; })) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = '予算が未取得です。FW取込（店長会資料）でF予算・D予算を取り込むと表示されます。';
      card.appendChild(e); return;
    }
    var cap = document.createElement('div');
    cap.style.cssText = 'font-size:11px;color:var(--muted);margin:-4px 0 8px';
    cap.textContent = '予算比と 理論原価率／仕入率（仕入れ値ベース）を比較して原因を切り分けます（' + modeLabel() + '）。';
    card.appendChild(cap);

    // 予算比との差（pt）を「ラベル：±X.Xpt」の1行にする。オーバー=赤／以内=緑
    function diffLine(label, ptVal) {
      var line = document.createElement('div'); line.className = 'cj-diff';
      var lbl = document.createElement('span'); lbl.className = 'cj-dlbl'; lbl.textContent = label;
      var val = document.createElement('span');
      if (ptVal === null) { val.textContent = '—'; val.className = 'cj-dlbl'; }
      else {
        val.textContent = (ptVal > 0 ? '+' : '') + ptVal.toFixed(1) + 'pt';
        val.className = ptVal > 0.05 ? 'pos' : 'neg';
      }
      line.appendChild(lbl); line.appendChild(val);
      return line;
    }

    function block(emoji, title, desc, key, cls) {
      var arr = judged.filter(function (x) { return x.j === key; }).map(function (x) { return x.r; });
      arr.sort(function (a, b) {
        var av = key === 'dev' ? a.theoryRate : (a.purchaseRate === null ? 0 : a.purchaseRate);
        var bv = key === 'dev' ? b.theoryRate : (b.purchaseRate === null ? 0 : b.purchaseRate);
        return bv - av;
      });
      var t = document.createElement('div');
      t.style.cssText = 'font-size:12px;font-weight:700;margin:8px 0 1px;color:var(--ink-2)';
      t.textContent = emoji + ' ' + title + '（' + arr.length + '）';
      card.appendChild(t);
      var d = document.createElement('div');
      d.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:3px;white-space:pre-line';
      d.textContent = desc;
      card.appendChild(d);
      if (!arr.length) {
        var em = document.createElement('div'); em.className = 'empty'; em.style.padding = '2px 0';
        em.textContent = '該当なし'; card.appendChild(em); return;
      }
      arr.forEach(function (r) {
        var row = document.createElement('div'); row.className = 'cj-row';
        var info = document.createElement('div'); info.className = 'cj-info';
        var nm = document.createElement('div'); nm.className = 'cj-name'; nm.textContent = r.name;
        var sub = document.createElement('div'); sub.className = 'cj-sub';
        sub.textContent = '予算 ' + pct(r.budgetRate) + ' ／ 理論 ' + pct(r.theoryRate)
          + ' ／ 仕入 ' + (r.purchaseRate === null ? '—' : pct(r.purchaseRate));
        info.appendChild(nm); info.appendChild(sub);
        if (key === 'ok') {
          var gap = document.createElement('div'); gap.className = 'rank-val ' + cls;
          gap.textContent = '達成 ' + ((r.budgetRate - r.purchaseRate) * 100).toFixed(1) + 'pt';
          row.appendChild(info); row.appendChild(gap);
        } else {
          // 仕入れ超過店舗は「理論差（レシピ）」と「仕入差（現場）」を両方表示
          var diffs = document.createElement('div'); diffs.className = 'cj-diffs';
          diffs.appendChild(diffLine('理論差', r.theoryRate === null ? null : (r.theoryRate - r.budgetRate) * 100));
          diffs.appendChild(diffLine('仕入差', r.purchaseRate === null ? null : (r.purchaseRate - r.budgetRate) * 100));
          row.appendChild(info); row.appendChild(diffs);
        }
        row.onclick = (function (k) { return function () { openStore(k); }; })(r.key);
        card.appendChild(row);
      });
    }
    block('🔴', '商品開発部の是正が必要', '仕入・理論とも予算比をオーバー（レシピ自体が予算超過）', 'dev', 'bad');
    block('🟠', '店舗の仕入れコントロール', '理論はOKなのに仕入率が予算比をオーバー。\n仕入れ超過・ロス追及・理論原価見直し', 'store', 'warn');
    block('🟢', '良好', '仕入率が予算比以内', 'ok', 'good');
  }

  // 前月より悪化／改善した店舗（不明ロス率のポイント差）
  function renderMovers(rows) {
    var card = document.getElementById('moveCard');
    card.textContent = '';
    var movers = rows.map(function (r) {
      var prev = calcM(r.key, calPrevYm(curMonth), fdMode);
      if (!prev || prev.unknownRate === null || r.unknownRate === null) return null;
      return { name: r.name, key: r.key, delta: (r.unknownRate - prev.unknownRate) * 100, cur: r.unknownRate, prev: prev.unknownRate };
    }).filter(Boolean);
    var worse = movers.filter(function (m) { return m.delta > 0.05; }).sort(function (a, b) { return b.delta - a.delta; }).slice(0, 5);
    var better = movers.filter(function (m) { return m.delta < -0.05; }).sort(function (a, b) { return a.delta - b.delta; }).slice(0, 5);

    var h = document.createElement('div'); h.className = 'cardh';
    h.textContent = '📊 前月からの変化（不明ロス率）';
    card.appendChild(h);

    function block(titleEmoji, title, arr, cls, sign) {
      var t = document.createElement('div');
      t.style.cssText = 'font-size:12px;font-weight:700;margin:6px 0 2px;color:var(--ink-2)';
      t.textContent = titleEmoji + ' ' + title;
      card.appendChild(t);
      if (!arr.length) {
        var e = document.createElement('div'); e.className = 'empty'; e.style.padding = '2px 0';
        e.textContent = '該当なし';
        card.appendChild(e); return;
      }
      var list = document.createElement('div'); list.className = 'mv-list';
      arr.forEach(function (m) {
        var row = document.createElement('div'); row.className = 'mv-row';
        var nm = document.createElement('div'); nm.className = 'mv-name'; nm.textContent = m.name;
        var sub = document.createElement('div'); sub.className = 'mv-sub';
        sub.textContent = pct(m.prev) + '→' + pct(m.cur);
        var d = document.createElement('div'); d.className = 'mv-d ' + cls;
        d.textContent = sign + Math.abs(m.delta).toFixed(1) + 'pt';
        row.appendChild(nm); row.appendChild(sub); row.appendChild(d);
        row.onclick = (function (key) { return function () { openStore(key); }; })(m.key);
        list.appendChild(row);
      });
      card.appendChild(list);
    }
    block('📉', '悪化（要チェック）', worse, 'pos', '▲ ');
    block('📈', '改善', better, 'neg', '▼ ');
  }

  function computeStoreRows() {
    return DATA.stores.map(function (s) {
      var r = calc(s.key, curMonth);
      if (!r) return null;
      r.name = s.name; r.key = s.key;
      return r;
    }).filter(Boolean);
  }

  // タブへプログラムから移動
  function gotoTab(v) { view = v; renderAll(); window.scrollTo({ top: 0 }); }

  // 今月の要点（全社）: 未入力・原価オーバー・在庫回転要確認・不明ロス要確認の店舗数を集計。
  // タップでそれぞれの該当タブへ飛ぶ。判定はアプリ内の各基準（F/D/FD切替に連動）と同じ。
  function renderSummary() {
    var card = document.getElementById('summaryCard');
    card.textContent = '';
    var rows = computeStoreRows();

    // 棚卸未入力（売上があるのに棚卸金額なし＝0含む）。区分に依らず全体で判定（未入力タブと同じ）。
    var pending = DATA.stores.filter(function (s) {
      var m = (DATA.metrics[curMonth] || {})[s.key];
      var hasSales = m && (m.sales || 0) > 0;
      var iv = (DATA.inventory[curMonth] || {})[s.key];
      var hasInv = !!iv && (((iv.food || 0) + (iv.drink || 0)) > 0);
      return hasSales && !hasInv;
    }).length;

    // 原価オーバー（仕入率>予算比＝原価判定の🔴🟠）。予算未取得なら「—」。
    var judged = rows.map(costJudge).filter(function (j) { return j !== null; });
    var costOver = judged.length ? judged.filter(function (j) { return j === 'dev' || j === 'store'; }).length : null;

    // 在庫回転 要確認（15日以上）
    var turnBad = rows.filter(function (r) { return r.turnover !== null && r.turnover >= 15; }).length;
    // 不明ロス 要確認（絶対値2%超）
    var lossBad = rows.filter(function (r) { return r.unknownRate !== null && Math.abs(r.unknownRate) * 100 > 2; }).length;

    var h = document.createElement('div'); h.className = 'cardh';
    h.textContent = '📋 今月の要点（全社・' + curMonth + '・' + modeLabel() + '）';
    card.appendChild(h);

    var grid = document.createElement('div'); grid.className = 'sum-grid';
    function tile(count, label, tab, kind) {
      var t = document.createElement('div'); t.className = 'sum-tile';
      var isNum = (typeof count === 'number');
      // 件数>0なら警告色（kind=warn/alert）、0なら良好色。数値なしは無色。
      t.classList.add(!isNum ? '' : (count > 0 ? (kind || 'alert') : 'ok'));
      var n = document.createElement('div'); n.className = 'n';
      n.textContent = isNum ? String(count) : '—';
      if (isNum) { var sm = document.createElement('small'); sm.textContent = '店'; n.appendChild(sm); }
      var l = document.createElement('div'); l.className = 'l'; l.textContent = label;
      t.appendChild(n); t.appendChild(l);
      t.onclick = function () { gotoTab(tab); };
      grid.appendChild(t);
    }
    tile(pending, '棚卸 未入力', 'pending', 'alert');
    tile(costOver, '原価オーバー', 'cost', 'alert');
    tile(turnBad, '在庫回転 要確認(15日〜)', 'highlight', 'alert');
    tile(lossBad, '不明ロス 要確認(2%超)', 'highlight', 'alert');
    card.appendChild(grid);
  }

  function renderList() {
    renderSummary();
    var t = totalsOf(curMonth);

    // 全社ロス合計（必要・廃棄・不明 × 売上比）を横3列で表示
    var hb = document.getElementById('heroList');
    hb.textContent = '';
    var lt = document.createElement('div');
    lt.style.cssText = 'font-size:13px;color:var(--ink-2);margin-bottom:8px';
    lt.textContent = 'ロス合計（全社・' + curMonth + '・' + modeLabel() + '）';
    hb.appendChild(lt);
    var w3 = document.createElement('div'); w3.className = 'sr-vals three';

      t.sales ? '売上比 ' + pct(t.need / t.sales) : ''));
    w3.appendChild(mini('廃棄ロス', yen(t.waste),
      t.sales ? '売上比 ' + pct(t.waste / t.sales) : ''));

    var rows = computeStoreRows();
    rows.sort(function (a, b) {
      if (sortKey === 'name') { var c = a.name.localeCompare(b.name, 'ja'); return sortAsc ? c : -c; }
      var x = a[sortKey], y = b[sortKey];
      var xn = (x === null || x === undefined), yn = (y === null || y === undefined);
      if (xn && yn) return 0;
      if (xn) return 1;   // データなしは常に最後
      if (yn) return -1;
      return sortAsc ? (x - y) : (y - x);   // 降順（多い順）/ 昇順（少ない順）
    });

    var box = document.getElementById('storeList');

    rows.forEach(function (r) {

      if (r.kind === '中間') {
        var kb = document.createElement('span'); kb.className = 'kind-badge'; kb.textContent = '中間';

      if ((DATA.storeFlags || {})[r.key]) {
        var pb = document.createElement('span'); pb.className = 'kind-badge'; pb.textContent = '2%込済';
        top.appendChild(pb);
      }
      // 棚卸タブ＝在庫回転日数の信号 / 原価・ロスタブ＝不明ロスの信号
      var sg = listMetric === 'inv' ? turnSignal(r.turnover) : lossSignal(r);
      var sig = document.createElement('span'); sig.className = 'sig ' + sg.cls;
      sig.textContent = sg.emoji + ' ' + sg.label;
      top.appendChild(sig);
      var lbtn = document.createElement('button'); lbtn.className = 'small btn-input'; lbtn.textContent = '✏ ロス入力';
      lbtn.title = curMonth + ' のロスを入力';
      lbtn.onclick = (function (key) {
        return function (ev) { ev.stopPropagation(); openLossModal(key, curMonth); };
      })(r.key);
      top.appendChild(lbtn);
      row.appendChild(top);

      var vals = document.createElement('div');
      if (listMetric === 'inv') {
        var pv = calc(r.key, calPrevYm(curMonth));
        var prevTurn = pv ? pv.turnover : null;
        vals.className = 'sr-vals three';
        vals.appendChild(mini('当月棚卸',
          r.invCur === null ? '— 未取得' : yen(r.invCur),
          r.turnover === null ? '' : '在庫 ' + days1(r.turnover) + '日分',
          { big: true, subCls: 'accent' }));
        vals.appendChild(mini('前月棚卸',
          r.invPrev === null ? '—' : yen(r.invPrev),
          prevTurn === null ? '' : '在庫 ' + days1(prevTurn) + '日分',
          { muted: true }));
        vals.appendChild(mini('不明ロス',
          r.unknown === null ? '—' : yen(r.unknown),
          r.unknownRate !== null ? '売上比 ' + pct(r.unknownRate) : '',
          { cls: r.unknown === null ? '' : (r.unknown > 0 ? 'pos' : 'neg') }));
      } else {
        vals.className = 'sr-vals three';
        vals.appendChild(mini('実使用金額',
          r.actual === null ? '—' : yen(r.actual),
          r.actualRate !== null ? '売上比 ' + pct(r.actualRate) : ''));
        vals.appendChild(mini('理論原価',
          yen(r.theory),
          r.theoryRate !== null ? '売上比 ' + pct(r.theoryRate) : ''));
        vals.appendChild(mini('不明ロス',
          r.unknown === null ? '—' : yen(r.unknown),
          r.unknownRate !== null ? '売上比 ' + pct(r.unknownRate) : '',
          { cls: r.unknown === null ? '' : (r.unknown > 0 ? 'pos' : 'neg') }));

    if (!rows.length) {
      var e = document.createElement('div'); e.className = 'empty';

    fitAll();
