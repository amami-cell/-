<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>棚卸 入力</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ink:#1f2937; --sub:#6b7280; --brand:#2563eb; --red:#dc2626; --ok:#16a34a; --amber:#b45309; --teal:#0e7490; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; font-size:15px; line-height:1.6; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 80px; }
  h1{ font-size:19px; margin:4px 0 2px; }
  .sub{ color:var(--sub); font-size:13px; margin-bottom:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2{ font-size:14px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .muted{ color:var(--sub); font-size:13px; }
  label{ display:block; font-size:12px; color:var(--sub); margin:6px 0 2px; }
  select,input[type=text],input[type=number]{ width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:16px; background:#fff; }
  input.req-on{ border-color:var(--amber); background:#fffdf5; }
  /* 合計/フード/ドリンク 切替 */
  .seg{ display:flex; gap:4px; background:#eef2f7; border-radius:10px; padding:3px; margin:2px 0 10px; }
  .seg button{ flex:1; border:0; background:transparent; border-radius:8px; padding:8px 4px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; }
  .seg button.on{ background:#fff; color:var(--brand); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  /* 棚数値の表（合計/フード/ドリンクを横並び） */
  .sumhead{ display:flex; justify-content:flex-start; align-items:center; gap:6px; margin-bottom:10px; font-size:13px; color:var(--sub); flex-wrap:wrap; }
  .sumhead .sales{ color:var(--ink); font-weight:700; }
  .sumhead .turn{ background:#eef2ff; color:var(--brand); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
  table.items{ width:100%; border-collapse:collapse; table-layout:fixed; min-width:360px; }
  table.items td{ border-bottom:1px solid var(--line); padding:7px 6px; font-size:13px; }
  table.items tr:last-child td{ border-bottom:0; }
  table.items td.lbl{ width:31%; color:var(--sub); white-space:nowrap; }
  table.items td.num{ width:23%; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  table.items tr.head td{ color:var(--sub); font-size:11px; background:#f9fafb; font-weight:600; text-align:right; }
  table.items tr.head td.lbl{ text-align:left; }
  table.items tr.strong td{ font-weight:800; background:#f9fafb; }
  table.items td.indent{ padding-left:1.6em; }
  table.items td.pos{ color:var(--red); }   /* 不明ロス プラス=ロス過大 */
  table.items td.neg{ color:var(--ok); }    /* 不明ロス マイナス=余り */
  #sumtbl.updated{ animation:fl .7s ease; }
  @keyframes fl{ from{ background:#fef9c3; } to{ background:transparent; } }
  /* 入力行 */
  .row{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:#fafafa; }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .rowhead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .btn{ display:inline-block; border:0; border-radius:9px; padding:11px 14px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.primary{ background:var(--ok); color:#fff; width:100%; padding:14px; font-size:16px; box-shadow:0 2px 8px rgba(22,163,74,.28); }
  .btn.ghost{ background:#eef2ff; color:var(--brand); }
  .btn.sm{ padding:6px 10px; font-size:13px; font-weight:600; }
  .btn.del{ background:#fef2f2; color:var(--red); }
  .btn:disabled{ opacity:.55; cursor:default; }
  .item{ display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding:8px 0; gap:8px; }
  .item:last-child{ border-bottom:0; }
  .tag{ display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; background:#eef2ff; color:var(--brand); margin-right:6px; }
  .tag.waste{ background:#fef2f2; color:var(--red); }
  .tag.need{ background:#fff7ed; color:var(--amber); }
  .tag.theory{ background:#ecfeff; color:var(--teal); }
  .amt{ font-variant-numeric:tabular-nums; font-weight:700; }
  .who{ font-size:11px; color:var(--sub); }
  #msg{ margin:10px 0; padding:10px 12px; border-radius:8px; font-size:14px; display:none; }
  #msg.ok{ background:#ecfdf5; color:var(--ok); display:block; }
  #msg.err{ background:#fef2f2; color:var(--red); display:block; }
  .center{ text-align:center; }
  .notice{ font-size:12px; color:var(--amber); background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 10px; margin-top:6px; display:none; }
  .notice.on{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <script>
    var STORE = '<?= STORE ?>';
    var YM = '<?= YM ?>';
    var TOKEN = '<?= TOKEN ?>';
    var STORE_NAME = '<?= STORE_NAME ?>';
    var VALID = '<?= VALID ?>';
  </script>

  <div id="invalid" class="card" style="display:none">
    <h1>リンクが無効です</h1>
    <p class="muted">このリンクは期限切れか、月・店舗が一致していません。最新の月のリンクをご利用いただくか、本部にお問い合わせください。</p>
  </div>

  <div id="app" style="display:none">
    <h1 id="ttl">棚卸 入力</h1>
    <div class="sub" id="ttlsub"></div>

    <!-- 棚数値（即時計算） -->
    <div class="card">
      <h2>📊 この月の棚数値 <span class="muted" id="liveTag" style="font-weight:400"></span></h2>
      <div class="sumhead" id="sumChips"></div>
      <div class="table-wrap" style="overflow-x:auto"><table class="items" id="sumtbl"></table></div>
      <div class="muted" id="kpiNote" style="margin-top:8px;font-size:12px"></div>
    </div>

    <!-- 入力 -->
    <div class="card">
      <div class="rowhead">
        <b>✏ ロス・理論原価を入力</b>
        <button class="btn ghost sm" type="button" onclick="addRow()">＋行を追加</button>
      </div>
      <div class="muted" style="margin-bottom:8px">種別・区分（フード/ドリンク）・金額・内容を入れてください。入力すると上の棚数値が即時に変わります。</div>

      <label>担当者名（入力した人）<span id="nameReq" style="color:var(--red);display:none"> ＊必須</span></label>
      <input id="who" type="text" maxlength="40" placeholder="例: 山田" oninput="onNameInput()">
      <div class="notice" id="nameNotice">理論原価を変更する場合は、担当者名の入力が必要です（誰が変更したか記録します）。</div>

      <div id="rows" style="margin-top:10px"></div>
      <div id="msg"></div>
      <button id="saveBtn" class="btn primary" type="button" onclick="save()">✅ 最終登録する（アプリに反映）</button>
    </div>

    <!-- 登録済み -->
    <div class="card">
      <div class="rowhead"><b id="curTtl">登録済み</b><span class="muted" id="curCount"></span></div>
      <div id="cur" class="muted">読み込み中…</div>
    </div>

    <p class="center muted" style="font-size:12px">「最終登録」を押すと保存され、本部アプリに反映されます。金額は普段の入力ルール（税抜など）に合わせてください。</p>
  </div>
</div>

<script>
  var KINDS = ['廃棄ロス','必要ロス','理論原価'];
  var CATS = ['フード','ドリンク'];
  var TAGCLS = { '廃棄ロス':'waste', '必要ロス':'need', '理論原価':'theory' };

  var M = null;          // 棚数値の土台（サーバから）
  var SAVED = [];        // 登録済みのロス/理論原価
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function yen(n){ return (n==null||isNaN(n))?'—':('¥'+Math.round(Number(n)).toLocaleString('ja-JP')); }
  function pct(n){ return (n==null||isNaN(n))?'':('（売上比 '+(n*100).toFixed(1)+'%）'); }

  // ── 入力行 ──
  function rowHtml(idx){
    var opt=function(arr,sel){ return arr.map(function(v){ return '<option'+(v===sel?' selected':'')+'>'+v+'</option>'; }).join(''); };
    return '<div class="row" data-i="'+idx+'">'+
      '<div class="rowhead"><span class="muted">項目 '+(idx+1)+'</span>'+
        '<button class="btn del sm" type="button" onclick="rmRow('+idx+')">削除</button></div>'+
      '<div class="grid">'+
        '<div><label>種別</label><select class="k" onchange="onKindChange(this);recalc()">'+opt(KINDS)+'</select></div>'+
        '<div><label>区分</label><select class="c" onchange="recalc()">'+opt(CATS)+'</select></div>'+
      '</div>'+
      '<label>金額（円）</label><input class="a" type="number" inputmode="numeric" min="1" step="1" placeholder="例: 3000" oninput="recalc()">'+
      '<label class="memoLbl">内容（メモ）</label><input class="m" type="text" maxlength="200" placeholder="例: キャベツ廃棄 / 賄い分 など">'+
    '</div>';
  }
  var rowN=0;
  function addRow(){ var d=document.createElement('div'); d.innerHTML=rowHtml(rowN++); el('rows').appendChild(d.firstChild); recalc(); }
  function rmRow(i){ var n=document.querySelector('.row[data-i="'+i+'"]'); if(n) n.parentNode.removeChild(n); if(!el('rows').children.length) addRow(); recalc(); }

  // 種別が「理論原価」なら内容ラベルを「変更理由」に、担当者必須を促す
  function onKindChange(sel){
    var row=sel.closest('.row'); var lbl=row.querySelector('.memoLbl'); var m=row.querySelector('.m');
    if(sel.value==='理論原価'){ lbl.textContent='変更理由（必須）'; m.placeholder='例: 急な宴会の仕入で理論原価を修正'; }
    else { lbl.textContent='内容（メモ）'; m.placeholder='例: キャベツ廃棄 / 賄い分 など'; }
    reflectNameReq();
  }
  function hasTheoryDraft(){
    var rows=el('rows').querySelectorAll('.row');
    for(var i=0;i<rows.length;i++){ if(rows[i].querySelector('.k').value==='理論原価'){
      var a=rows[i].querySelector('.a').value, m=rows[i].querySelector('.m').value.trim();
      if(a!=='' || m!=='') return true;
    }}
    return false;
  }
  function reflectNameReq(){
    var need=hasTheoryDraft();
    el('nameReq').style.display = need?'inline':'none';
    el('nameNotice').className = need?'notice on':'notice';
    el('who').className = (need && !el('who').value.trim())?'req-on':'';
  }
  function onNameInput(){ reflectNameReq(); }

  function collect(){
    var out=[], rows=el('rows').querySelectorAll('.row');
    for(var i=0;i<rows.length;i++){
      var r=rows[i], a=r.querySelector('.a').value, m=r.querySelector('.m').value.trim();
      if(a==='' && m==='') continue;   // 空行はスキップ
      out.push({ kind:r.querySelector('.k').value, cat:r.querySelector('.c').value, amount:Number(a), memo:m });
    }
    return out;
  }

  // 区分ごとのロス集計（FD=全て / F=フード / D=ドリンク）
  function sums(items, mode){
    var need=0,waste=0,theoryAdj=0;
    items.forEach(function(l){
      if(mode==='F' && l.cat!=='フード') return;
      if(mode==='D' && l.cat!=='ドリンク') return;
      var amt=Number(l.amount)||0;
      if(l.kind==='必要ロス') need+=amt;
      else if(l.kind==='廃棄ロス') waste+=amt;
      else if(l.kind==='理論原価') theoryAdj+=amt;
    });
    return { need:need, waste:waste, theoryAdj:theoryAdj };
  }
  // 選択区分の土台値（F/D はそのまま、FD は f+d）
  function baseOf(mode){
    var f=M.f||{}, d=M.d||{};
    if(mode==='F') return f;
    if(mode==='D') return d;
    var addN=function(a,b){ return (a==null&&b==null)?null:((a||0)+(b||0)); };
    return { sales:(f.sales||0)+(d.sales||0), purchase:(f.purchase||0)+(d.purchase||0),
      theoryBase:(f.theoryBase||0)+(d.theoryBase||0), invCur:addN(f.invCur,d.invCur), invPrev:addN(f.invPrev,d.invPrev) };
  }
  // 区分ごとに8指標を計算（アプリの calcM と同式）
  function compute(mode, all){
    var b=baseOf(mode), s=sums(all, mode);
    var theory=(b.theoryBase||0)+s.theoryAdj;
    var invCur=(b.invCur==null?null:b.invCur), invPrev=(b.invPrev==null?null:b.invPrev);
    var actual=(invPrev!=null && invCur!=null)?(invPrev+(b.purchase||0)-invCur):null;
    var unknown=(actual!=null)?(actual-theory-s.need-s.waste):null;
    var theoryDays=M.interim?15:(M.days||30);
    var turnover=(invCur!=null && theory>0)?(invCur/(theory/theoryDays)):null;
    var sales=b.sales||0;
    return { sales:sales, invPrev:invPrev, purchase:(b.purchase||0), invCur:invCur, actual:actual,
      theory:theory, need:s.need, waste:s.waste, unknown:unknown, turnover:turnover,
      theoryRate:(sales?theory/sales:null), unknownRate:(sales&&unknown!=null?unknown/sales:null) };
  }
  function recalc(){
    if(!M){ return; }
    var draft=collect();
    var all=SAVED.concat(draft);
    var fd=compute('FD',all), f=compute('F',all), d=compute('D',all);

    // 行定義（合計/フード/ドリンクを1行に横並び）
    var ROWS=[
      { l:'前月棚金', k:'invPrev' },
      { l:'当月仕入', k:'purchase' },
      { l:'当月棚金', k:'invCur' },
      { l:'当月実使用', k:'actual', strong:true },
      { l:'理論原価', k:'theory' },
      { l:'必要ロス', k:'need', indent:true },
      { l:'廃棄ロス', k:'waste', indent:true },
      { l:'不明ロス', k:'unknown', strong:true, unk:true }
    ];
    var html='<tr class="head"><td class="lbl">項目</td><td class="num">合計</td><td class="num">フード</td><td class="num">ドリンク</td></tr>';
    ROWS.forEach(function(r){
      function cell(x){
        var v=x[r.k];
        var cls='num'+(r.unk?(v==null?'':(v>0?' pos':' neg')):'');
        return '<td class="'+cls+'">'+yen(v)+'</td>';
      }
      html+='<tr'+(r.strong?' class="strong"':'')+'><td class="lbl'+(r.indent?' indent':'')+'">'+r.l+'</td>'+
        cell(fd)+cell(f)+cell(d)+'</tr>';
    });
    var tbl=el('sumtbl'); tbl.innerHTML=html;
    tbl.classList.remove('updated'); void tbl.offsetWidth; if(draft.length) tbl.classList.add('updated');

    // 上部チップ（合計基準の要点）
    var chips=[];
    if(fd.sales) chips.push('<span class="sales">売上 '+yen(fd.sales)+'</span>');
    if(fd.theoryRate!=null) chips.push('<span class="turn">原価率 '+(fd.theoryRate*100).toFixed(1)+'%</span>');
    if(fd.turnover!=null) chips.push('<span class="turn">在庫回転 '+fd.turnover.toFixed(1)+'日</span>');
    if(fd.unknownRate!=null) chips.push('<span class="turn">不明ロス '+(fd.unknownRate*100).toFixed(1)+'%</span>');
    el('sumChips').innerHTML=chips.join('');

    el('liveTag').textContent = draft.length? '（入力中の速報）' : '（登録済みの内容）';
    if(!M.hasData){ el('kpiNote').textContent='※ この月のデータ（売上・仕入・棚卸高）がまだ取り込まれていません。ロスの入力は先にできます。'; }
    else if(fd.invCur==null || fd.invPrev==null){ el('kpiNote').textContent='※ 棚卸高が未取得のため、当月実使用・不明ロスは「—」表示です（ロス・理論原価は登録できます）。'; }
    else { el('kpiNote').textContent=''; }
  }

  function setMsg(t,cls){ var m=el('msg'); m.textContent=t; m.className=cls||''; if(!cls) m.style.display='none'; }

  function save(){
    var items=collect();
    if(!items.length){ setMsg('入力された項目がありません。金額と内容を入れてください。','err'); return; }
    var name=el('who').value.trim();
    var needName=false;
    for(var i=0;i<items.length;i++){ if(items[i].kind==='理論原価') needName=true; }
    if(needName && !name){ setMsg('理論原価の変更には担当者名が必要です。上の「担当者名」を入力してください。','err'); el('who').className='req-on'; el('who').focus(); return; }
    // 担当者名を全項目に付与（誰が入力したか記録）
    items.forEach(function(it){ it.name=name; });

    var btn=el('saveBtn'); btn.disabled=true; btn.textContent='登録中…'; setMsg('');
    var done=false;
    var to=setTimeout(function(){ if(done) return; btn.disabled=false; btn.textContent='✅ 最終登録する（アプリに反映）'; setMsg('時間がかかっています。通信状況をご確認のうえ、もう一度お試しください。','err'); }, 20000);
    google.script.run
      .withSuccessHandler(function(res){ done=true; clearTimeout(to); btn.disabled=false; btn.textContent='✅ 最終登録する（アプリに反映）';
        if(res&&res.ok){ setMsg('✅ '+res.recs.length+'件を登録しました。本部アプリに反映されます。','ok'); el('rows').innerHTML=''; rowN=0; addRow(); reflectNameReq(); loadCur(); }
        else { setMsg('登録できませんでした: '+((res&&res.message)||'不明なエラー'),'err'); } })
      .withFailureHandler(function(e){ done=true; clearTimeout(to); btn.disabled=false; btn.textContent='✅ 最終登録する（アプリに反映）'; setMsg('通信エラー: '+((e&&e.message)||''),'err'); })
      .saveInputLosses(STORE, YM, TOKEN, items);
  }

  function delItem(id){
    if(!confirm('この項目を削除しますか？')) return;
    google.script.run
      .withSuccessHandler(function(res){ if(res&&res.ok){ loadCur(); } else { alert('削除できませんでした: '+((res&&res.message)||'')); } })
      .withFailureHandler(function(e){ alert('通信エラー: '+((e&&e.message)||'')); })
      .deleteInputLoss(STORE, YM, TOKEN, id);
  }
  window.delItem=delItem;

  function renderCur(items){
    el('curCount').textContent = items.length ? (items.length+'件') : '';
    if(!items.length){ el('cur').innerHTML='<span class="muted">まだありません。</span>'; return; }
    var total=0;
    var html=items.map(function(it){ total+=Number(it.amount)||0;
      var who = it.name? ('<span class="who">・'+esc(it.name)+'</span>') : '';
      return '<div class="item"><div><span class="tag '+(TAGCLS[it.kind]||'')+'">'+esc(it.kind)+'</span>'+
        '<span class="muted">'+esc(it.cat)+'</span>'+who+'<div>'+esc(it.memo)+'</div></div>'+
        '<div style="text-align:right"><div class="amt">'+yen(it.amount)+'</div>'+
        '<button class="btn del sm" type="button" onclick="delItem(\''+esc(it.id)+'\')">削除</button></div></div>'; }).join('');
    el('cur').innerHTML = html + '<div class="item"><b>合計</b><b class="amt">'+yen(total)+'</b></div>';
  }

  function loadCur(){
    el('cur').innerHTML='<span class="muted">読み込み中…</span>';
    google.script.run
      .withSuccessHandler(function(res){
        if(res&&res.ok){ SAVED=res.items||[]; M=res.metrics||M; renderCur(SAVED); recalc(); }
        else { el('cur').innerHTML='<span class="muted">読み込めませんでした。</span>'; } })
      .withFailureHandler(function(e){ el('cur').innerHTML='<span class="muted">通信エラー。再読み込みしてください。</span>'; })
      .getInputPageData(STORE, YM, TOKEN);
  }

  (function init(){
    if(VALID!=='1'){ el('invalid').style.display='block'; return; }
    el('app').style.display='block';
    var m=YM.match(/^(\d{4})-(\d{2})$/);
    el('ttl').textContent = STORE_NAME + ' 棚卸入力';
    el('ttlsub').textContent = m ? (m[1]+'年'+(+m[2])+'月分') : YM;
    el('curTtl').textContent = (m ? (+m[2])+'月' : YM) + ' の登録済み';
    addRow();
    reflectNameReq();
    loadCur();
  })();
</script>
</body>
</html>
