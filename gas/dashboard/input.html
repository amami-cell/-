<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>棚卸 入力</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --line:#e5e7eb; --ink:#1f2937; --sub:#6b7280; --brand:#2563eb; --red:#dc2626; --ok:#16a34a; --amber:#b45309; --teal:#0e7490; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; font-size:15px; line-height:1.6; }
  .wrap{ max-width:640px; margin:0 auto; padding:16px 14px 90px; }
  h1{ font-size:19px; margin:4px 0 2px; }
  .sub{ color:var(--sub); font-size:13px; margin-bottom:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .card h2{ font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .muted{ color:var(--sub); font-size:13px; }
  label{ display:block; font-size:12px; color:var(--sub); margin:8px 0 2px; }
  input[type=text],input[type=number]{ width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; font-size:16px; background:#fff; }
  /* 棚数値の表 */
  .sumhead{ display:flex; justify-content:flex-start; align-items:center; gap:6px; margin-bottom:10px; font-size:13px; color:var(--sub); flex-wrap:wrap; }
  .sumhead .sales{ color:var(--ink); font-weight:700; }
  .sumhead .turn{ background:#eef2ff; color:var(--brand); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:700; white-space:nowrap; }
  .sumhead .legend{ color:var(--sub); font-size:11px; }
  table.items{ width:100%; border-collapse:collapse; table-layout:fixed; min-width:360px; }
  table.items td{ border-bottom:1px solid var(--line); padding:7px 6px; font-size:13px; vertical-align:middle; }
  table.items tr:last-child td{ border-bottom:0; }
  table.items td.lbl{ width:28%; color:var(--sub); white-space:nowrap; }
  table.items td.num{ width:24%; text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:600; }
  table.items td.num .amt{ display:block; }
  table.items td.num .r{ display:block; font-size:10px; color:var(--sub); font-weight:400; margin-top:1px; }
  table.items td.pos{ color:var(--red); } table.items td.neg{ color:var(--ok); }
  table.items td.pos .r, table.items td.neg .r{ color:var(--sub); }
  table.items tr.head td{ color:var(--sub); font-size:11px; background:#f9fafb; font-weight:600; text-align:right; }
  table.items tr.head td.lbl{ text-align:left; }
  table.items tr.strong td{ font-weight:800; background:#f9fafb; }
  table.items td.indent{ padding-left:1.2em; }
  /* タップ可能なロス入力セル */
  td.tap{ cursor:pointer; background:#f0f7ff; border:1px dashed #bfdbfe !important; border-radius:8px; }
  td.tap:active{ background:#e0efff; }
  td.tap .plus{ display:block; font-size:10px; color:var(--brand); font-weight:700; margin-top:2px; }
  #sumtbl.updated{ animation:fl .7s ease; }
  @keyframes fl{ from{ background:#fef9c3; } to{ background:transparent; } }
  /* 追加パネル */
  #panel{ display:none; border:1px solid #bfdbfe; background:#f8fbff; border-radius:12px; padding:12px; margin-top:12px; }
  #panel.on{ display:block; }
  #panel .ttl{ font-weight:800; font-size:15px; }
  #panel .tag{ display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; margin-right:6px; }
  .tag.waste{ background:#fef2f2; color:var(--red); } .tag.need{ background:#fff7ed; color:var(--amber); } .tag.theory{ background:#ecfeff; color:var(--teal); } .tag.food{ background:#eef2ff; color:var(--brand);} .tag.drink{ background:#ecfeff; color:var(--teal);}
  .btnrow{ display:flex; gap:8px; margin-top:10px; }
  .btn{ border:0; border-radius:9px; padding:12px 14px; font-size:15px; font-weight:700; cursor:pointer; }
  .btn.primary{ background:var(--ok); color:#fff; flex:1; }
  .btn.ghost{ background:#eef2ff; color:var(--brand); }
  .btn.danger{ background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  .tseg{ display:flex; gap:4px; background:#eef2f7; border-radius:9px; padding:3px; }
  .tseg button{ flex:1; border:0; background:transparent; border-radius:7px; padding:7px 4px; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer; }
  .tseg button.on{ background:#fff; color:var(--brand); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .btn:disabled{ opacity:.55; }
  #pmsg{ margin-top:8px; font-size:13px; display:none; }
  #pmsg.ok{ color:var(--ok); display:block; } #pmsg.err{ color:var(--red); display:block; }
  /* 下部：ロス詳細 2列 */
  .lcols{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lcol h3{ font-size:13px; margin:0 0 6px; color:var(--sub); }
  .litem{ border-bottom:1px solid var(--line); padding:7px 0; font-size:13px; }
  .litem:last-child{ border-bottom:0; }
  .litem .top{ display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .litem .memo{ overflow-wrap:anywhere; }
  .litem .amt{ font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
  .litem .who{ font-size:11px; color:var(--sub); }
  .litem .del{ border:0; background:transparent; color:var(--red); font-size:14px; cursor:pointer; padding:0 2px; }
  .litem .edit{ border:0; background:transparent; color:var(--brand); font-size:14px; cursor:pointer; padding:0 2px; }
  .ltag{ display:inline-block; font-size:10px; padding:0 6px; border-radius:999px; margin-right:4px; }
  .lsub{ text-align:right; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums; border-top:1px solid var(--line); padding-top:6px; }
  /* 種別グループ（廃棄/必要/理論原価）を色帯で軽く区切る */
  .lgroup{ margin-bottom:8px; padding-left:7px; border-left:3px solid var(--line); }
  .lgroup.waste{ border-left-color:#fca5a5; }
  .lgroup.need{ border-left-color:#fdba74; }
  .lgroup.theory{ border-left-color:#67e8f9; }
  .ghead{ display:flex; justify-content:space-between; align-items:center; margin:1px 0 2px; }
  .gsub{ font-size:12px; color:var(--sub); font-weight:700; font-variant-numeric:tabular-nums; }
  .lgroup .litem{ padding:5px 0; }
  .empty{ color:var(--sub); font-size:12px; padding:8px 0; }
  .center{ text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <script>
    var STORE = '<?= STORE ?>';
    var YM = '<?= YM ?>';
    var TOKEN = '<?= TOKEN ?>';
    var STORE_NAME = '<?= STORE_NAME ?>';
    var VALID = '<?= VALID ?>';
  </script>

  <div id="invalid" class="card" style="display:none">
    <h1>リンクが無効です</h1>
    <p class="muted">このリンクは期限切れか、月・店舗が一致していません。最新の月のリンクをご利用いただくか、本部にお問い合わせください。</p>
  </div>

  <div id="app" style="display:none">
    <h1 id="ttl">棚卸 入力</h1>
    <div class="sub" id="ttlsub"></div>

    <!-- 棚数値（デフォルト表示） -->
    <div class="card">
      <h2 id="sumTtl">棚数値 <span class="muted" id="liveTag" style="font-weight:400;font-size:12px"></span></h2>
      <div class="sumhead" id="sumChips"></div>
      <div style="overflow-x:auto"><table class="items" id="sumtbl"></table></div>
      <div class="muted" id="kpiNote" style="margin-top:8px;font-size:12px"></div>
      <div class="muted" style="margin-top:6px;font-size:12px">💡 <b>必要ロス・廃棄ロス・理論原価</b>の「フード」「ドリンク」欄をタップすると、その場で入力できます。</div>

      <!-- 追加パネル（セルをタップで開く） -->
      <div id="panel">
        <div class="ttl"><span id="pTag"></span><span id="pTtl"></span></div>
        <div id="pEditKC" style="display:none">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div><label>種別</label><select id="pKindSel" onchange="onEditKind()" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff"></select></div>
            <div><label>区分</label><select id="pCatSel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff"></select></div>
          </div>
        </div>
        <div id="pTheoryMode" style="display:none;margin:2px 0">
          <div class="tseg">
            <button type="button" id="mAdd" class="on" onclick="setTheoryMode('add')">＋ 加算</button>
            <button type="button" id="mSet" onclick="setTheoryMode('set')">合計を訂正</button>
          </div>
        </div>
        <label id="pAmtLbl">金額（円）</label>
        <input id="pAmt" type="number" inputmode="numeric" step="1" placeholder="例: 3000">
        <div id="pHint" class="muted" style="font-size:12px;margin-top:3px;display:none"></div>
        <label id="pMemoLbl">内容（メモ）</label>
        <input id="pMemo" type="text" maxlength="200" placeholder="例: キャベツ廃棄 / 賄い分 など">
        <div id="pNameWrap" style="display:none">
          <label>担当者名（必須）</label>
          <input id="pName" type="text" maxlength="40" placeholder="変更した人の名前">
        </div>
        <div id="pmsg"></div>
        <div class="btnrow">
          <button class="btn primary" id="pAdd" type="button" onclick="doAdd()">＋ 追加する</button>
          <button class="btn ghost" type="button" onclick="closePanel()">閉じる</button>
        </div>
        <button class="btn danger" id="pDel" type="button" style="display:none;width:100%;margin-top:8px" onclick="delFromPanel()">🗑 この項目を削除</button>
      </div>
    </div>

    <!-- 下部：登録済みロス詳細（フード｜ドリンク 2列） -->
    <div class="card">
      <h2>📝 登録した内容 <span class="muted" id="curCount" style="font-weight:400;font-size:12px"></span></h2>
      <div class="lcols">
        <div class="lcol"><h3>🍽 フード</h3><div id="colF"></div></div>
        <div class="lcol"><h3>🥤 ドリンク</h3><div id="colD"></div></div>
      </div>
    </div>

    <p class="center muted" style="font-size:12px">入力するとすぐ保存され、本部アプリに反映されます。金額は普段の入力ルール（税抜など）に合わせてください。</p>
  </div>
</div>

<script>
  var KIND_TAG = { '廃棄ロス':'waste', '必要ロス':'need', '理論原価':'theory' };
  var KINDS = ['廃棄ロス','必要ロス','理論原価'];
  var CATS = ['フード','ドリンク'];
  var M = null;      // 棚数値の土台（f/d）
  var SAVED = [];    // 登録済みのロス/理論原価
  var PANEL = null;  // { kind, cat }
  var editId = null; // 修正中の項目ID（null=新規追加）
  var theoryMode = 'add'; // 理論原価の入力方式 'add'=加算 / 'set'=合計を訂正
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function el(id){ return document.getElementById(id); }
  function yen(n){ return (n==null||isNaN(n))?'—':('¥'+Math.round(Number(n)).toLocaleString('ja-JP')); }
  function mLabel(){ var m=YM.match(/^(\d{4})-(\d{2})$/); return m?(+m[2]+'月'):YM; }

  // ── 計算（アプリの calcM と同式）──
  function sums(items, mode){
    var need=0,waste=0,theoryAdj=0;
    items.forEach(function(l){
      if(mode==='F' && l.cat!=='フード') return;
      if(mode==='D' && l.cat!=='ドリンク') return;
      var amt=Number(l.amount)||0;
      if(l.kind==='必要ロス') need+=amt;
      else if(l.kind==='廃棄ロス') waste+=amt;
      else if(l.kind==='理論原価') theoryAdj+=amt;
    });
    return { need:need, waste:waste, theoryAdj:theoryAdj };
  }
  function baseOf(mode){
    var f=(M&&M.f)||{}, d=(M&&M.d)||{};
    if(mode==='F') return f;
    if(mode==='D') return d;
    var addN=function(a,b){ return (a==null&&b==null)?null:((a||0)+(b||0)); };
    return { sales:(f.sales||0)+(d.sales||0), purchase:(f.purchase||0)+(d.purchase||0),
      theoryBase:(f.theoryBase||0)+(d.theoryBase||0), invCur:addN(f.invCur,d.invCur), invPrev:addN(f.invPrev,d.invPrev) };
  }
  function compute(mode){
    var b=baseOf(mode), s=sums(SAVED, mode);
    var theory=(b.theoryBase||0)+s.theoryAdj;
    var invCur=(b.invCur==null?null:b.invCur), invPrev=(b.invPrev==null?null:b.invPrev);
    var actual=(invPrev!=null && invCur!=null)?(invPrev+(b.purchase||0)-invCur):null;
    var unknown=(actual!=null)?(actual-theory-s.need-s.waste):null;
    var theoryDays=(M&&M.interim)?15:((M&&M.days)||30);
    var turnover=(invCur!=null && theory>0)?(invCur/(theory/theoryDays)):null;
    var sales=b.sales||0;
    return { sales:sales, invPrev:invPrev, purchase:(b.purchase||0), invCur:invCur, actual:actual,
      theory:theory, need:s.need, waste:s.waste, unknown:unknown, turnover:turnover };
  }

  function render(){
    el('sumTtl').innerHTML = mLabel()+' 棚数値 <span class="muted" id="liveTag" style="font-weight:400;font-size:12px"></span>';
    var fd=compute('FD'), f=compute('F'), d=compute('D');
    // 行: k=キー, loss=入力可能な種別（あれば F/D セルをタップ可能に）
    var ROWS=[
      { l:'前月棚金', k:'invPrev' },
      { l:'当月仕入', k:'purchase' },
      { l:'当月棚金', k:'invCur' },
      { l:'当月実使用', k:'actual', strong:true },
      { l:'理論原価', k:'theory', loss:'理論原価' },
      { l:'必要ロス', k:'need', loss:'必要ロス', indent:true },
      { l:'廃棄ロス', k:'waste', loss:'廃棄ロス', indent:true },
      { l:'不明ロス', k:'unknown', strong:true, unk:true }
    ];
    function cell(x, mode, row){
      var v=x[row.k];
      // 売上比は全列とも「総売上(FD)」に対して（同じ金額なら同じ％）。
      var rt=(v!=null && fd.sales)?((v/fd.sales*100).toFixed(1)+'%'):'';
      var body='<span class="amt">'+yen(v)+'</span>'+(rt?'<span class="r">'+rt+'</span>':'');
      if(row.loss && (mode==='F'||mode==='D')){
        var cat=mode==='F'?'フード':'ドリンク';
        var hint=row.loss==='理論原価'?'＋修正':'＋入力';
        return '<td class="num tap" onclick="openAdd(\''+row.loss+'\',\''+cat+'\')">'+body+'<span class="plus">'+hint+'</span></td>';
      }
      var cls='num'+(row.unk?(v==null?'':(v>0?' pos':' neg')):'');
      return '<td class="'+cls+'">'+body+'</td>';
    }
    var html='<tr class="head"><td class="lbl">項目</td><td class="num">FD</td><td class="num">フード</td><td class="num">ドリンク</td></tr>';
    ROWS.forEach(function(r){
      html+='<tr'+(r.strong?' class="strong"':'')+'><td class="lbl'+(r.indent?' indent':'')+'">'+r.l+'</td>'+
        cell(fd,'FD',r)+cell(f,'F',r)+cell(d,'D',r)+'</tr>';
    });
    el('sumtbl').innerHTML=html;

    var chips=[];
    if(fd.sales) chips.push('<span class="sales">売上 '+yen(fd.sales)+'</span>');
    var tv=[];
    if(f.turnover!=null) tv.push('F '+f.turnover.toFixed(1)+'日');
    if(d.turnover!=null) tv.push('D '+d.turnover.toFixed(1)+'日');
    if(fd.turnover!=null) tv.push('FD '+fd.turnover.toFixed(1)+'日');
    if(tv.length) chips.push('<span class="turn">在庫回転日数 '+tv.join('　')+'</span>');
    chips.push('<span class="legend">数字の下＝総売上比</span>');
    el('sumChips').innerHTML=chips.join('');

    if(!M){ el('kpiNote').textContent='棚数値を計算中…（先にロスの入力ができます）'; }
    else if(!M.hasData){ el('kpiNote').textContent='※ この月のデータ（売上・仕入・棚卸高）がまだ取り込まれていません。ロスの入力は先にできます。'; }
    else if(fd.invCur==null || fd.invPrev==null){ el('kpiNote').textContent='※ 棚卸高が未取得のため、当月実使用・不明ロスは「—」表示です（ロス・理論原価は登録できます）。'; }
    else { el('kpiNote').textContent=''; }

    renderDetail();
  }

  // 下部：フード/ドリンクの登録詳細
  function renderDetail(){
    el('curCount').textContent = SAVED.length? ('計'+SAVED.length+'件') : '';
    var ORDER=['必要ロス','廃棄ロス','理論原価'];   // 必要→廃棄→理論原価。下の合計はロス2種のみ。
    ['フード','ドリンク'].forEach(function(cat){
      var box = el(cat==='フード'?'colF':'colD');
      var items = SAVED.filter(function(it){ return it.cat===cat; });
      if(!items.length){ box.innerHTML='<div class="empty">まだありません</div>'; return; }
      var html=''; var lossTotal=0; var hasLoss=false;
      ORDER.forEach(function(kind){
        var g=items.filter(function(it){ return it.kind===kind; });
        if(!g.length) return;
        var tag=KIND_TAG[kind]||''; var sub=0; var isLoss=(kind!=='理論原価');
        var rows=g.map(function(it){ var a=Number(it.amount)||0; sub+=a; if(isLoss){ lossTotal+=a; hasLoss=true; }
          var who=it.name?('<span class="who">・'+esc(it.name)+'</span>'):'';
          return '<div class="litem"><div class="top"><div class="memo">'+esc(it.memo)+who+'</div>'+
            '<div style="display:flex;align-items:center;gap:4px"><span class="amt">'+yen(it.amount)+'</span>'+
            '<button class="edit" type="button" title="修正・削除" onclick="openEdit(\''+esc(it.id)+'\')">✎ 修正</button></div></div></div>';
        }).join('');
        html+='<div class="lgroup '+tag+'"><div class="ghead"><span class="ltag '+tag+'">'+esc(kind)+'</span>'+
          '<span class="gsub">'+yen(sub)+'</span></div>'+rows+'</div>';
      });
      // 下のまとめ合計は無し（各グループの小計で足りるため）。
      box.innerHTML = html;
    });
  }

  // ── 追加/修正パネル ──
  function memoLabelFor(kind){ return (kind==='理論原価')?'変更理由（必須）':'内容（メモ）'; }
  function memoPhFor(kind){ return (kind==='理論原価')?'例: 急な宴会の仕入で理論原価を修正':'例: キャベツ廃棄 / 賄い分 など'; }
  // 理論原価の入力方式トグル（加算 / 合計を訂正）
  function setTheoryMode(m){
    theoryMode=m;
    el('mAdd').className = (m==='add')?'on':'';
    el('mSet').className = (m==='set')?'on':'';
    updateAmtUI();
  }
  function updateAmtUI(){
    var isTheory = (PANEL && PANEL.kind==='理論原価');
    if(isTheory && theoryMode==='set'){
      el('pAmtLbl').textContent='訂正後の理論原価（この金額にする）';
      el('pAmt').placeholder='例: 4300000';
      var mode2=(PANEL.cat==='フード'?'F':'D');
      var cur=(M? compute(mode2).theory : null);
      el('pHint').style.display='block';
      el('pHint').textContent='現在の'+PANEL.cat+'理論原価: '+(cur==null?'計算中…':yen(cur))+' → 入力額に訂正（差分を記録）';
    } else if(isTheory){
      el('pAmtLbl').textContent='加算する金額（円）';
      el('pAmt').placeholder='例: 50000';
      el('pHint').style.display='none';
    } else {
      el('pAmtLbl').textContent='金額（円）';
      el('pAmt').placeholder='例: 3000';
      el('pHint').style.display='none';
    }
  }
  window.setTheoryMode=setTheoryMode;
  function opt(arr,sel){ return arr.map(function(v){ return '<option'+(v===sel?' selected':'')+'>'+v+'</option>'; }).join(''); }

  // 新規追加（セルタップ）: 種別・区分は固定
  function openAdd(kind, cat){
    editId = null; PANEL = { kind:kind, cat:cat };
    var catCls = cat==='フード'?'food':'drink';
    el('pTag').style.display=''; el('pEditKC').style.display='none';
    el('pTag').innerHTML = '<span class="tag '+(KIND_TAG[kind]||'')+'">'+esc(kind)+'</span><span class="tag '+catCls+'">'+esc(cat)+'</span> ';
    el('pTtl').textContent = 'を追加';
    el('pMemoLbl').textContent = memoLabelFor(kind);
    el('pMemo').placeholder = memoPhFor(kind);
    el('pNameWrap').style.display = (kind==='理論原価')?'block':'none';
    el('pAmt').value=''; el('pMemo').value=''; el('pName').value='';
    el('pAdd').textContent='＋ 追加する';
    el('pDel').style.display='none';
    theoryMode='add';
    if(kind==='理論原価'){ el('pTheoryMode').style.display='block'; el('mAdd').className='on'; el('mSet').className=''; }
    else { el('pTheoryMode').style.display='none'; }
    updateAmtUI();
    setPMsg('');
    el('panel').classList.add('on');
    el('panel').scrollIntoView({ behavior:'smooth', block:'center' });
    el('pAmt').focus();
  }
  // 修正（登録後）: 種別・区分も変更できる
  function openEdit(id){
    var it=null; for(var i=0;i<SAVED.length;i++){ if(String(SAVED[i].id)===String(id)){ it=SAVED[i]; break; } }
    if(!it){ alert('項目が見つかりません。'); return; }
    editId = id; PANEL = null;
    el('pTag').style.display='none'; el('pEditKC').style.display='block';
    el('pKindSel').innerHTML = opt(KINDS, it.kind);
    el('pCatSel').innerHTML = opt(CATS, it.cat);
    el('pTtl').textContent = ' を修正';
    el('pMemoLbl').textContent = memoLabelFor(it.kind);
    el('pMemo').placeholder = memoPhFor(it.kind);
    el('pNameWrap').style.display = (it.kind==='理論原価')?'block':'none';
    el('pAmt').value = it.amount; el('pMemo').value = it.memo||''; el('pName').value = it.name||'';
    el('pAdd').textContent='✓ 修正を保存';
    el('pDel').style.display='block';
    el('pTheoryMode').style.display='none'; theoryMode='add';
    el('pAmtLbl').textContent='金額（円）'; el('pAmt').placeholder='例: 3000'; el('pHint').style.display='none';
    setPMsg('');
    el('panel').classList.add('on');
    el('panel').scrollIntoView({ behavior:'smooth', block:'center' });
    el('pAmt').focus();
  }
  // 修正パネルで種別を変えたら 内容ラベル・担当者欄を追従
  function onEditKind(){
    var kind=el('pKindSel').value;
    el('pMemoLbl').textContent = memoLabelFor(kind);
    el('pMemo').placeholder = memoPhFor(kind);
    el('pNameWrap').style.display = (kind==='理論原価')?'block':'none';
  }
  function closePanel(){ el('panel').classList.remove('on'); PANEL=null; editId=null; }
  function setPMsg(t,cls){ var m=el('pmsg'); m.textContent=t||''; m.className=cls||''; }

  function doAdd(){
    var isEdit = !!editId;
    var kind = isEdit ? el('pKindSel').value : (PANEL&&PANEL.kind);
    var cat  = isEdit ? el('pCatSel').value  : (PANEL&&PANEL.cat);
    if(!kind||!cat) return;
    var amtIn=Number(el('pAmt').value), memo=el('pMemo').value.trim(), name=el('pName').value.trim();
    if(!isFinite(amtIn)){ setPMsg('金額を入力してください。','err'); el('pAmt').focus(); return; }
    var isTheory=(kind==='理論原価');
    var storedAmt, noteSuffix='';
    if(isTheory && !isEdit && theoryMode==='set'){
      // 合計を訂正: 入力額を目標に、差分を記録する
      if(amtIn<0){ setPMsg('訂正後の金額は0以上で入力してください。','err'); el('pAmt').focus(); return; }
      var mode2=(cat==='フード'?'F':'D');
      var cur=(M? compute(mode2).theory : null);
      if(cur==null){ setPMsg('棚数値の計算待ちです。数秒後にもう一度お試しください。','err'); return; }
      storedAmt=Math.round(amtIn-cur);
      if(storedAmt===0){ setPMsg('現在（'+yen(cur)+'）と同じ金額です。','err'); return; }
      noteSuffix='（→'+yen(amtIn)+'に訂正）';
    } else {
      storedAmt=Math.round(amtIn);
      if(isTheory){ if(storedAmt===0){ setPMsg('金額を入力してください。','err'); el('pAmt').focus(); return; } }
      else { if(storedAmt<=0){ setPMsg('金額を1円以上で入力してください。','err'); el('pAmt').focus(); return; } }
    }
    if(!memo){ setPMsg((isTheory?'変更理由':'内容')+'を入力してください。','err'); el('pMemo').focus(); return; }
    if(isTheory && !name){ setPMsg('担当者名を入力してください。','err'); el('pName').focus(); return; }
    var item={ kind:kind, cat:cat, amount:storedAmt, memo:memo+noteSuffix, name:name };

    if(isEdit){
      // 楽観更新: 先に反映して閉じ、裏で保存。失敗したら元に戻す。
      var id=editId, old=null;
      for(var i=0;i<SAVED.length;i++){ if(String(SAVED[i].id)===String(id)){ old={kind:SAVED[i].kind,cat:SAVED[i].cat,amount:SAVED[i].amount,memo:SAVED[i].memo,name:SAVED[i].name}; SAVED[i].kind=item.kind; SAVED[i].cat=item.cat; SAVED[i].amount=item.amount; SAVED[i].memo=item.memo; SAVED[i].name=item.name; break; } }
      render(); closePanel();
      google.script.run
        .withSuccessHandler(function(res){ if(!(res&&res.ok)){ revertEdit(id,old); alert('修正できませんでした: '+((res&&res.message)||'')); } })
        .withFailureHandler(function(e){ revertEdit(id,old); alert('通信エラーで修正できませんでした。もう一度お試しください。'); })
        .updateInputLoss(STORE, YM, TOKEN, id, item);
    } else {
      // 楽観更新: 仮IDで即表示、裏で保存。成功したら本IDに差し替え、失敗したら取り消す。
      var tmp={ id:'tmp_'+Date.now()+'_'+Math.random().toString(36).slice(2), kind:item.kind, cat:item.cat, amount:item.amount, memo:item.memo, name:item.name };
      SAVED.push(tmp); render();
      setPMsg('✅ 追加しました。続けて入力できます。','ok'); el('pAmt').value=''; el('pMemo').value=''; el('pAmt').focus();
      google.script.run
        .withSuccessHandler(function(res){
          if(res&&res.ok&&res.recs&&res.recs[0]){ tmp.id=res.recs[0].id; tmp.ts=res.recs[0].ts; render(); }
          else { SAVED=SAVED.filter(function(x){return x!==tmp;}); render(); setPMsg('登録できませんでした: '+((res&&res.message)||'不明なエラー'),'err'); } })
        .withFailureHandler(function(e){ SAVED=SAVED.filter(function(x){return x!==tmp;}); render(); setPMsg('通信エラーで保存できませんでした。もう一度お試しください。','err'); })
        .saveInputLosses(STORE, YM, TOKEN, [item]);
    }
  }
  function revertEdit(id,old){ if(!old)return; for(var i=0;i<SAVED.length;i++){ if(String(SAVED[i].id)===String(id)){ SAVED[i].kind=old.kind;SAVED[i].cat=old.cat;SAVED[i].amount=old.amount;SAVED[i].memo=old.memo;SAVED[i].name=old.name; break; } } render(); }

  // 削除は編集パネル内からのみ（誤タップ防止）。楽観更新で即反映、失敗したら戻す。
  function delFromPanel(){
    if(!editId) return;
    if(!confirm('この項目を削除しますか？')) return;
    var id=editId, removed=null;
    SAVED=SAVED.filter(function(it){ if(String(it.id)===String(id)){ removed=it; return false; } return true; });
    render(); closePanel();
    google.script.run
      .withSuccessHandler(function(res){ if(!(res&&res.ok)){ if(removed){ SAVED.push(removed); render(); } alert('削除できませんでした: '+((res&&res.message)||'')); } })
      .withFailureHandler(function(e){ if(removed){ SAVED.push(removed); render(); } alert('通信エラーで削除できませんでした。もう一度お試しください。'); })
      .deleteInputLoss(STORE, YM, TOKEN, id);
  }
  window.openAdd=openAdd; window.openEdit=openEdit; window.onEditKind=onEditKind; window.delFromPanel=delFromPanel; window.doAdd=doAdd; window.closePanel=closePanel;

  // 分割ロード: 軽い一覧を先に、重い棚数値は並行で後追い（初回の体感を短縮）
  function loadItems(){
    google.script.run
      .withSuccessHandler(function(res){ if(res&&res.ok){ SAVED=res.items||[]; render(); } })
      .withFailureHandler(function(e){})
      .getInputItems(STORE, YM, TOKEN);
  }
  function loadMetrics(){
    google.script.run
      .withSuccessHandler(function(res){ if(res&&res.ok){ M=res.metrics||M; render(); } })
      .withFailureHandler(function(e){})
      .getInputMetricsOnly(STORE, YM, TOKEN);
  }

  (function init(){
    if(VALID!=='1'){ el('invalid').style.display='block'; return; }
    el('app').style.display='block';
    var m=YM.match(/^(\d{4})-(\d{2})$/);
    el('ttl').textContent = STORE_NAME + ' 棚卸入力';
    el('ttlsub').textContent = m ? (m[1]+'年'+(+m[2])+'月分') : YM;
    el('sumtbl').innerHTML = '<tr><td style="padding:18px;text-align:center;color:var(--sub)">棚数値を読み込み中…</td></tr>';
    el('colF').innerHTML = '<div class="empty">読み込み中…</div>';
    el('colD').innerHTML = '<div class="empty">読み込み中…</div>';
    loadItems();     // 先に一覧（速い）
    loadMetrics();   // 並行で棚数値（重い・キャッシュあり）
  })();
</script>
</body>
</html>
